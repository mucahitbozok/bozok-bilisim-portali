<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7. Dosya Yönetimi Arenası (2 Takımlı Düello) | Bozok Bilişim Portalı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --panel-border: rgba(255, 255, 255, 0.12);
            --blue: #0284c7;
            --cyan: #06b6d4;
            --green: #10b981;
            --yellow: #f59e0b;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #090d16 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 12px;
        }

        #game-frame {
            width: 100%;
            max-width: 1200px;
            min-height: 90vh;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 35px rgba(139, 92, 246, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 14px 24px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title p {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        .btn-ctrl:active {
            transform: scale(0.96);
        }

        .stat-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .card-box {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .btn-opt {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-opt:hover {
            background: rgba(79, 70, 229, 0.3);
            border-color: #818cf8;
            transform: translateY(-2px);
        }

        .btn-opt:active {
            transform: scale(0.98);
        }

        .btn-opt.correct {
            background: rgba(16, 185, 129, 0.3) !important;
            border-color: var(--green) !important;
            color: #34d399 !important;
        }

        .btn-opt.wrong {
            background: rgba(239, 68, 68, 0.3) !important;
            border-color: var(--red) !important;
            color: #f87171 !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border: none;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.45);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .feedback-box {
            margin-top: 18px;
            padding: 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 800;
            line-height: 1.5;
            display: none;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            #game-frame { min-height: 98vh; border-radius: 16px; }
            header { padding: 10px 14px; }
            main { padding: 14px; }
            .card-box { padding: 18px; }
        }

        
    </style>
</head>
<body>
    <div id="game-frame">
        <header>
            <div class="header-left">
                <div class="header-icon">👑</div>
                <div class="header-title">
                    <h1>7. Dosya Yönetimi Arenası (2 Takımlı Düello)</h1>
                    <p>BTY.5.1.6 • 6. Konu: Dosya ve Klasör Yönetimi</p>
                </div>
            </div>
            <div class="header-controls">
                <span id="stat-score" class="stat-badge" style="color:var(--yellow);"><i class="fa-solid fa-star"></i> <span id="score-val">0</span></span>
                <button class="btn-ctrl" onclick="sfx.toggleMute()" id="btn-sound"><i class="fa-solid fa-volume-high"></i></button>
                <button class="btn-ctrl" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
                <button class="btn-ctrl" onclick="restartGame()"><i class="fa-solid fa-rotate-left"></i> Yeniden</button>
            </div>
        </header>

        <main>
            
<div class="card-box" id="arena-box" style="max-width:1100px;">
    <!-- 2 Takım Skor Panosu -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
        <div style="background:rgba(2,132,199,0.25); border:2px solid #0284c7; padding:16px; border-radius:20px; text-align:center;">
            <h3 style="font-size:1.2rem; color:#38bdf8; font-weight:900;">🔵 Mavi Takım (Takım A)</h3>
            <div id="team-a-score" style="font-size:2.4rem; font-weight:900; color:#fff; margin:6px 0;">0 Puan</div>
            <div style="display:flex; justify-content:center; gap:8px;">
                <button class="btn-ctrl" onclick="addScore('A', 10)">+10</button>
                <button class="btn-ctrl" onclick="addScore('A', 20)">+20</button>
                <button class="btn-ctrl" onclick="addScore('A', 30)">+30</button>
            </div>
        </div>

        <div style="background:rgba(234,88,12,0.25); border:2px solid #ea580c; padding:16px; border-radius:20px; text-align:center;">
            <h3 style="font-size:1.2rem; color:#fb923c; font-weight:900;">🟠 Turuncu Takım (Takım B)</h3>
            <div id="team-b-score" style="font-size:2.4rem; font-weight:900; color:#fff; margin:6px 0;">0 Puan</div>
            <div style="display:flex; justify-content:center; gap:8px;">
                <button class="btn-ctrl" onclick="addScore('B', 10)">+10</button>
                <button class="btn-ctrl" onclick="addScore('B', 20)">+20</button>
                <button class="btn-ctrl" onclick="addScore('B', 30)">+30</button>
            </div>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <span id="turn-badge" style="color:var(--yellow); font-weight:900; font-size:1.1rem; background:rgba(245,158,11,0.15); padding:8px 18px; border-radius:999px; border:1px solid rgba(245,158,11,0.3);">
            👉 Sıra: Mavi Takım
        </span>
        <span style="color:#94a3b8; font-size:0.85rem; font-weight:700;">Soruyu seçin, doğru bilene puan verin!</span>
    </div>

    <!-- Arena Soru Kartları Grid -->
    <div id="arena-cards-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px;"></div>

    <!-- Soru Modal -->
    <div id="arena-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:999; align-items:center; justify-content:center; padding:16px;">
        <div style="background:#0f172a; border:2px solid #6366f1; border-radius:24px; padding:28px; max-width:650px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.9);">
            <div id="modal-cat" style="color:var(--yellow); font-weight:800; font-size:0.9rem; margin-bottom:10px;"></div>
            <h3 id="modal-q" style="font-size:1.35rem; color:#fff; line-height:1.4; margin-bottom:20px;"></h3>
            
            <div id="modal-ans" style="display:none; background:#1e293b; padding:14px; border-radius:14px; color:#34d399; font-weight:800; font-size:1.1rem; margin-bottom:18px;"></div>

            <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
                <button class="btn-ctrl" onclick="showAnswer()" id="btn-show-ans" style="font-size:0.95rem; padding:10px 18px;"><i class="fa-solid fa-eye"></i> Cevabı Göster</button>
                <button class="btn-primary" style="background:#10b981;" onclick="judge(true)"><i class="fa-solid fa-check"></i> Doğru Bildi (+Puan)</button>
                <button class="btn-primary" style="background:#ef4444;" onclick="judge(false)"><i class="fa-solid fa-xmark"></i> Bilemedi</button>
            </div>
        </div>
    </div>
</div>

        </main>
    </div>

    <script>
        // Web Audio API Sound Effects
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx && !this.muted) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            tone(freq, type='sine', dur=0.1, gainVal=0.1) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    g.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + dur);
                } catch(e) {}
            }
            click() { this.tone(550, 'triangle', 0.05, 0.08); }
            correct() { this.tone(523, 'sine', 0.08, 0.1); setTimeout(() => this.tone(659, 'sine', 0.12, 0.1), 80); }
            wrong() { this.tone(200, 'sawtooth', 0.15, 0.12); }
            fanfare() {
                [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 'sine', 0.15, 0.12), i * 100));
            }
            toggleMute() {
                this.muted = !this.muted;
                const b = document.getElementById('btn-sound');
                if (b) b.innerHTML = this.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            }
        }
        const sfx = new SoundFX();

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        
let scoreA = 0;
let scoreB = 0;
let turn = 'A';
let activeCardPts = 10;
let activeCardElem = null;

const categories = [
    { id: 1, name: "1. Dosya Adı & Uzantı", q: "Ali Babanın Çiftliği.mp3 dosyasında dosya uzantısı nedir ve neyi gösterir?", a: ".mp3 dosya uzantısıdır ve dosyanın türünü (ses dosyası olduğunu) belirtir.", pts: 10 },
    { id: 2, name: "2. Dosya Türleri", q: ".docx, .pdf ve .txt hangi dosya türüne aittir?", a: "Metin / Yazı / Belge dosyaları türüne aittir.", pts: 20 },
    { id: 3, name: "3. Klasör & Alt Klasör", q: "Bir klasörün içine açılan yeni bir klasöre ne ad verilir?", a: "Alt Klasör (Subfolder) adı verilir.", pts: 10 },
    { id: 4, name: "4. Kopyalama vs Taşıma", q: "Kopyalama ile Taşıma (Kesme) arasındaki temel fark nedir?", a: "Kopyalamada aslı eski yerinde kalır ve çoğalır; Taşımada dosya eski yerinden silinip yeni yere aktarılır.", pts: 30 },
    { id: 5, name: "5. Klavye Kısayolları", q: "Kopyala, Kes ve Yapıştır kısayollarını sırasıyla söyleyiniz.", a: "Ctrl + C (Kopyala), Ctrl + X (Kes), Ctrl + V (Yapıştır)", pts: 20 },
    { id: 6, name: "6. Geri Dönüşüm Kutusu", q: "Geri Dönüşüm Kutusundaki bir dosya silindiği orijinal yerine nasıl döndürülür?", a: "Dosyaya sağ tıklanıp 'Geri Yükle' seçeneği seçilerek.", pts: 10 },
    { id: 7, name: "7. Dosya Arama (*)", q: "Arama kutusuna *.docx yazıldığında bilgisayar hangi dosyaları listeler?", a: "Adı ne olursa olsun bilgisayardaki TÜM Word (.docx) belgelerini bulur.", pts: 20 },
    { id: 8, name: "8. Sıkıştırma (.zip)", q: "Sıkıştırılmış arşiv dosyalarının en yaygın 2 uzantısı nedir?", a: ".zip ve .rar uzantılarıdır.", pts: 20 },
    { id: 9, name: "9. Depolama Araçları", q: "İnternet üzerinden her cihazdan erişilen depolama türüne ne ad verilir?", a: "Bulut Depolama (Google Drive, OneDrive vb.) denir.", pts: 10 },
    { id: 10, name: "10. Basılıdan Dijitale", q: "Kâğıt üzerindeki resim ve yazıları bilgisayara aktaran donanımın adı nedir?", a: "Tarayıcı (Scanner) veya telefon/tablet kamerası.", pts: 20 }
];

function initGame() {
    scoreA = 0;
    scoreB = 0;
    turn = 'A';
    updateBoard();

    const grid = document.getElementById('arena-cards-grid');
    grid.innerHTML = '';
    categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.style.flexDirection = 'column';
        btn.style.textAlign = 'center';
        btn.style.padding = '16px 10px';
        btn.innerHTML = '<span style="color:var(--yellow); font-size:0.85rem; font-weight:900;">' + cat.pts + ' PUAN</span>' +
            '<span style="font-size:0.95rem; font-weight:800; color:#fff; margin-top:4px;">' + cat.name + '</span>';
        btn.onclick = () => openCard(cat, btn);
        grid.appendChild(btn);
    });
}

function updateBoard() {
    document.getElementById('team-a-score').innerText = scoreA + " Puan";
    document.getElementById('team-b-score').innerText = scoreB + " Puan";
    document.getElementById('score-val').innerText = (scoreA + scoreB) + " Puan";
    const turnEl = document.getElementById('turn-badge');
    if (turn === 'A') {
        turnEl.innerHTML = '👉 Sıra: <strong style="color:#38bdf8;">Mavi Takım (Takım A)</strong>';
    } else {
        turnEl.innerHTML = '👉 Sıra: <strong style="color:#fb923c;">Turuncu Takım (Takım B)</strong>';
    }
}

function openCard(cat, elem) {
    sfx.click();
    activeCardPts = cat.pts;
    activeCardElem = elem;
    document.getElementById('modal-cat').innerText = 'KATEGORİ: ' + cat.name + ' (' + cat.pts + ' Puan)';
    document.getElementById('modal-q').innerText = cat.q;
    document.getElementById('modal-ans').innerText = 'DOĞRU CEVAP: ' + cat.a;
    document.getElementById('modal-ans').style.display = 'none';
    document.getElementById('btn-show-ans').style.display = 'inline-flex';
    document.getElementById('arena-modal').style.display = 'flex';
}

function showAnswer() {
    sfx.click();
    document.getElementById('modal-ans').style.display = 'block';
    document.getElementById('btn-show-ans').style.display = 'none';
}

function judge(isCorrect) {
    document.getElementById('arena-modal').style.display = 'none';
    if (isCorrect) {
        sfx.correct();
        if (turn === 'A') scoreA += activeCardPts;
        else scoreB += activeCardPts;
    } else {
        sfx.wrong();
    }

    if (activeCardElem) {
        activeCardElem.disabled = true;
        activeCardElem.style.opacity = '0.35';
        activeCardElem.style.borderColor = isCorrect ? 'var(--green)' : 'var(--red)';
    }

    // Sırayı diğer takıma devret
    turn = (turn === 'A') ? 'B' : 'A';
    updateBoard();
}

function addScore(team, pts) {
    sfx.click();
    if (team === 'A') scoreA += pts;
    else scoreB += pts;
    updateBoard();
}

function restartGame() {
    initGame();
}

window.onload = initGame;

    </script>
</body>
</html>
