    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }
            playBeep(freq, type, duration, gainVal = 0.15) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playClick() { this.playBeep(520, 'sine', 0.08, 0.1); }
            playCorrect() {
                this.playBeep(440, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playBeep(587, 'triangle', 0.12, 0.2), 90);
                setTimeout(() => this.playBeep(880, 'triangle', 0.25, 0.25), 180);
            }
            playWrong() {
                this.playBeep(240, 'sawtooth', 0.15, 0.25);
                setTimeout(() => this.playBeep(180, 'sawtooth', 0.25, 0.25), 120);
            }
            playFanfare() {
                const notes = [523, 659, 784, 1046, 1318];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playBeep(freq, 'triangle', 0.35, 0.25), idx * 120);
                });
            }
        }

                            <div class="p-4 bg-slate-950/80 rounded-2xl border border-slate-800 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-cyan-500/20 text-cyan-300 flex items-center justify-center text-xl shrink-0">
                                    <i class="fa-solid fa-lightbulb"></i>
                                </div>
                                <p class="text-sm sm:text-base font-semibold text-slate-200">${mission.instruction}</p>
                            </div>

                            <!-- ETKİLEŞİM ALANI -->
                            <div id="mission-interaction">
                                ${this.renderMissionContent(mission)}
                            </div>

                            <!-- GERİ BİLDİRİM -->
                            <div id="mission-feedback" class="hidden"></div>
                        </div>
                    </div>
                `;
            }

            renderMissionContent(mission) {
                if (mission.cards) {
                    return `
                        <div class="space-y-4">
                            <!-- MERKEZ ÇEKİRDEK -->
                            <div class="p-4 bg-gradient-to-r from-cyan-900/60 to-blue-900/60 rounded-2xl border-2 border-cyan-400 text-center max-w-md mx-auto shadow-lg">
                                <div class="text-xs font-black uppercase text-cyan-300 tracking-wider">MERKEZ KAVRAM</div>
                                <div class="text-lg sm:text-xl font-black text-white">BİLİŞİM TEKNOLOJİLERİ</div>
                            </div>

                            <!-- SEÇİLECEK KARTLAR -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-2">
                                ${mission.cards.map(c => `
                                    <button id="card-${c.id}" onclick="game.toggleCard(${c.id})" class="card-node p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 text-left flex items-center justify-between gap-3 text-white transition-all">
                                        <div class="flex items-center gap-3">
                                            <div class="w-9 h-9 rounded-xl bg-slate-800 text-cyan-400 flex items-center justify-center text-base shrink-0">
                                                <i class="${c.icon || 'fa-solid fa-cube'}"></i>
                                            </div>
                                            <span class="text-xs sm:text-sm font-bold">${c.text}</span>
                                        </div>
                                        <div id="check-${c.id}" class="w-6 h-6 rounded-lg border-2 border-slate-600 flex items-center justify-center text-xs shrink-0"></div>
                                    </button>
                                `).join('')}
                            </div>

                            <div class="text-center pt-3">
                                <button onclick="game.checkCardSelection()" class="card-node px-8 py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black text-sm sm:text-base rounded-xl shadow-lg border border-cyan-400">
                                    <i class="fa-solid fa-link mr-2"></i> Kavramları Ağa Bağla ve Doğrula!
                                </button>
                            </div>
                        </div>
                    `;
                } else if (mission.isCategorize) {
                    return `
                        <div class="space-y-4">
                            <div class="space-y-3">
                                ${mission.items.map((item, idx) => `
                                    <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                        <div class="text-xs sm:text-sm font-semibold text-white flex items-center gap-2">
                                            <i class="fa-solid fa-arrow-right text-cyan-400 text-xs"></i>
                                            <span>${item.text}</span>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
                                            <button id="cat-${item.id}-aktif" onclick="game.setCategoryChoice(${item.id}, 'aktif')" class="px-4 py-2 rounded-xl text-xs font-black border border-blue-500/40 bg-slate-800 text-blue-300 transition-all">
                                                🐾 AKTİF İZ
                                            </button>
                                            <button id="cat-${item.id}-pasif" onclick="game.setCategoryChoice(${item.id}, 'pasif')" class="px-4 py-2 rounded-xl text-xs font-black border border-cyan-500/40 bg-slate-800 text-cyan-300 transition-all">
                                                🐾 PASİF İZ
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="text-center pt-2">
                                <button onclick="game.checkCategorization()" class="card-node px-8 py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black text-sm sm:text-base rounded-xl shadow-lg border border-cyan-400">
                                    <i class="fa-solid fa-check-double mr-2"></i> Sınıflandırmayı Onayla!
                                </button>
                            </div>
                        </div>
                    `;
                } else if (mission.isSequence) {
                    return `
                        <div class="space-y-4">
                            <p class="text-xs text-slate-300">Aşağıdaki adımlara sırasıyla basarak <strong>1'den 4'e kadar</strong> mantıklı bir teknoloji günü sırası oluştur:</p>
                            <div class="space-y-2.5">
                                ${mission.steps.map((st, idx) => `
                                    <button id="seq-btn-${idx}" onclick="game.toggleSequenceItem(${idx})" class="card-node w-full p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 text-left flex items-center justify-between gap-3 text-white transition-all">
                                        <span class="text-xs sm:text-sm font-semibold">${st.text}</span>
                                        <span id="seq-badge-${idx}" class="w-8 h-8 rounded-xl bg-slate-800 text-slate-500 font-black text-sm flex items-center justify-center shrink-0">-</span>
                                    </button>
                                `).join('')}
                            </div>

                            <div class="flex justify-center gap-3 pt-2">
                                <button onclick="game.resetSequence()" class="card-node px-5 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl border border-slate-700">
                                    <i class="fa-solid fa-rotate-left mr-1"></i> Sıralamayı Sıfırla
                                </button>
                                <button onclick="game.checkSequence()" class="card-node px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black text-sm rounded-xl shadow-lg border border-cyan-400">
                                    <i class="fa-solid fa-circle-check mr-2"></i> Sıralamayı Kontrol Et!
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            toggleCard(id) {
                sounds.playClick();
                const pos = this.selectedIds.indexOf(id);
                if (pos > -1) {
                    this.selectedIds.splice(pos, 1);
                } else {
                    this.selectedIds.push(id);
                }

                const btn = document.getElementById(`card-${id}`);
                const check = document.getElementById(`check-${id}`);
                if (btn && check) {
                    const isSelected = this.selectedIds.includes(id);
                    if (isSelected) {
                        btn.classList.add('border-cyan-400', 'bg-cyan-950/40');
                        check.className = "w-6 h-6 rounded-lg bg-cyan-400 border-2 border-cyan-300 text-slate-950 flex items-center justify-center text-xs font-black";
                        check.innerHTML = '<i class="fa-solid fa-check"></i>';
                    } else {
                        btn.classList.remove('border-cyan-400', 'bg-cyan-950/40');
                        check.className = "w-6 h-6 rounded-lg border-2 border-slate-600 flex items-center justify-center text-xs";
                        check.innerHTML = '';
                    }
                }
            }

            checkCardSelection() {
                const mission = this.missions[this.currentMissionIndex];
                let allCorrect = true;

                mission.cards.forEach(c => {
                    const isSelected = this.selectedIds.includes(c.id);
                    if (c.isTarget && !isSelected) allCorrect = false;
                    if (!c.isTarget && isSelected) allCorrect = false;
                });

                if (allCorrect) {
                    sounds.playCorrect();
                    this.score += 20;
                } else {
                    sounds.playWrong();
                }

                this.showFeedback(allCorrect, allCorrect ? mission.feedbackCorrect : mission.feedbackWrong);
            }

            setCategoryChoice(id, type) {
                sounds.playClick();
                this.catAnswers[id] = type;
                const btnAktif = document.getElementById(`cat-${id}-aktif`);
                const btnPasif = document.getElementById(`cat-${id}-pasif`);

                if (type === 'aktif') {
                    btnAktif.className = "px-4 py-2 rounded-xl text-xs font-black border-2 border-blue-400 bg-blue-600 text-white shadow-md";
                    btnPasif.className = "px-4 py-2 rounded-xl text-xs font-black border border-slate-700 bg-slate-800 text-slate-400";
                } else {
                    btnPasif.className = "px-4 py-2 rounded-xl text-xs font-black border-2 border-cyan-400 bg-cyan-600 text-white shadow-md";
                    btnAktif.className = "px-4 py-2 rounded-xl text-xs font-black border border-slate-700 bg-slate-800 text-slate-400";
                }
            }

            checkCategorization() {
                const mission = this.missions[this.currentMissionIndex];
                if (Object.keys(this.catAnswers).length < mission.items.length) {
                    alert("Lütfen tüm maddeleri Aktif veya Pasif olarak işaretleyiniz!");
                    return;
                }

                let allCorrect = true;
                mission.items.forEach(item => {
                    if (this.catAnswers[item.id] !== item.type) allCorrect = false;
                });

                if (allCorrect) {
                    sounds.playCorrect();
                    this.score += 20;
                } else {
                    sounds.playWrong();
                }

                this.showFeedback(allCorrect, allCorrect ? mission.feedbackCorrect : mission.feedbackWrong);
            }

            toggleSequenceItem(idx) {
                sounds.playClick();
                const pos = this.seqOrder.indexOf(idx);
                if (pos > -1) {
                    this.seqOrder.splice(pos, 1);
                } else {
                    if (this.seqOrder.length < 4) {
                        this.seqOrder.push(idx);
                    }
                }
                this.updateSequenceUI();
            }

            resetSequence() {
                sounds.playClick();
                this.seqOrder = [];
                this.updateSequenceUI();
            }

            updateSequenceUI() {
                for (let i = 0; i < 4; i++) {
                    const btn = document.getElementById(`seq-btn-${i}`);
                    const badge = document.getElementById(`seq-badge-${i}`);
                    const orderIdx = this.seqOrder.indexOf(i);

                    if (btn && badge) {
                        if (orderIdx > -1) {
                            btn.classList.add('border-cyan-400', 'bg-cyan-950/40');
                            badge.className = "w-8 h-8 rounded-xl bg-cyan-500 text-white font-black text-sm flex items-center justify-center shadow";
                            badge.innerText = `${orderIdx + 1}.`;
                        } else {
                            btn.classList.remove('border-cyan-400', 'bg-cyan-950/40');
                            badge.className = "w-8 h-8 rounded-xl bg-slate-800 text-slate-500 font-black text-sm flex items-center justify-center";
                            badge.innerText = `-`;
                        }
                    }
                }
            }

            checkSequence() {
                if (this.seqOrder.length < 4) {
                    alert("Lütfen 4 adımı da sırayla seçerek sıralayınız!");
                    return;
                }

                // Doğru sıra: 0, 1, 2, 3
                let allCorrect = true;
                for (let i = 0; i < 4; i++) {
                    if (this.seqOrder[i] !== i) allCorrect = false;
                }

                const mission = this.missions[this.currentMissionIndex];
                if (allCorrect) {
                    sounds.playCorrect();
                    this.score += 20;
                } else {
                    sounds.playWrong();
                }

                this.showFeedback(allCorrect, allCorrect ? mission.feedbackCorrect : mission.feedbackWrong);
            }

            showFeedback(isCorrect, msg) {
                const fb = document.getElementById("mission-feedback");
                if (!fb) return;

                fb.classList.remove("hidden");
                fb.innerHTML = `
                    <div class="p-5 rounded-2xl border-2 ${isCorrect ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' : 'bg-rose-950/90 border-rose-500 text-rose-200'} space-y-3 animate-pop shadow-xl">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-rose-400'} text-2xl"></i>
                            <div>
                                <span class="text-xs font-black uppercase tracking-wider block">${isCorrect ? 'GÖREV BAŞARIYLA BAĞLANDI! (+20 PUAN)' : 'BAĞLANTI HATASI / İPUCU'}</span>
                                <p class="text-sm font-semibold">${msg}</p>
                            </div>
                        </div>

                        <div class="text-right pt-2 border-t ${isCorrect ? 'border-emerald-500/30' : 'border-rose-500/30'}">
                            <button onclick="game.nextMission()" class="card-node px-6 py-2.5 bg-white text-slate-950 font-black rounded-xl text-xs sm:text-sm shadow-md inline-flex items-center gap-2">
                                <span>${this.currentMissionIndex < this.missions.length - 1 ? 'Sonraki Göreve Geç ➔' : 'Kavram Haritasını Tamamla 🏆'}</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            nextMission() {
                sounds.playClick();
                this.selectedIds = [];
                this.catAnswers = {};
                this.seqOrder = [];

                if (this.currentMissionIndex < this.missions.length - 1) {
                    this.currentMissionIndex++;
                    this.render();
                } else {
                    this.finishGame();
                }
            }

            startMissions() {
                sounds.playClick();
                this.state = 'mission';
                this.currentMissionIndex = 0;
                this.score = 0;
                this.selectedIds = [];
                this.catAnswers = {};
                this.seqOrder = [];
                this.render();
            }

            finishGame() {
                sounds.playFanfare();
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }
                this.state = 'result';
                this.render();
            }

            getResultHTML() {
                let badgeTitle = "Bilişim Çırağı";
                let badgeDesc = "Kavramları bağlamaya başladın! Bir kez daha deneyerek 100 tam puana ulaşabilirsin.";
                let badgeColor = "from-blue-600 to-indigo-700";

                if (this.score >= 100) {
                    badgeTitle = "🏆 Usta Kavram Mimarı";
                    badgeDesc = "Olağanüstü zihinsel harita! 1, 2 ve 3. konular arasındaki tüm mantık bağlarını eksiksiz kurdun!";
                    badgeColor = "from-cyan-500 to-emerald-400 text-slate-950";
                } else if (this.score >= 60) {
                    badgeTitle = "🎖️ Bilişim Ağı Uzmanı";
                    badgeDesc = "Çok başarılı! Kavramların büyük çoğunluğunu doğru ilişkilendirdin.";
                    badgeColor = "from-cyan-600 to-blue-600";
                }

                return `
                    <div class="glass-panel p-6 sm:p-10 rounded-3xl text-center space-y-6 animate-pop shadow-2xl border-2 border-cyan-400/50">
                        <div class="inline-flex p-6 rounded-3xl bg-gradient-to-tr ${badgeColor} text-5xl sm:text-6xl shadow-2xl">
                            <i class="fa-solid fa-network-wired"></i>
                        </div>

                        <div class="space-y-2">
                            <span class="px-4 py-1 rounded-full bg-cyan-500/20 text-cyan-300 font-extrabold text-xs uppercase tracking-widest border border-cyan-400/40">
                                🧠 KAVRAM HARİTASI TAMAMLANDI
                            </span>
                            <h2 class="text-2xl sm:text-4xl font-black text-white">${badgeTitle}</h2>
                            <p class="text-sm sm:text-base text-slate-200 max-w-xl mx-auto leading-relaxed">${badgeDesc}</p>
                        </div>

                        <!-- PUAN KARTLARI -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-w-lg mx-auto">
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Toplam Puan</div>
                                <div class="text-3xl font-black text-yellow-400">${this.score} / 100</div>
                            </div>
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Tamamlanan Görev</div>
                                <div class="text-3xl font-black text-emerald-400">5 / 5</div>
                            </div>
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 col-span-2 sm:col-span-1">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Başarı Durumu</div>
                                <div class="text-base font-black text-cyan-300 mt-1">${this.score === 100 ? 'Kusursuz 🌟' : 'Başarılı 👍'}</div>
                            </div>
                        </div>

                        <!-- BUTONLAR -->
                        <div class="flex justify-center gap-4 flex-wrap pt-2">
                            <button onclick="game.startMissions()" class="card-node px-8 py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black text-sm sm:text-base rounded-2xl shadow-xl flex items-center gap-2 border-2 border-cyan-300">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Yeniden Bağla</span>
                            </button>
                            <button onclick="game.state = 'intro'; game.render();" class="card-node px-8 py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm sm:text-base rounded-2xl shadow-lg flex items-center gap-2 border border-slate-700">
                                <i class="fa-solid fa-house"></i>
                                <span>Ana Menü</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            toggleAudio() {
                sounds.muted = !sounds.muted;
                const icon = document.getElementById('audio-icon');
                if (icon) {
                    icon.className = sounds.muted ? "fa-solid fa-volume-xmark text-rose-400" : "fa-solid fa-volume-high text-yellow-400";
                }
            }

            toggleFullscreen() {
                sounds.playClick();
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }
        }

        const game = new ConnectWeeksGame();
        window.onload = () => game.init();
    </script>
</body>
</html>
