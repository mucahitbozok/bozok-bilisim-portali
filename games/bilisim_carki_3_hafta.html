================================================================================
PROMPT / OYUN BELİRTİMİ:
5. sınıf Bilişim Teknolojileri dersi için akıllı tahtada oynanabilecek
interaktif bir bilgi ve görev çarkı oluştur.

OYUN ADI:
BİLİŞİM ÇARKI – 3 HAFTA 1 ÇARK

AMAÇ:
1, 2 ve 3. haftalarda öğrenilen konuları eğlenceli görevlerle tekrar etmek.

ÇARKTA 6 KATEGORİ BULUNSUN:

1. BİLİŞİM TEKNOLOJİLERİ
2. KULLANIM ALANLARI
3. TEKNOLOJİ VE SAĞLIK
4. DİJİTAL VATANDAŞLIK
5. DİJİTAL KİMLİK
6. DİJİTAL AYAK İZİ

--------------------------------------------------

OYUN MEKANİĞİ:

Ortada büyük bir dönen çark olsun.

“ÇARKI ÇEVİR” butonu bulunsun.

Çark rastgele bir kategori seçsin.

Kategori seçildikten sonra o kategoriye ait bir görev açılsın.

Öğrenci görevi cevaplasın.

Doğru cevap:
+10 puan

Yanlış cevap:
Tekrar deneme + kısa ipucu.

--------------------------------------------------

GÖREV TİPLERİ:

Sadece çoktan seçmeli soru kullanma.

Görevleri çeşitlendir:

- Çoktan seçmeli
- Doğru/yanlış
- Görseli yorumlama
- Kavramı tahmin etme
- Eksik kelimeyi tamamlama
- Aktif/pasif sınıflandırma
- Dijital davranış hakkında karar verme
- Kısa cevap

--------------------------------------------------

ÖRNEK:

KATEGORİ:
TEKNOLOJİ VE SAĞLIK

Görev:
“Bilgisayar kullanırken doğru oturuş için aşağıdakilerden
hangisini yapmalıyız?”

A) Sürekli öne eğilmek
B) Ekrana çok yaklaşmak
C) Doğru oturuş pozisyonunu korumak
D) Uzun süre hiç ara vermemek

Doğru: C

--------------------------------------------------

KATEGORİ:
DİJİTAL AYAK İZİ

Görev:
“Yorum yazmak aktif mi pasif mi?”

Doğru:
AKTİF

--------------------------------------------------

KATEGORİ:
DİJİTAL KİMLİK

Görev:
“Hangisi dijital kimliğimizin bir parçası olabilir?”

A) Kullanıcı adı
B) Sınıftaki sıra
C) Okulun bahçesi
D) Kalem

Doğru: A

--------------------------------------------------

EN AZ:
Her kategoride 8 farklı görev oluştur.

Toplam en az 48 görev olsun.

Aynı soru tekrar tekrar gelmesin.

--------------------------------------------------

FİNAL:

Oyuncunun toplam puanını göster.

0–150:
Bilişim Kaşifi

160–300:
Bilişim Uzmanı

310+:
Bilişim Ustası

TASARIM:
- Büyük çark
- Renkli ekran
- Büyük yazılar
- Büyük butonlar
- Akıllı tahta uyumlu
- 5. sınıf seviyesinde
- Türkçe
- Eğlenceli ses ve animasyonlar

Öğretmen Bozok markasını uygun bir köşede kullan.
================================================================================
-->

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }
            playBeep(freq, type, duration, gainVal = 0.15) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playClick() { this.playBeep(520, 'sine', 0.08, 0.1); }
            playTick() { this.playBeep(680, 'sine', 0.04, 0.08); }
            playCorrect() {
                this.playBeep(440, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playBeep(587, 'triangle', 0.12, 0.2), 90);
                setTimeout(() => this.playBeep(880, 'triangle', 0.25, 0.25), 180);
            }
            playWrong() {
                this.playBeep(240, 'sawtooth', 0.15, 0.25);
                setTimeout(() => this.playBeep(180, 'sawtooth', 0.25, 0.25), 120);
            }
            playFanfare() {
                const notes = [523, 659, 784, 1046, 1318];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playBeep(freq, 'triangle', 0.35, 0.25), idx * 120);
                });
            }
        }

                    ],
                    // Kategori 5: Dijital Ayak İzi
                    5: [
                        { type: 'mc', q: "Kendi isteğimiz ve irademizle internete yüklediğimiz video ve fotoğraflar hangi ayak izidir?", options: ["Aktif Dijital Ayak İzi", "Pasif Dijital Ayak İzi", "Geçici Ayak İzi", "Silinmiş İz"], ans: 0, hint: "Bilerek ve isteyerek oluşturulan iz." },
                        { type: 'mc', q: "Ziyaret ettiğimiz sitelerin arka planda bıraktığı çerezler (cookies) hangi ayak izidir?", options: ["Pasif Dijital Ayak İzi", "Aktif Ayak İzi", "Kalıcı Olmayan İz", "Görünür İz"], ans: 0, hint: "Farkında olmadan arka planda oluşan iz." },
                        { type: 'tf', q: "İnternete yüklediğimiz bir fotoğrafı silsek bile başkaları indirip kaydetmiş olabilir.", ans: true, hint: "Dijital ayak izi son derece kalıcıdır." },
                        { type: 'mc', q: "Bir YouTube ders videosunun altına teşekkür yorumu yazmak hangi ayak izidir?", options: ["Aktif Dijital Ayak İzi", "Pasif Dijital Ayak İzi", "Gizli İz", "Sıfır İz"], ans: 0, hint: "İsteğimizle yazı yazmak aktiftir." },
                        { type: 'mc', q: "Telefonumuzdaki harita uygulamasının arka planda gezdiğimiz yerleri kaydetmesi nedir?", options: ["Pasif Dijital Ayak İzi", "Aktif Dijital Ayak İzi", "Yazılım Hatası", "Ekran Parlaklığı"], ans: 0, hint: "Otomatik kaydedilen konum izi." },
                        { type: 'tf', q: "Gelecekteki okul veya iş başvurularında dijital ayak izimiz incelenebilir.", ans: true, hint: "İnternet geçmişi itibarımızı etkiler." },
                        { type: 'mc', q: "Arama motorunda yaptığımız aramaların geçmişe kaydedilmesi hangi ize örnektir?", options: ["Pasif Dijital Ayak İzi", "Aktif Dijital Ayak İzi", "Virüs", "Spam"], ans: 0, hint: "Sistemin arka plandaki arama kaydı." },
                        { type: 'tf', q: "Sosyal medyada bir gönderiyi beğenmek veya paylaşmak aktif dijital ayak izi oluşturur.", ans: true, hint: "Kendi eylemimizle bıraktığımız iz." }
                    ]
                };

                this.usedTasks = new Set();
            }

            init() {
                this.render();
            }

            render() {
                const container = document.getElementById("game-container");
                if (!container) return;

                if (this.state === 'wheel') {
                    container.innerHTML = this.getWheelHTML();
                    this.drawWheel();
                } else if (this.state === 'question') {
                    container.innerHTML = this.getQuestionHTML();
                } else if (this.state === 'result') {
                    container.innerHTML = this.getResultHTML();
                }
            }

            getWheelHTML() {
                return `
                    <div class="glass-panel p-6 sm:p-8 rounded-3xl text-center space-y-6 animate-pop shadow-2xl">
                        <!-- ÜST SKOR VE BİLGİ -->
                        <div class="flex items-center justify-between gap-4 bg-slate-900/90 p-4 rounded-2xl border border-slate-800 flex-wrap">
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 rounded-xl bg-indigo-600 text-white font-black text-xs sm:text-sm">
                                    🎡 Bilişim Çarkı
                                </span>
                                <span class="text-xs text-slate-300 font-bold hidden sm:inline">6 Kategori • 1-2-3. Hafta Tekrarı</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-sm font-black text-yellow-400 flex items-center gap-1.5">
                                    <i class="fa-solid fa-coins"></i>
                                    <span>Puan: ${this.score}</span>
                                </div>
                                <div class="text-xs font-bold text-slate-400">
                                    Tamamlanan: <strong class="text-white">${this.answeredCount}</strong>
                                </div>
                                ${this.answeredCount >= 8 ? `
                                    <button onclick="game.finishGame()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition-all shadow">
                                        Oyunu Bitir & Rütbeni Al 🏆
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- ÇARK ALANI -->
                        <div class="relative flex justify-center items-center py-2">
                            <!-- Çark İğnesi / Pointer -->
                            <div class="absolute top-0 z-20 text-yellow-400 text-3xl sm:text-4xl filter drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] -mt-2">
                                <i class="fa-solid fa-caret-down"></i>
                            </div>

                            <canvas id="wheel-canvas" width="420" height="420" class="max-w-full h-auto drop-shadow-2xl"></canvas>
                        </div>

                        <!-- ÇEVİR BUTONU -->
                        <div class="pt-2">
                            <button id="spin-btn" onclick="game.spin()" class="btn-action px-10 sm:px-14 py-4 sm:py-5 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-lg sm:text-2xl rounded-2xl shadow-2xl shadow-amber-500/40 flex items-center gap-3 mx-auto border-2 border-yellow-300">
                                <i class="fa-solid fa-arrows-rotate text-2xl"></i>
                                <span>ÇARKI ÇEVİR!</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            drawWheel() {
                const canvas = document.getElementById("wheel-canvas");
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const numSegments = this.categories.length;
                const arc = (2 * Math.PI) / numSegments;
                const radius = canvas.width / 2;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(this.currentAngle);

                for (let i = 0; i < numSegments; i++) {
                    const angle = i * arc;
                    const cat = this.categories[i];

                    // Dilim Çizimi
                    ctx.beginPath();
                    ctx.fillStyle = cat.color;
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, radius - 10, angle, angle + arc);
                    ctx.lineTo(0, 0);
                    ctx.fill();

                    // Dilim Kenarlığı
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Dilim Metni
                    ctx.save();
                    ctx.rotate(angle + arc / 2);
                    ctx.textAlign = "right";
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 15px Poppins, sans-serif";
                    ctx.shadowColor = "rgba(0,0,0,0.8)";
                    ctx.shadowBlur = 4;
                    ctx.fillText(cat.name, radius - 30, 5);
                    ctx.restore();
                }

                // Orta Göbek
                ctx.beginPath();
                ctx.arc(0, 0, 36, 0, 2 * Math.PI);
                ctx.fillStyle = "#0c1024";
                ctx.fill();
                ctx.strokeStyle = "#fbbf24";
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.fillStyle = "#fbbf24";
                ctx.font = "bold 14px Poppins, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 0;
                ctx.fillText("BOZOK", 0, 0);

                ctx.restore();
            }

            spin() {
                if (this.isSpinning) return;
                sounds.playClick();
                this.isSpinning = true;

                const btn = document.getElementById("spin-btn");
                if (btn) {
                    btn.disabled = true;
                    btn.classList.add("opacity-50", "pointer-events-none");
                }

                // Hedef Kategori Belirle
                const targetCatIndex = Math.floor(Math.random() * this.categories.length);
                const numSegments = this.categories.length;
                const arc = (2 * Math.PI) / numSegments;

                // İğne en üstte (açı = 3 * PI / 2 veya -PI / 2)
                // segment açısı çark koordinatlarında
                const fullSpins = 4 + Math.floor(Math.random() * 3); // 4-6 tam tur
                const segmentCenter = targetCatIndex * arc + arc / 2;
                const targetRotation = (3 * Math.PI / 2) - segmentCenter;
                const totalRotation = (fullSpins * 2 * Math.PI) + targetRotation;

                const startAngle = this.currentAngle % (2 * Math.PI);
                const deltaAngle = totalRotation - startAngle;

                const duration = 3500;
                const startTime = performance.now();
                let lastTickAngle = startAngle;

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // Cubic ease out
                    const easeOut = 1 - Math.pow(1 - progress, 3);

                    this.currentAngle = startAngle + deltaAngle * easeOut;
                    this.drawWheel();

                    // Tıklama sesi efekti
                    if (Math.abs(this.currentAngle - lastTickAngle) >= (arc / 2)) {
                        sounds.playTick();
                        lastTickAngle = this.currentAngle;
                    }

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        this.isSpinning = false;
                        sounds.playCorrect();
                        setTimeout(() => {
                            this.pickTask(targetCatIndex);
                        }, 500);
                    }
                };

                requestAnimationFrame(animate);
            }

            pickTask(catIndex) {
                this.currentCategory = this.categories[catIndex];
                const pool = this.tasks[catIndex];

                // Henüz çözülmemiş soruları filtrele
                const available = pool.filter((_, idx) => !this.usedTasks.has(`${catIndex}-${idx}`));
                let chosenIndex = 0;
                if (available.length > 0) {
                    const randTask = available[Math.floor(Math.random() * available.length)];
                    chosenIndex = pool.indexOf(randTask);
                } else {
                    chosenIndex = Math.floor(Math.random() * pool.length);
                }

                this.usedTasks.add(`${catIndex}-${chosenIndex}`);
                this.currentTask = pool[chosenIndex];
                this.state = 'question';
                this.render();
            }

            getQuestionHTML() {
                const cat = this.currentCategory;
                const task = this.currentTask;

                return `
                    <div class="glass-panel p-6 sm:p-8 rounded-3xl space-y-6 animate-pop shadow-2xl border-2 border-indigo-500/50">
                        <!-- KATEGORİ BAŞLIĞI -->
                        <div class="flex items-center justify-between gap-4 pb-4 border-b border-slate-700">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg" style="background-color: ${cat.color};">
                                    <i class="${cat.icon}"></i>
                                </div>
                                <div>
                                    <span class="text-xs font-black uppercase tracking-wider block" style="color: ${cat.color};">GÖREV KATEGORİSİ</span>
                                    <h2 class="text-xl sm:text-2xl font-black text-white">${cat.name}</h2>
                                </div>
                            </div>
                            <div class="text-sm font-black text-yellow-400 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">
                                Puan: ${this.score}
                            </div>
                        </div>

                        <!-- SORU METNİ -->
                        <div class="p-5 bg-slate-950/80 rounded-2xl border border-slate-800">
                            <p class="text-base sm:text-xl font-bold text-white leading-relaxed">${task.q}</p>
                        </div>

                        <!-- SEÇENEKLER / ETKİLEŞİM ALANI -->
                        <div id="task-options-area">
                            ${this.renderTaskOptions(task)}
                        </div>

                        <!-- GERİ BİLDİRİM KUTUSU -->
                        <div id="task-feedback" class="hidden"></div>
                    </div>
                `;
            }

            renderTaskOptions(task) {
                if (task.type === 'mc' || task.type === 'fill') {
                    const letters = ['A', 'B', 'C', 'D'];
                    return `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                            ${task.options.map((opt, idx) => `
                                <button onclick="game.handleAnswer(${idx})" class="btn-action p-4 rounded-2xl bg-slate-900/90 hover:bg-slate-800 border-2 border-slate-700 hover:border-indigo-400 text-left flex items-center gap-3 text-white transition-all group">
                                    <span class="w-8 h-8 rounded-xl bg-slate-800 group-hover:bg-indigo-600 font-black text-sm flex items-center justify-center text-yellow-300 group-hover:text-white shrink-0">
                                        ${letters[idx]}
                                    </span>
                                    <span class="text-sm sm:text-base font-bold">${opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else if (task.type === 'tf') {
                    return `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto">
                            <button onclick="game.handleAnswer(true)" class="btn-action p-5 rounded-2xl bg-emerald-950/60 hover:bg-emerald-900/80 border-2 border-emerald-500/50 hover:border-emerald-400 flex items-center justify-center gap-3 text-white transition-all text-lg font-black shadow-lg">
                                <i class="fa-solid fa-circle-check text-emerald-400 text-2xl"></i>
                                <span>DOĞRU</span>
                            </button>
                            <button onclick="game.handleAnswer(false)" class="btn-action p-5 rounded-2xl bg-rose-950/60 hover:bg-rose-900/80 border-2 border-rose-500/50 hover:border-rose-400 flex items-center justify-center gap-3 text-white transition-all text-lg font-black shadow-lg">
                                <i class="fa-solid fa-circle-xmark text-rose-400 text-2xl"></i>
                                <span>YANLIŞ</span>
                            </button>
                        </div>
                    `;
                }
            }

            handleAnswer(chosen) {
                const task = this.currentTask;
                const isCorrect = (chosen === task.ans);
                const fb = document.getElementById("task-feedback");
                if (!fb) return;

                if (isCorrect) {
                    sounds.playCorrect();
                    this.score += 10;
                    this.answeredCount++;
                } else {
                    sounds.playWrong();
                }

                fb.classList.remove("hidden");
                fb.innerHTML = `
                    <div class="p-5 rounded-2xl border-2 ${isCorrect ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' : 'bg-rose-950/90 border-rose-500 text-rose-200'} space-y-3 animate-pop shadow-xl">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-rose-400'} text-2xl"></i>
                            <div>
                                <span class="text-xs font-black uppercase tracking-wider block">${isCorrect ? 'TEBRİKLER! DOĞRU CEVAP (+10 PUAN)' : 'İPUCU / DİKKAT!'}</span>
                                <p class="text-sm font-semibold">${isCorrect ? 'Harika bir bilişim bilgisi! Puan hanene eklendi.' : task.hint}</p>
                            </div>
                        </div>

                        <div class="text-right pt-2 border-t ${isCorrect ? 'border-emerald-500/30' : 'border-rose-500/30'} flex justify-end gap-3">
                            ${!isCorrect ? `
                                <button onclick="game.retryTask()" class="btn-action px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs flex items-center gap-1.5">
                                    <i class="fa-solid fa-rotate-right"></i> Tekrar Dene
                                </button>
                            ` : ''}
                            <button onclick="game.backToWheel()" class="btn-action px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-black rounded-xl text-xs sm:text-sm shadow-md flex items-center gap-2">
                                <i class="fa-solid fa-arrows-spin"></i> Çarka Geri Dön!
                            </button>
                        </div>
                    </div>
                `;
            }

            retryTask() {
                sounds.playClick();
                const fb = document.getElementById("task-feedback");
                if (fb) fb.classList.add("hidden");
            }

            backToWheel() {
                sounds.playClick();
                this.state = 'wheel';
                this.render();
            }

            finishGame() {
                sounds.playFanfare();
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }
                this.state = 'result';
                this.render();
            }

            getResultHTML() {
                let badgeTitle = "Bilişim Kaşifi 🧭";
                let badgeDesc = "İlk adımlarını başarıyla attın! Konuları tekrar ederek puanını katlayabilirsin.";
                let badgeColor = "from-blue-600 to-indigo-700";

                if (this.score >= 310) {
                    badgeTitle = "🏆 Bilişim Ustası";
                    badgeDesc = "Muhteşem bir başarı! 1, 2 ve 3. konuların tamamına hakim olduğunu kanıtladın!";
                    badgeColor = "from-amber-500 to-yellow-400 text-slate-950";
                } else if (this.score >= 160) {
                    badgeTitle = "🎖️ Bilişim Uzmanı";
                    badgeDesc = "Çok iyi gidiyorsun! Bilgi çarkındaki görevlerin büyük kısmını başarıyla tamamladın.";
                    badgeColor = "from-purple-600 to-pink-600";
                }

                return `
                    <div class="glass-panel p-6 sm:p-10 rounded-3xl text-center space-y-6 animate-pop shadow-2xl border-2 border-indigo-500/50">
                        <div class="inline-flex p-6 rounded-3xl bg-gradient-to-tr ${badgeColor} text-5xl sm:text-6xl shadow-2xl">
                            <i class="fa-solid fa-award"></i>
                        </div>

                        <div class="space-y-2">
                            <span class="px-4 py-1 rounded-full bg-indigo-500/20 text-indigo-300 font-extrabold text-xs uppercase tracking-widest border border-indigo-400/40">
                                🎡 ÇARK MEYDAN OKUMASI TAMAMLANDI
                            </span>
                            <h2 class="text-2xl sm:text-4xl font-black text-white">${badgeTitle}</h2>
                            <p class="text-sm sm:text-base text-slate-200 max-w-xl mx-auto leading-relaxed">${badgeDesc}</p>
                        </div>

                        <!-- PUAN TABLOSU -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-w-lg mx-auto">
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Toplam Puan</div>
                                <div class="text-3xl font-black text-yellow-400">${this.score}</div>
                            </div>
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Çözülen Görev</div>
                                <div class="text-3xl font-black text-emerald-400">${this.answeredCount}</div>
                            </div>
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 col-span-2 sm:col-span-1">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Seviye</div>
                                <div class="text-base font-black text-pink-300 mt-1">${badgeTitle.split(' ')[0]}</div>
                            </div>
                        </div>

                        <!-- BUTONLAR -->
                        <div class="flex justify-center gap-4 flex-wrap pt-2">
                            <button onclick="game.state = 'wheel'; game.render();" class="btn-action px-8 py-3.5 bg-gradient-to-r from-indigo-600 to-pink-600 text-white font-black text-sm sm:text-base rounded-2xl shadow-xl flex items-center gap-2">
                                <i class="fa-solid fa-arrows-rotate"></i>
                                <span>Çevirmeye Devam Et</span>
                            </button>
                            <button onclick="location.reload()" class="btn-action px-8 py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm sm:text-base rounded-2xl shadow-lg flex items-center gap-2 border border-slate-700">
                                <i class="fa-solid fa-rotate-left"></i>
                                <span>Sıfırla & Yeniden Başla</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            toggleAudio() {
                sounds.muted = !sounds.muted;
                const icon = document.getElementById('audio-icon');
                if (icon) {
                    icon.className = sounds.muted ? "fa-solid fa-volume-xmark text-rose-400" : "fa-solid fa-volume-high text-yellow-400";
                }
            }

            toggleFullscreen() {
                sounds.playClick();
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }
        }

        const game = new WheelQuizGame();
        window.onload = () => game.init();
    </script>
</body>
</html>
