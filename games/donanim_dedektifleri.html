        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            playTone(freq, type = 'sine', duration = 0.15, vol = 0.2) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            click() { this.playTone(600, 'sine', 0.08, 0.15); }
            correct() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.2, 0.25), i * 90);
                });
            }
            wrong() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                this.playTone(220, 'sawtooth', 0.25, 0.2);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.2), 150);
            }
            win() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                [440, 554, 659, 880, 1108].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.35, 0.25), i * 110);
                });
            }
        }

                this.stage = 'investigate'; // investigate -> why -> result

                this.render();
            }

                sfx.enabled = !sfx.enabled;

                }
            }

                sfx.click();
                this.currentIdx = 0;
                this.score = 0;
                this.selectedSuspect = null;
                this.stage = 'investigate';

                this.render();

                                <span class="text-xs sm:text-sm font-black text-white flex items-center gap-2">
                                    <i class="fa-solid fa-microchip text-amber-400"></i>
                                    <span>Hangi Donanım Parçasından Şüpheleniyorsun?</span>
                                </span>
                                <span class="text-[11px] text-slate-400 font-medium">Bir parçaya dokun</span>
                            </div>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                ${c.suspects.map(s => `
                                    <button onclick="game.selectSuspect('${s.id}')" class="evidence-card p-4 rounded-2xl bg-slate-800/90 border-2 border-slate-700 text-center space-y-2 group">
                                        <div class="w-12 h-12 rounded-xl bg-slate-900 group-hover:bg-amber-500/20 text-slate-300 group-hover:text-amber-400 flex items-center justify-center text-2xl mx-auto transition-colors">
                                            <i class="${s.icon}"></i>
                                        </div>
                                        <h4 class="text-xs sm:text-sm font-black text-white group-hover:text-amber-300 transition-colors">
                                            ${s.name}
                                        </h4>
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- DİNAMİK CEVAP/GERİ BİLDİRİM ALANI -->
                        <div id="fb-area" class="hidden"></div>
                    </div>
                `;
            }

            selectSuspect(id) {
                const c = CASES[this.currentIdx];
                const suspect = c.suspects.find(s => s.id === id);
                if (!suspect) return;

                const fb = document.getElementById("fb-area");
                fb.classList.remove("hidden");

                if (!suspect.correct) {
                    sfx.wrong();
                    fb.innerHTML = `
                        <div class="p-4 rounded-2xl bg-rose-950/90 border-2 border-rose-500 text-rose-200 text-xs sm:text-sm font-bold flex items-center justify-between gap-3 animate-pop shadow-lg">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-circle-xmark text-rose-400 text-2xl shrink-0"></i>
                                <div>
                                    <span class="block font-black text-rose-300">İPUCU: YANLIŞ ŞÜPHELİ!</span>
                                    <span>${suspect.whyText} Kanıt kartlarını tekrar incele ve sorunun hangi birimle ilgili olduğunu düşün!</span>
                                </div>
                            </div>
                            <button onclick="document.getElementById('fb-area').classList.add('hidden')" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold shrink-0">
                                Tekrar Dene
                            </button>
                        </div>
                    `;
                } else {
                    sfx.click();
                    this.selectedSuspect = suspect;
                    this.renderWhyStage();
                }
            }

            renderWhyStage() {
                const c = CASES[this.currentIdx];
                const fb = document.getElementById("fb-area");
                fb.classList.remove("hidden");

                fb.innerHTML = `
                    <div class="p-5 rounded-2xl bg-indigo-950/90 border-2 border-amber-400 text-white space-y-4 animate-pop shadow-2xl">
                        <div class="flex items-center gap-2 text-yellow-300 font-black text-sm uppercase">
                            <i class="fa-solid fa-circle-question text-lg"></i>
                            <span>DEDEKTİF SORGUSU: “Bu parçayı neden şüpheli olarak seçtin?”</span>
                        </div>
                        <p class="text-xs text-indigo-200 font-medium">
                            Dedektif kararını teknik gerekçesiyle savunmalısın. Doğru mantığı seç:
                        </p>
                        <div class="space-y-2">
                            ${c.whyOptions.map((opt, i) => `
                                <button onclick="game.verifyWhy(${opt.correct})" class="w-full text-left p-3.5 rounded-xl bg-slate-900/90 hover:bg-amber-500/20 border border-slate-700 hover:border-amber-400 text-xs sm:text-sm font-bold text-slate-200 transition-all flex items-center gap-3">
                                    <span class="w-6 h-6 rounded-lg bg-amber-500/30 text-amber-300 font-black flex items-center justify-center text-xs shrink-0">${String.fromCharCode(65 + i)}</span>
                                    <span>${opt.text}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            verifyWhy(isCorrect) {
                const c = CASES[this.currentIdx];
                const fb = document.getElementById("fb-area");

                if (isCorrect) {
                    sfx.correct();
                    this.score += 20;
                    document.getElementById("score-display").innerText = this.score;

                    fb.innerHTML = `
                        <div class="p-5 rounded-2xl bg-emerald-950/90 border-2 border-emerald-500 text-emerald-200 space-y-3 animate-pop shadow-2xl">
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <div class="flex items-center gap-2 font-black text-emerald-300 text-base">
                                    <i class="fa-solid fa-award text-2xl text-yellow-400"></i>
                                    <span>MÜKEMMEL DEDEKTİFLİK! (+20 PUAN)</span>
                                </div>
                                <span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-300 font-tech font-bold text-xs rounded-lg">
                                    VAKA KAPATILDI
                                </span>
                            </div>
                            <p class="text-xs sm:text-sm font-semibold text-white leading-relaxed">
                                ${c.solution}
                            </p>
                            <div class="pt-2 flex justify-end">
                                <button onclick="game.nextCase()" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-lg flex items-center gap-2 transition-all hover:scale-105 active:scale-95">
                                    <span>Sonraki Olay Dosyası</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    sfx.wrong();
                    fb.innerHTML = `
                        <div class="p-4 rounded-2xl bg-amber-950/90 border-2 border-amber-500 text-amber-200 text-xs sm:text-sm font-bold flex items-center justify-between gap-3 animate-pop shadow-lg">
                            <div>
                                <span class="block font-black text-amber-300">⚠️ GEREKÇEN YETERSİZ!</span>
                                <span>Parçanın görevini tam yansıtmayan bir seçenek belirttin. Tekrar düşün!</span>
                            </div>
                            <button onclick="game.renderWhyStage()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold shrink-0">
                                Yeniden Seç
                            </button>
                        </div>
                    `;
                }
            }

            nextCase() {
                sfx.click();
                this.currentIdx++;
                this.render();
            }

            renderFinal() {
                sfx.win();
                if (typeof confetti === "function") {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }

                const container = document.getElementById("main-area");
                container.innerHTML = `
                    <div class="glass-box rounded-3xl p-6 sm:p-10 text-center space-y-6 max-w-2xl mx-auto animate-pop shadow-2xl">
                        <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-amber-400 via-yellow-500 to-orange-500 text-slate-950 flex items-center justify-center text-5xl mx-auto shadow-2xl shadow-amber-500/40">
                            <i class="fa-solid fa-user-secret"></i>
                        </div>
                        <div class="space-y-1">
                            <span class="px-3 py-1 bg-amber-400/20 text-yellow-300 font-extrabold text-xs uppercase tracking-widest rounded-full border border-amber-400/40">
                                5 VAKA ÇÖZÜLDÜ
                            </span>
                            <h2 class="text-2xl sm:text-4xl font-black text-white">TEBRİKLER DEDEKTİF!</h2>
                            <p class="text-sm text-slate-300">
                                Okulun tüm bilgisayar arızalarını başarıyla teşhis ettin ve donanımların görevlerini eksiksiz kanıtladın.
                            </p>
                        </div>

                        <div class="p-4 bg-slate-900 rounded-2xl border border-slate-700 flex items-center justify-around">
                            <div>
                                <span class="text-xs text-slate-400 block">Toplam Puan</span>
                                <strong class="text-2xl font-black text-amber-400">${this.score} / 100</strong>
                            </div>
                            <div class="w-px h-10 bg-slate-800"></div>
                            <div>
                                <span class="text-xs text-slate-400 block">Dedektiflik Unvanı</span>
                                <strong class="text-sm font-black text-emerald-400">BAŞ DEDEKTİF 🎖️</strong>
                            </div>
                        </div>

                        <div class="flex items-center justify-center gap-3 pt-2">
                            <button onclick="game.reset()" class="px-6 py-3 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-black rounded-xl text-sm shadow-xl flex items-center gap-2 transition-all hover:scale-105 active:scale-95">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Yeniden Oyna</span>
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        const game = new DetectiveGame();
        window.addEventListener("DOMContentLoaded", () => game.init());
    </script>
</body>
</html>
