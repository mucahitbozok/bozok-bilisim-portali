    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }
            playBeep(freq, type, duration, gainVal = 0.15) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playClick() { this.playBeep(650, 'sine', 0.06, 0.1); }
            playCorrect() {
                this.playBeep(523, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playBeep(659, 'triangle', 0.1, 0.2), 80);
                setTimeout(() => this.playBeep(784, 'triangle', 0.15, 0.25), 160);
                setTimeout(() => this.playBeep(1046, 'triangle', 0.25, 0.25), 240);
            }
            playWrong() {
                this.playBeep(260, 'sawtooth', 0.15, 0.25);
                setTimeout(() => this.playBeep(200, 'sawtooth', 0.25, 0.25), 120);
            }
            playJoker() {
                this.playBeep(440, 'sine', 0.08, 0.2);
                setTimeout(() => this.playBeep(880, 'sine', 0.12, 0.2), 80);
            }
            playFanfare() {
                const notes = [523, 659, 784, 1046, 1318];
                notes.forEach((n, idx) => {
                    setTimeout(() => this.playBeep(n, 'triangle', 0.25, 0.25), idx * 130);
                });
            }
        }

        const sounds = new SoundEngine();

                        correctAnswer: "Arabalar (Ulaşım)",
                        explanation: "Otonom sürüş; arabaların ve otobüslerin sürücü müdahalesi olmadan kendi kendine gidebilmesi teknolojisidir."

                    {
                        q: "Hastanelerde yapay zekâ hangisi için kullanılabilir?",
                        options: ["Hastalık tahmini", "Video oyunu oynama", "Sınıf yoklaması", "Müzik dinleme"],
                        correctAnswer: "Hastalık tahmini",
                        explanation: "Röntgen, MR ve laboratuvar tahlillerini analiz ederek hastalıkları erkenden teşhis etmek için yapay zekâ kullanılır."
                    },
                    {
                        q: "Yapay zekâ sistemlerini kullanırken hangisine dikkat etmeliyiz?",
                        options: ["Bilgilerin güvenliğine", "Ekran renginin güzel olmasına", "Masanın rengine", "Klavyenin büyüklüğüne"],
                        correctAnswer: "Bilgilerin güvenliğine",
                        explanation: "Kişisel verilerimizin güvenliği, gizlilik ve yapay zekâya verdiğimiz bilgilerin korunması en önemli husustur."
                    },
                    {
                        q: "Yapay zekânın verdiği her bilgiye hemen inanmak yerine ne yapmalıyız?",
                        options: ["Bilgiyi kontrol etmeliyiz", "Her zaman doğru kabul etmeliyiz", "Sadece ilk cevabı kullanmalıyız", "Kimseye sormamalıyız"],
                        correctAnswer: "Bilgiyi kontrol etmeliyiz",
                        explanation: "Yapay zekâ halüsinasyon (yanılsama) görebilir ya da yanlış bilgi verebilir. Her zaman eleştirel düşünüp kontrol etmeliyiz."
                    },
                    {
                        q: "Yapay zekâ yanlış bilgi verdiğinde en doğru davranış hangisidir?",
                        options: ["Bilgiyi başka güvenilir kaynaklardan kontrol etmek", "Yanlış bilgiyi hemen paylaşmak", "Kontrol etmeden ödevde kullanmak", "Her zaman doğru olduğunu düşünmek"],
                        correctAnswer: "Bilgiyi başka güvenilir kaynaklardan kontrol etmek",
                        explanation: "Ders kitapları, bilimsel siteler ve öğretmenlerimiz gibi güvenilir kaynaklardan teyit etmek en doğru yaklaşımdır."

                this.questions = [];
                this.currentIndex = 0;
                this.score = 0;
                this.streak = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.joker50Used = false;
                this.jokerHintUsed = false;
                this.eliminatedOptions = [];
                this.selectedOption = null;
                this.isAnswered = false;
                this.showHintText = false;
                this.state = 'intro'; // 'intro', 'playing', 'result'
            }

            init() {
                this.render();
            }

            startQuiz() {
                sounds.playClick();
                // Soruları hazırla ve her sorunun şıklarını karıştır
                this.questions = this.rawQuestions.map((qObj, index) => {
                    const shuffledOpts = [...qObj.options].sort(() => Math.random() - 0.5);
                    return {
                        id: index + 1,
                        q: qObj.q,
                        options: shuffledOpts,
                        correctAnswer: qObj.correctAnswer,
                        explanation: qObj.explanation
                    };
                });

                this.currentIndex = 0;
                this.score = 0;
                this.streak = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.joker50Used = false;
                this.jokerHintUsed = false;
                this.resetQuestionState();
                this.state = 'playing';
                this.render();
            }

            resetQuestionState() {
                this.eliminatedOptions = [];
                this.selectedOption = null;
                this.isAnswered = false;
                this.showHintText = false;
            }

            useJoker50() {
                if (this.joker50Used || this.isAnswered) return;
                sounds.playJoker();
                this.joker50Used = true;
                const current = this.questions[this.currentIndex];
                const wrongOptions = current.options.filter(opt => opt !== current.correctAnswer);
                // 2 yanlış şıkkı rastgele seçip ele
                const toEliminate = [...wrongOptions].sort(() => Math.random() - 0.5).slice(0, 2);
                this.eliminatedOptions = toEliminate;
                this.render();
            }

            useJokerHint() {
                if (this.jokerHintUsed || this.isAnswered) return;
                sounds.playJoker();
                this.jokerHintUsed = true;
                this.showHintText = true;
                this.render();
            }

            handleSelect(opt) {
                if (this.isAnswered) return;
                this.isAnswered = true;
                this.selectedOption = opt;

                const current = this.questions[this.currentIndex];
                const isCorrect = (opt === current.correctAnswer);

                if (isCorrect) {
                    sounds.playCorrect();
                    this.streak++;
                    this.correctCount++;
                    const streakBonus = (this.streak >= 3) ? 50 : 0;
                    this.score += (100 + streakBonus);
                } else {
                    sounds.playWrong();
                    this.streak = 0;
                    this.wrongCount++;
                }

                this.render();
            }

            nextQuestion() {
                sounds.playClick();
                if (this.currentIndex < this.questions.length - 1) {
                    this.currentIndex++;
                    this.resetQuestionState();
                    this.render();
                } else {
                    sounds.playFanfare();
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 150, spread: 90, origin: { y: 0.55 } });
                    }
                    this.state = 'result';
                    this.render();
                }
            }

            render() {
                const container = document.getElementById("game-container");
                if (!container) return;

                if (this.state === 'intro') {
                    container.innerHTML = this.renderIntroView();
                } else if (this.state === 'playing') {
                    container.innerHTML = this.renderPlayingView();
                } else if (this.state === 'result') {
                    container.innerHTML = this.renderResultView();
                }
            }

            renderIntroView() {

                            </p>

                            <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
                                <div class="text-amber-400 text-lg mb-1"><i class="fa-solid fa-list-ol"></i></div>

                                <div class="text-[11px] text-slate-400">Tüm ünite kapsamı</div>

            renderPlayingView() {
                const current = this.questions[this.currentIndex];
                const total = this.questions.length;
                const progressPct = Math.round(((this.currentIndex) / total) * 100);

                const optionLetters = ['A', 'B', 'C', 'D'];

                return `
                    <div class="space-y-5 animate-pop">
                        <!-- ÜST BİLGİ VE JOKER PANELİ -->
                        <div class="glass-panel rounded-3xl p-4 sm:p-5 border border-slate-800 shadow-xl flex flex-wrap items-center justify-between gap-4">
                            <!-- İlerleme & Soru No -->
                            <div>
                                <div class="text-xs font-extrabold uppercase tracking-wider text-amber-400">SORU ${this.currentIndex + 1} / ${total}</div>
                                <div class="w-36 sm:w-52 h-2.5 rounded-full bg-slate-900 border border-slate-700 overflow-hidden mt-1.5">
                                    <div class="h-full bg-gradient-to-r from-amber-500 to-yellow-400 transition-all duration-300" style="width: ${progressPct}%"></div>
                                </div>
                            </div>

                            <!-- Joker Butonları -->
                            <div class="flex items-center gap-2">
                                <button onclick="game.useJoker50()" ${this.joker50Used || this.isAnswered ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl border text-xs font-black flex items-center gap-1.5 transition-all ${this.joker50Used ? 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-cyan-500/20 hover:bg-cyan-500/30 border-cyan-500/40 text-cyan-300'}">
                                    <i class="fa-solid fa-percent"></i>
                                    <span>50:50</span>
                                </button>
                                <button onclick="game.useJokerHint()" ${this.jokerHintUsed || this.isAnswered ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl border text-xs font-black flex items-center gap-1.5 transition-all ${this.jokerHintUsed ? 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-purple-500/20 hover:bg-purple-500/30 border-purple-500/40 text-purple-300'}">
                                    <i class="fa-solid fa-lightbulb"></i>
                                    <span>İpucu</span>
                                </button>
                            </div>

                            <!-- Puan & Kombo -->
                            <div class="flex items-center gap-4 text-right">
                                ${this.streak >= 2 ? `
                                    <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-orange-500/20 text-orange-400 border border-orange-500/30 text-xs font-black animate-pulse">
                                        <i class="fa-solid fa-fire"></i>
                                        <span>${this.streak}x Kombo!</span>
                                    </div>
                                ` : ''}
                                <div>
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">TOPLAM SKOR</div>
                                    <div class="text-xl sm:text-2xl font-black text-amber-300">${this.score} <span class="text-xs font-normal text-slate-400">puan</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- İPUCU KUTUSU (Açıldıysa) -->
                        ${this.showHintText ? `
                            <div class="p-3.5 rounded-2xl bg-purple-950/60 border border-purple-500/40 text-purple-200 text-xs sm:text-sm flex items-center gap-3 animate-pop">
                                <div class="w-8 h-8 rounded-xl bg-purple-500/30 text-purple-300 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-lightbulb"></i>
                                </div>
                                <div>
                                    <strong class="text-purple-300">Öğretmen İpucu:</strong> Bu soru yapay zekânın <strong>${current.correctAnswer.length > 20 ? current.correctAnswer.slice(0, 20) + '...' : current.correctAnswer}</strong> kavramıyla doğrudan ilişkilidir!
                                </div>
                            </div>
                        ` : ''}

                        <!-- SORU METNİ KARTI -->
                        <div class="glass-panel rounded-3xl p-6 sm:p-8 border border-amber-500/30 shadow-2xl text-center">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs text-amber-400 font-bold mb-4">
                                <i class="fa-solid fa-circle-question"></i>
                                <span>Kazanım Değerlendirme Sorusu</span>
                            </div>
                            <h3 class="text-lg sm:text-2xl font-black text-white leading-snug max-w-3xl mx-auto">
                                ${current.q}
                            </h3>
                        </div>

                        <!-- ŞIKLAR GRID (2x2) -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                            ${current.options.map((opt, idx) => {
                                const letter = optionLetters[idx];
                                const isEliminated = this.eliminatedOptions.includes(opt);
                                const isChosen = (this.selectedOption === opt);
                                const isCorrect = (opt === current.correctAnswer);

                                let btnStyle = "bg-slate-900/90 border-slate-800 text-slate-200 ";
                                let letterBg = "bg-slate-800 text-slate-400";

                                if (isEliminated) {
                                    btnStyle = "bg-slate-950/40 border-slate-900 text-slate-600 opacity-30 pointer-events-none line-through ";
                                    letterBg = "bg-slate-900 text-slate-600";
                                } else if (this.isAnswered) {
                                    if (isCorrect) {
                                        btnStyle = "bg-emerald-950/80 border-emerald-400 text-emerald-200 ring-2 ring-emerald-400/50 ";
                                        letterBg = "bg-emerald-500 text-slate-950 font-black";
                                    } else if (isChosen) {
                                        btnStyle = "bg-rose-950/80 border-rose-400 text-rose-200 animate-shake ";
                                        letterBg = "bg-rose-500 text-white font-black";
                                    } else {
                                        btnStyle = "bg-slate-900/60 border-slate-800/80 text-slate-500 opacity-50 ";
                                    }
                                }

                                return `
                                    <button onclick="game.handleSelect('${opt.replace(/'/g, "\\'")}')" ${this.isAnswered || isEliminated ? 'disabled' : ''} class="option-btn p-4 sm:p-5 rounded-2xl border-2 text-left flex items-center gap-3.5 transition-all ${btnStyle}">
                                        <div class="w-10 h-10 rounded-xl ${letterBg} flex items-center justify-center font-black text-base shrink-0 transition-colors">
                                            ${letter}
                                        </div>
                                        <div class="text-sm sm:text-base font-bold flex-1 leading-snug">
                                            ${opt}
                                        </div>
                                        ${this.isAnswered && isCorrect ? '<i class="fa-solid fa-circle-check text-emerald-400 text-xl shrink-0"></i>' : ''}
                                        ${this.isAnswered && isChosen && !isCorrect ? '<i class="fa-solid fa-circle-xmark text-rose-400 text-xl shrink-0"></i>' : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <!-- CEVAPLANDIKTAN SONRA: AÇIKLAMA & SONRAKİ SORU BUTONU -->
                        ${this.isAnswered ? `
                            <div class="glass-panel rounded-3xl p-5 border ${this.selectedOption === current.correctAnswer ? 'border-emerald-500/40 bg-emerald-950/20' : 'border-rose-500/40 bg-rose-950/20'} animate-pop space-y-3">
                                <div class="flex items-start justify-between gap-4">
                                    <div class="flex items-start gap-3">
                                        <div class="w-10 h-10 rounded-xl ${this.selectedOption === current.correctAnswer ? 'bg-emerald-500/30 text-emerald-300' : 'bg-rose-500/30 text-rose-300'} flex items-center justify-center text-xl shrink-0 mt-0.5">
                                            <i class="fa-solid ${this.selectedOption === current.correctAnswer ? 'fa-check' : 'fa-xmark'}"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-black text-sm sm:text-base ${this.selectedOption === current.correctAnswer ? 'text-emerald-300' : 'text-rose-300'}">
                                                ${this.selectedOption === current.correctAnswer ? 'Tebrikler! Doğru Cevap (+100 Puan)' : 'Maalesef Yanlış Cevap!'}
                                            </h4>
                                            <p class="text-xs sm:text-sm text-slate-300 mt-1 leading-relaxed">
                                                ${current.explanation}
                                            </p>
                                        </div>
                                    </div>
                                    <button onclick="game.nextQuestion()" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-sm sm:text-base shadow-lg shadow-amber-500/20 transition-all hover:scale-105 active:scale-95 flex items-center gap-2 shrink-0">
                                        <span>${this.currentIndex < this.questions.length - 1 ? 'Sonraki Soru' : 'Sonucu Gör'}</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            renderResultView() {
                const total = this.questions.length;
                const percentage = Math.round((this.correctCount / total) * 100);

                let badge = "Teknoloji Meraklısı 💡";
                let badgeColor = "text-yellow-400";
                if (this.correctCount === 16) {
                    badge = "Yapay Zekâ Başmühendisi 🚀";
                    badgeColor = "text-emerald-400";
                } else if (this.correctCount >= 12) {
                    badge = "Yapay Zekâ Uzmanı 🤖";
                    badgeColor = "text-cyan-400";
                } else if (this.correctCount >= 8) {
                    badge = "Veri Dedektifi 🕵️‍♂️";
                    badgeColor = "text-amber-400";
                }

                return `
                    <div class="glass-panel rounded-3xl p-6 sm:p-10 max-w-xl mx-auto text-center space-y-6 shadow-2xl animate-pop border-2 border-amber-400/50">
                        <div class="w-24 h-24 mx-auto rounded-3xl bg-gradient-to-tr from-amber-500 via-orange-500 to-yellow-400 text-slate-950 flex items-center justify-center text-5xl shadow-xl shadow-amber-500/30">
                            <i class="fa-solid fa-medal"></i>
                        </div>
                        <div class="space-y-2">
                            <span class="px-3 py-1 bg-amber-400/20 text-amber-300 font-extrabold rounded-full text-xs uppercase tracking-wider border border-amber-400/30">
                                YARIŞMA TAMAMLANDI!
                            </span>
                            <h2 class="text-2xl sm:text-4xl font-black text-white">Sonuç Raporu</h2>
                            <div class="text-lg font-black ${badgeColor}">${badge}</div>
                        </div>

                        <div class="grid grid-cols-3 gap-3 bg-slate-900/90 rounded-2xl p-4 border border-slate-800">
                            <div>
                                <div class="text-[11px] text-slate-400 font-bold">Toplam Puan</div>
                                <div class="text-2xl font-black text-amber-300">${this.score}</div>
                            </div>
                            <div class="border-x border-slate-800">
                                <div class="text-[11px] text-slate-400 font-bold">Doğru / Yanlış</div>
                                <div class="text-2xl font-black text-emerald-400">${this.correctCount} <span class="text-xs text-rose-400 font-bold">/ ${this.wrongCount}</span></div>
                            </div>
                            <div>
                                <div class="text-[11px] text-slate-400 font-bold">Başarı Oranı</div>
                                <div class="text-2xl font-black text-cyan-300">%${percentage}</div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
                            <button onclick="game.startQuiz()" class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-base shadow-lg shadow-amber-500/30 transition-all hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Tekrar Yarış!</span>
                            </button>
                            <button onclick="window.history.back()" class="px-6 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-base border border-slate-700 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Portala Dön</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            toggleAudio() {
                sounds.muted = !sounds.muted;
                const icon = document.getElementById("audio-icon");
                if (icon) {
                    icon.className = sounds.muted ? "fa-solid fa-volume-xmark text-lg text-slate-500" : "fa-solid fa-volume-high text-lg text-yellow-400";
                }
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        const game = new AIReviewGame();
        window.addEventListener("DOMContentLoaded", () => {
            game.init();
        });
    </script>
</body>
</html>
