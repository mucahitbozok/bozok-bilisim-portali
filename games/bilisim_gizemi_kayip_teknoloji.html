    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }
            playBeep(freq, type, duration, gainVal = 0.15) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playClick() { this.playBeep(520, 'sine', 0.08, 0.1); }
            playCorrect() {
                this.playBeep(440, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playBeep(587, 'triangle', 0.12, 0.2), 90);
                setTimeout(() => this.playBeep(880, 'triangle', 0.25, 0.25), 180);
            }
            playWrong() {
                this.playBeep(240, 'sawtooth', 0.15, 0.25);
                setTimeout(() => this.playBeep(180, 'sawtooth', 0.25, 0.25), 120);
            }
            playFanfare() {
                const notes = [523, 659, 784, 1046, 1318];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playBeep(freq, 'triangle', 0.35, 0.25), idx * 120);
                });
            }
        }

                    container.innerHTML = this.getClueHTML();
                } else if (this.state === 'result') {
                    container.innerHTML = this.getResultHTML();
                }
            }

            getIntroHTML() {
                return `
                    <div class="glass-panel p-6 sm:p-10 rounded-3xl text-center space-y-6 animate-pop shadow-2xl">
                        <div class="inline-flex p-6 rounded-3xl bg-gradient-to-tr from-amber-500 to-yellow-400 text-slate-950 text-5xl sm:text-6xl shadow-xl shadow-amber-500/20 animate-bounce">
                            <i class="fa-solid fa-user-secret"></i>
                        </div>

                        <div class="space-y-3">
                            <span class="px-4 py-1.5 rounded-full bg-amber-500/20 text-yellow-300 font-extrabold text-xs sm:text-sm uppercase tracking-wider border border-amber-400/40">
                                🕵️ BİLİŞİM LABORATUVARI ACİL DURUM
                            </span>
                            <h2 class="text-2xl sm:text-4xl font-black text-white">Bilişim Gizemi: Kayıp Teknoloji</h2>
                            <p class="text-sm sm:text-base text-slate-300 max-w-2xl mx-auto leading-relaxed">
                                Okulumuzun Bilişim Laboratuvarı'ndaki çok gizli <strong>“Kuantum Bilişim Çipi”</strong> kayboldu! Onu bulmak için 1, 2 ve 3. haftalarda öğrendiğin tüm bilişim bilgilerini kullanarak <strong>6 kritik ipucunu</strong> çözmen gerekiyor.
                            </p>
                        </div>

                        <!-- 6 İPUCU ÖNİZLEME -->
                        <div class="grid grid-cols-2 sm:grid-cols-6 gap-2.5 max-w-4xl mx-auto text-left pt-2">
                            <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-center">
                                <div class="text-amber-400 text-lg mb-1"><i class="fa-solid fa-laptop-code"></i></div>
                                <div class="text-xs font-bold text-white">İpucu 1</div>
                                <div class="text-[10px] text-slate-400">Bilişim Nedir?</div>
                            </div>
                            <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-center">
                                <div class="text-cyan-400 text-lg mb-1"><i class="fa-solid fa-hospital"></i></div>
                                <div class="text-xs font-bold text-white">İpucu 2</div>
                                <div class="text-[10px] text-slate-400">Kullanım Alanı</div>
                            </div>
                            <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-center">
                                <div class="text-rose-400 text-lg mb-1"><i class="fa-solid fa-heart-pulse"></i></div>
                                <div class="text-xs font-bold text-white">İpucu 3</div>
                                <div class="text-[10px] text-slate-400">Dijital Sağlık</div>
                            </div>
                            <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-center">
                                <div class="text-emerald-400 text-lg mb-1"><i class="fa-solid fa-shield-halved"></i></div>
                                <div class="text-xs font-bold text-white">İpucu 4</div>
                                <div class="text-[10px] text-slate-400">Vatandaşlık</div>
                            </div>
                            <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-center">
                                <div class="text-purple-400 text-lg mb-1"><i class="fa-solid fa-id-card"></i></div>
                                <div class="text-xs font-bold text-white">İpucu 5</div>
                                <div class="text-[10px] text-slate-400">Dijital Kimlik</div>
                            </div>
                            <div class="p-3 bg-slate-900/80 rounded-2xl border border-slate-800 text-center">
                                <div class="text-blue-400 text-lg mb-1"><i class="fa-solid fa-shoe-prints"></i></div>
                                <div class="text-xs font-bold text-white">İpucu 6</div>
                                <div class="text-[10px] text-slate-400">Ayak İzi</div>
                            </div>
                        </div>

                        <div class="pt-4">
                            <button onclick="game.startClues()" class="btn-card px-10 py-4 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black text-lg sm:text-xl rounded-2xl shadow-xl shadow-amber-500/30 flex items-center gap-3 mx-auto border-2 border-yellow-300">
                                <i class="fa-solid fa-magnifying-glass-chart"></i>
                                <span>Dedektif Görevini Başlat!</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            getClueHTML() {
                const clue = this.clues[this.currentClue];
                const progressPct = ((this.currentClue + 1) / this.clues.length) * 100;

                return `
                    <div class="space-y-6 animate-pop">
                        <!-- ÜST İLERLEME ÇUBUĞU & PUAN -->
                        <div class="flex items-center justify-between gap-4 bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 rounded-xl bg-gradient-to-r ${clue.color} text-white font-black text-xs sm:text-sm shadow">
                                    ${clue.title}
                                </span>
                                <span class="text-xs font-bold text-slate-400 hidden sm:inline-block">${clue.week}</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-xs font-bold text-yellow-300 flex items-center gap-1.5">
                                    <i class="fa-solid fa-star"></i>
                                    <span>Puan: ${this.score}</span>
                                </div>
                                <span class="text-xs font-bold text-slate-400">${this.currentClue + 1} / ${this.clues.length}</span>
                            </div>
                        </div>

                        <!-- İPUCU GÖREV KARTI -->
                        <div id="clue-card" class="glass-panel p-6 sm:p-8 rounded-3xl space-y-6 border-2 ${clue.borderColor} shadow-2xl">
                            <!-- HİKAYE BALONU -->
                            <div class="p-4 sm:p-5 bg-slate-950/80 rounded-2xl border border-slate-800 flex items-start gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-300 flex items-center justify-center text-2xl shrink-0 shadow-inner">
                                    <i class="fa-solid fa-user-secret"></i>
                                </div>
                                <div>
                                    <span class="text-[11px] font-black text-amber-400 uppercase tracking-widest block mb-0.5">BİLİŞİM DEDEKTİFİ DOSYASI</span>
                                    <p class="text-sm sm:text-base font-semibold text-slate-100 leading-relaxed">${clue.storyText}</p>
                                </div>
                            </div>

                            <!-- SORU METNİ -->
                            <div class="space-y-2">
                                <h3 class="text-base sm:text-xl font-black text-white leading-snug">${clue.question}</h3>
                            </div>

                            <!-- SEÇENEKLER / ETKİLEŞİM ALANI -->
                            <div id="options-area">
                                ${this.renderOptions(clue)}
                            </div>

                            <!-- GERİ BİLDİRİM KUTUSU -->
                            <div id="feedback-box" class="hidden"></div>
                        </div>
                    </div>
                `;
            }

            renderOptions(clue) {
                if (clue.type === 'single') {
                    return `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                            ${clue.options.map((opt, idx) => `
                                <button onclick="game.handleSingleChoice(${idx})" class="btn-card p-4 sm:p-5 rounded-2xl bg-slate-900/90 hover:bg-slate-800 border-2 border-slate-700 hover:border-amber-400 text-left flex items-center justify-between gap-3 text-white transition-all group">
                                    <div class="flex items-center gap-3">
                                        <span class="w-9 h-9 rounded-xl bg-slate-800 text-amber-300 group-hover:bg-amber-500 group-hover:text-slate-950 font-black text-sm flex items-center justify-center transition-colors">
                                            ${opt.badge}
                                        </span>
                                        <span class="text-sm sm:text-base font-bold">${opt.text}</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-amber-300"></i>
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else if (clue.type === 'multi') {
                    return `
                        <div class="space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${clue.options.map((opt, idx) => `
                                    <button id="multi-btn-${idx}" onclick="game.toggleMultiChoice(${idx})" class="btn-card p-3.5 sm:p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 text-left flex items-center justify-between gap-3 text-slate-200 transition-all">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-xl bg-slate-800 text-amber-300 flex items-center justify-center text-sm">
                                                <i class="${opt.icon || 'fa-solid fa-check'}"></i>
                                            </div>
                                            <span class="text-xs sm:text-sm font-bold">${opt.text}</span>
                                        </div>
                                        <div id="multi-check-${idx}" class="w-6 h-6 rounded-lg border-2 border-slate-600 flex items-center justify-center text-xs"></div>
                                    </button>
                                `).join('')}
                            </div>
                            <div class="text-center pt-2">
                                <button onclick="game.checkMultiChoice()" class="btn-card px-8 py-3.5 bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-sm sm:text-base rounded-xl shadow-lg border border-yellow-300">
                                    <i class="fa-solid fa-clipboard-check mr-2"></i> İpuçlarını Doğrula ve Kontrol Et!
                                </button>
                            </div>
                        </div>
                    `;
                } else if (clue.type === 'classify') {
                    return `
                        <div class="space-y-4">
                            <p class="text-xs text-slate-300">Aşağıdaki her davranışın yanındaki butona basarak <strong>AKTİF</strong> mi yoksa <strong>PASİF</strong> mi olduğunu belirle:</p>
                            <div class="space-y-3">
                                ${clue.items.map((item, idx) => `
                                    <div class="p-3.5 sm:p-4 bg-slate-900/90 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                        <div class="text-xs sm:text-sm font-semibold text-white flex items-center gap-2">
                                            <i class="fa-solid fa-circle-dot text-amber-400 text-xs"></i>
                                            <span>${item.text}</span>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
                                            <button id="classify-${idx}-aktif" onclick="game.setClassify(${idx}, 'aktif')" class="px-4 py-2 rounded-xl text-xs font-black border border-blue-500/40 bg-slate-800 text-blue-300 transition-all">
                                                🐾 Aktif İz
                                            </button>
                                            <button id="classify-${idx}-pasif" onclick="game.setClassify(${idx}, 'pasif')" class="px-4 py-2 rounded-xl text-xs font-black border border-cyan-500/40 bg-slate-800 text-cyan-300 transition-all">
                                                🐾 Pasif İz
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="text-center pt-2">
                                <button onclick="game.checkClassify()" class="btn-card px-8 py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black text-sm sm:text-base rounded-xl shadow-lg border border-cyan-400">
                                    <i class="fa-solid fa-key mr-2"></i> Sandığı Aç & Sonucu Gör!
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            handleSingleChoice(idx) {
                const clue = this.clues[this.currentClue];
                const opt = clue.options[idx];
                const isCorrect = opt.isCorrect;

                if (isCorrect) {
                    sounds.playCorrect();
                    this.score += 10;
                } else {
                    sounds.playWrong();
                }

                this.showFeedback(isCorrect, isCorrect ? clue.feedbackCorrect : clue.feedbackWrong);
            }

            toggleMultiChoice(idx) {
                sounds.playClick();
                const pos = this.selectedMulti.indexOf(idx);
                if (pos > -1) {
                    this.selectedMulti.splice(pos, 1);
                } else {
                    this.selectedMulti.push(idx);
                }

                const btn = document.getElementById(`multi-btn-${idx}`);
                const check = document.getElementById(`multi-check-${idx}`);
                if (btn && check) {
                    const isSelected = this.selectedMulti.includes(idx);
                    if (isSelected) {
                        btn.classList.add('border-amber-400', 'bg-amber-950/40');
                        check.className = "w-6 h-6 rounded-lg bg-amber-400 border-2 border-amber-300 text-slate-950 flex items-center justify-center text-xs font-black";
                        check.innerHTML = '<i class="fa-solid fa-check"></i>';
                    } else {
                        btn.classList.remove('border-amber-400', 'bg-amber-950/40');
                        check.className = "w-6 h-6 rounded-lg border-2 border-slate-600 flex items-center justify-center text-xs";
                        check.innerHTML = '';
                    }
                }
            }

            checkMultiChoice() {
                const clue = this.clues[this.currentClue];
                let allCorrect = true;

                clue.options.forEach((opt, idx) => {
                    const isSelected = this.selectedMulti.includes(idx);
                    if (opt.isCorrect && !isSelected) allCorrect = false;
                    if (!opt.isCorrect && isSelected) allCorrect = false;
                });

                if (allCorrect) {
                    sounds.playCorrect();
                    this.score += 10;
                } else {
                    sounds.playWrong();
                }

                this.showFeedback(allCorrect, allCorrect ? clue.feedbackCorrect : clue.feedbackWrong);
            }

            setClassify(idx, type) {
                sounds.playClick();
                this.classifyAnswers[idx] = type;
                const btnAktif = document.getElementById(`classify-${idx}-aktif`);
                const btnPasif = document.getElementById(`classify-${idx}-pasif`);

                if (type === 'aktif') {
                    btnAktif.className = "px-4 py-2 rounded-xl text-xs font-black border-2 border-blue-400 bg-blue-600 text-white shadow-md";
                    btnPasif.className = "px-4 py-2 rounded-xl text-xs font-black border border-slate-700 bg-slate-800 text-slate-400";
                } else {
                    btnPasif.className = "px-4 py-2 rounded-xl text-xs font-black border-2 border-cyan-400 bg-cyan-600 text-white shadow-md";
                    btnAktif.className = "px-4 py-2 rounded-xl text-xs font-black border border-slate-700 bg-slate-800 text-slate-400";
                }
            }

            checkClassify() {
                const clue = this.clues[this.currentClue];
                if (Object.keys(this.classifyAnswers).length < clue.items.length) {
                    alert("Lütfen tüm maddeleri Aktif veya Pasif olarak işaretleyiniz!");
                    return;
                }

                let allCorrect = true;
                clue.items.forEach((item, idx) => {
                    if (this.classifyAnswers[idx] !== item.type) allCorrect = false;
                });

                if (allCorrect) {
                    sounds.playCorrect();
                    this.score += 10;
                } else {
                    sounds.playWrong();
                }

                this.showFeedback(allCorrect, allCorrect ? clue.feedbackCorrect : clue.feedbackWrong);
            }

            showFeedback(isCorrect, message) {
                const fbBox = document.getElementById("feedback-box");
                if (!fbBox) return;

                fbBox.classList.remove("hidden");
                fbBox.innerHTML = `
                    <div class="p-5 rounded-2xl border-2 ${isCorrect ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' : 'bg-rose-950/90 border-rose-500 text-rose-200'} space-y-4 animate-pop shadow-xl">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-rose-400'} text-2xl"></i>
                            <div>
                                <span class="text-xs font-black uppercase tracking-wider block">${isCorrect ? 'İPUCU ÇÖZÜLDÜ! (+10 PUAN)' : 'DİKKAT! YANLIŞ YORUM'}</span>
                                <p class="text-sm font-semibold">${message}</p>
                            </div>
                        </div>

                        <div class="text-right pt-2 border-t ${isCorrect ? 'border-emerald-500/30' : 'border-rose-500/30'}">
                            <button onclick="game.nextClue()" class="btn-card px-6 py-2.5 bg-white text-slate-950 font-black rounded-xl text-xs sm:text-sm shadow-md inline-flex items-center gap-2">
                                <span>${this.currentClue < this.clues.length - 1 ? 'Sonraki İpucuna Geç ➔' : 'Gizemi Çöz ve Finali Gör 🏆'}</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            nextClue() {
                sounds.playClick();
                this.selectedMulti = [];
                this.classifyAnswers = {};

                if (this.currentClue < this.clues.length - 1) {
                    this.currentClue++;
                    this.render();
                } else {
                    this.finishGame();
                }
            }

            finishGame() {
                sounds.playFanfare();
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }
                this.state = 'result';
                this.render();
            }

            getResultHTML() {
                return `
                    <div class="glass-panel p-6 sm:p-10 rounded-3xl text-center space-y-6 animate-pop shadow-2xl border-2 border-amber-400/50">
                        <!-- BULUNAN KAYIP TEKNOLOJİ -->
                        <div class="inline-flex p-6 rounded-3xl bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-500 text-slate-950 text-6xl shadow-2xl animate-glow">
                            <i class="fa-solid fa-microchip"></i>
                        </div>

                        <div class="space-y-3">
                            <span class="px-4 py-1 rounded-full bg-emerald-500/20 text-emerald-300 font-extrabold text-xs uppercase tracking-widest border border-emerald-400/40">
                                🏆 GİZEM ÇÖZÜLDÜ! KAYIP TEKNOLOJİ BULUNDU!
                            </span>
                            <h2 class="text-2xl sm:text-4xl font-black text-white">TEBRİKLER BİLİŞİM DEDEKTİFİ!</h2>
                            <p class="text-sm sm:text-base text-slate-200 max-w-xl mx-auto leading-relaxed">
                                1, 2 ve 3. haftada öğrendiklerini kullanarak gizemi başarıyla çözdün! Kaybolan <strong>“Kuantum Bilişim Çipi”</strong> güvenle laboratuvardaki yerine takıldı.
                            </p>
                        </div>

                        <!-- PUAN KARTLARI -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-w-lg mx-auto">
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Toplam Puan</div>
                                <div class="text-3xl font-black text-yellow-400">${this.score} / 60</div>
                            </div>
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Çözülen İpucu</div>
                                <div class="text-3xl font-black text-emerald-400">6 / 6</div>
                            </div>
                            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 col-span-2 sm:col-span-1">
                                <div class="text-[10px] text-slate-400 font-bold uppercase">Dedektif Rütbesi</div>
                                <div class="text-base font-black text-amber-300 mt-1">Usta Dedektif 🎖️</div>
                            </div>
                        </div>

                        <!-- BUTONLAR -->
                        <div class="flex justify-center gap-4 flex-wrap pt-2">
                            <button onclick="game.startClues()" class="btn-card px-8 py-3.5 bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-sm sm:text-base rounded-2xl shadow-xl flex items-center gap-2 border-2 border-yellow-300">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Tekrar Oyna</span>
                            </button>
                            <button onclick="game.state = 'intro'; game.render();" class="btn-card px-8 py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm sm:text-base rounded-2xl shadow-lg flex items-center gap-2 border border-slate-700">
                                <i class="fa-solid fa-house"></i>
                                <span>Ana Menü</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            startClues() {
                sounds.playClick();
                this.state = 'clue';
                this.currentClue = 0;
                this.score = 0;
                this.selectedMulti = [];
                this.classifyAnswers = {};
                this.render();
            }

            toggleAudio() {
                sounds.muted = !sounds.muted;
                const icon = document.getElementById('audio-icon');
                if (icon) {
                    icon.className = sounds.muted ? "fa-solid fa-volume-xmark text-rose-400" : "fa-solid fa-volume-high text-yellow-400";
                }
            }

            toggleFullscreen() {
                sounds.playClick();
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }
        }

        const game = new MysteryGame();
        window.onload = () => game.init();
    </script>
</body>
</html>
