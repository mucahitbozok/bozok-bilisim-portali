<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donanım Mahkemesi | Öğretmen Bozok</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #070b18; color: #f8fafc; font-family: 'Poppins', sans-serif; min-height: 100vh; }
        .glass-court { background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(14px); border: 2px solid rgba(245, 158, 11, 0.35); }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes gavelHit { 0% { transform: rotate(0deg); } 40% { transform: rotate(-35deg); } 70% { transform: rotate(15deg); } 100% { transform: rotate(0deg); } }
        .gavel-anim { animation: gavelHit 0.4s ease-in-out; }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col justify-between">

    <!-- ÜST ÇUBUK -->
    <header class="max-w-5xl w-full mx-auto flex items-center justify-between pb-4 border-b border-amber-500/20">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center text-2xl shadow-lg">
                <i class="fa-solid fa-gavel"></i>
            </div>
            <div>
                <span class="px-2.5 py-0.5 bg-amber-400/20 text-yellow-300 font-extrabold text-[10px] tracking-widest rounded-full uppercase border border-amber-400/30">
                    BTY.5.1.5 • TEKNOLOJİ YARGISI
                </span>
                <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight flex items-center gap-2">
                    DONANIM MAHKEMESİ
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <div class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-amber-300 flex items-center gap-2">
                <i class="fa-solid fa-scale-balanced text-amber-400"></i>
                <span>Puan: <strong id="court-score" class="text-white text-sm">0</strong></span>
            </div>
            <div class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-cyan-300 flex items-center gap-2">
                <i class="fa-solid fa-file-signature text-cyan-400"></i>
                <span>Duruşma: <strong id="trial-counter" class="text-white text-sm">1 / 8</strong></span>
            </div>
            <button onclick="court.toggleSound()" id="sound-btn" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 text-amber-400 flex items-center justify-center hover:bg-slate-800 transition-all">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="court.reset()" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 flex items-center justify-center hover:bg-slate-800 transition-all">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- ANA MAHKEME SALONU -->
    <main id="court-main" class="max-w-5xl w-full mx-auto my-auto py-4 flex-1 flex flex-col justify-center">
        <!-- JS buraya duruşmayı basar -->
    </main>

    <!-- ALT BİLGİ -->
    <footer class="max-w-5xl w-full mx-auto text-center pt-3 border-t border-slate-800 text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-2">
        <span>⚖️ BTY.5.1.5: Donanım iddialarını teknik delillerle değerlendir, gerekçeli kararını açıkla!</span>
        <span class="text-amber-400/80 font-semibold">Öğretmen Bozok • Bozok Bilişim Portalı</span>
    </footer>

    <script>
        const sfx = {
            ctx: null,
            enabled: true,
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
            },
            play(freq, type = 'sine', duration = 0.12, vol = 0.2) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            gavel() {
                if (!this.enabled) return;
                this.init();
                this.play(140, 'triangle', 0.2, 0.4);
                setTimeout(() => this.play(100, 'sine', 0.3, 0.4), 80);
            },
            correct() {
                if (!this.enabled) return;
                this.init();
                [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.play(f, 'triangle', 0.2, 0.25), i * 80));
            },
            wrong() {
                if (!this.enabled) return;
                this.init();
                this.play(180, 'sawtooth', 0.3, 0.25);
            },
            win() {
                if (!this.enabled) return;
                this.init();
                [440, 554, 659, 880, 1108].forEach((f, i) => setTimeout(() => this.play(f, 'sine', 0.3, 0.25), i * 100));
            }
        };

        const TRIALS = [
            {
                id: 1,
                title: "DURUŞMA 1: RAM Bellek Davası",
                item: "RAM Bellek",
                icon: "fa-memory",
                claim: "“RAM bellek, bilgisayardaki tüm dosya ve belgeleri kalıcı olarak depolar; bilgisayar kapansa bile veriler asla silinmez.”",
                correctVerdict: "YANLIS",
                reasonOptions: [
                    { text: "RAM geçici bellektir. Sadece bilgisayar açıkken çalışan verileri tutar, kapanınca her şey silinir.", correct: true },
                    { text: "RAM kalıcı saklar ama sadece müzik dosyalarını tutamaz.", correct: false },
                    { text: "RAM bir dış donanım olduğu için dosyaları kağıda basar.", correct: false }
                ],
                explanation: "HÂKİM KARARI: İddia bütünüyle YANLIŞTIR! RAM geçici bellektir (çalışma masası gibidir). Kalıcı depolamayı Sabit Disk (HDD) ve SSD yapar."
            },
            {
                id: 2,
                title: "DURUŞMA 2: İşlemci (CPU) Davası",
                item: "İşlemci (CPU)",
                icon: "fa-microchip",
                claim: "“İşlemci (CPU), bilgisayarın beynidir. Tüm matematiksel hesaplamaları, mantıksal kararları ve komutları ışık hızında yürütür.”",
                correctVerdict: "DOGRU",
                reasonOptions: [
                    { text: "İşlemci komutları yorumlayan ve tüm sistem parçalarını yöneten merkezi işlem birimidir.", correct: true },
                    { text: "Çünkü işlemci kasaya elektrik veren bir priz kutusudur.", correct: false },
                    { text: "İşlemci sadece ekrandaki piksellerin rengini seçer.", correct: false }
                ],
                explanation: "HÂKİM KARARI: İddia DOĞRUDUR! CPU (Merkezi İşlem Birimi) bilgisayarın düşünen, hesaplayan ve komutları çalıştıran gerçek beynidir."
            },
            {
                id: 3,
                title: "DURUŞMA 3: Monitör Sınıflandırma Davası",
                item: "Monitör (Ekran)",
                icon: "fa-desktop",
                claim: "“Monitör, bilgisayara dış dünyadan harf ve komut girmek için kullanılan temel bir GİRİŞ BİRİMİDİR.”",
                correctVerdict: "YANLIS",
                reasonOptions: [
                    { text: "Monitör işlenen verileri bize görüntü olarak sunan bir ÇIKIŞ BİRİMİDİR.", correct: true },
                    { text: "Monitör elektrik ürettiği için iç donanımdır.", correct: false },
                    { text: "Monitör sadece ses dinlemek için kullanılır.", correct: false }
                ],
                explanation: "HÂKİM KARARI: İddia KESİNLİKLE YANLIŞTIR! Monitör bilgisayardaki bilgiyi kullanıcının gözüne sunan temel bir ÇIKIŞ birimidir."
            },
            {
                id: 4,
                title: "DURUŞMA 4: Dokunmatik Ekran Davası",
                item: "Dokunmatik Ekran",
                icon: "fa-mobile-screen",
                claim: "“Dokunmatik ekran, hem görüntüyü sunan (Çıkış) hem de parmak dokunuşuyla komut alan (Giriş) ÇİFT YÖNLÜ bir donanımdır.”",
                correctVerdict: "DOGRU",
                reasonOptions: [
                    { text: "Ekrana bakıp çıktıyı görürüz, dokunarak da içeriye komut göndeririz; yani iki yönlü çalışır.", correct: true },
                    { text: "Çünkü kasanın içine takılan bir iç donanımdır.", correct: false },
                    { text: "Dokunmatik ekran aslında sadece bir klavyedir.", correct: false }
                ],
                explanation: "HÂKİM KARARI: İddia HAKLI VE DOĞRUDUR! Dokunmatik ekranlar hem giriş hem çıkış özelliğini tek gövdede birleştiren çift yönlü aygıtlardır."
            },
            {
                id: 5,
                title: "DURUŞMA 5: Yavaşlama & Arıza Davası",
                item: "Sistem Teşhisi",
                icon: "fa-triangle-exclamation",
                claim: "“Bilgisayarda meydana gelen her donma veya yavaşlama sorunu MUTLAKA işlemcinin (CPU) bozulmasından kaynaklanır.”",
                correctVerdict: "YANLIS",
                reasonOptions: [
                    { text: "Yavaşlama yetersiz RAM bellekten, virüslerden, dolu diskten veya aşırı ısınmadan da kaynaklanabilir.", correct: true },
                    { text: "İşlemci hiçbir zaman arızalanmaz.", correct: false },
                    { text: "Bilgisayarlar sadece internet kesilince yavaşlar.", correct: false }
                ],
                explanation: "HÂKİM KARARI: İddia REDDEDİLMİŞTİR! Tek bir belirtiden tek donanım sorumlu tutulamaz. RAM yetersizliği veya dolu SSD de sistemi kilitler."
            },
            {
                id: 6,
                title: "DURUŞMA 6: USB Bellek Davası",
                item: "USB Bellek (Flash Disk)",
                icon: "fa-usb",
                claim: "“USB bellek, içine dosya kopyalanabilen (yazma) ve içindeki dosyalar açılabilen (okuma) ÇİFT YÖNLÜ bir depolama aygıtıdır.”",
                correctVerdict: "DOGRU",
                reasonOptions: [
                    { text: "Veri bilgisayardan belleğe aktarılabilir ve bellekten bilgisayara geri okunabilir (çift yönlü).", correct: true },
                    { text: "USB bellek sadece klavye gibi yazı yazmaya yarar.", correct: false },
                    { text: "USB bellek kasanın içine gömülü sabit bir parçadır.", correct: false }
                ],
                explanation: "HÂKİM KARARI: İddia KABUL EDİLMİŞTİR! USB bellek iki yönlü veri alışverişi yapan taşınabilir depolama birimidir."
            },
            {
                id: 7,
                title: "DURUŞMA 7: Hız Düellosu Davası",
                item: "SSD vs HDD",
                icon: "fa-gauge-high",
                claim: "“Sabit disk (HDD) ile yeni nesil SSD arasında hiçbir hız farkı yoktur; ikisi de programları aynı sürede açar.”",
                correctVerdict: "YANLIS",
                reasonOptions: [
                    { text: "SSD mekanik parçası olmadığı için HDD'ye göre kat kat daha hızlı, sessiz ve dayanıklıdır.", correct: true },
                    { text: "HDD mekanik olduğu için her zaman SSD'den hızlıdır.", correct: false },
                    { text: "SSD sadece elektrik kesilince çalışır.", correct: false }
                ],
                explanation: "HÂKİM KARARI: İddia HÜKÜMSÜZDÜR! SSD'ler (Katı Hal Sürücüleri) eski manyetik HDD'lere kıyasla bilgisayarı ve oyunları ışık hızında açar."
            },
            {
                id: 8,
                title: "DURUŞMA 8: Kulaklık Görev Davası",
                item: "Kulaklık",
                icon: "fa-headphones",
                claim: "“Kulaklık, konuşma sesimizi bilgisayara aktararak kayıt yapmamızı sağlayan bir GİRİŞ BİRİMİDİR.”",
                correctVerdict: "YANLIS",
                reasonOptions: [
                    { text: "Kulaklık sesi dışarı veren bir ÇIKIŞ BİRİMİDİR. Ses kaydetmek için mikrofon (giriş birimi) gerekir.", correct: true },
                    { text: "Kulaklık bir iç donanımdır ve anakarta lehimlidir.", correct: false },
                    { text: "Kulaklık monitör gibi görüntü verir.", correct: false }
                ],
                explanation: "HÂKİM KARARI: İddia YANLIŞTIR! Kulaklık sesi sadece takan kişinin duymasını sağlayan bir ÇIKIŞ birimidir. Ses kaydeden birim MİKROFON'dur."
            }
        ];

        class CourtGame {
            constructor() {
                this.idx = 0;
                this.score = 0;
                this.selectedVerdict = null;
            }

            init() {
                this.render();
            }

            toggleSound() {
                sfx.enabled = !sfx.enabled;
                const icon = document.getElementById("sound-btn").querySelector("i");
                if (icon) icon.className = sfx.enabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark text-slate-500";
            }

            reset() {
                sfx.gavel();
                this.idx = 0;
                this.score = 0;
                this.selectedVerdict = null;
                document.getElementById("court-score").innerText = this.score;
                this.render();
            }

            render() {
                const container = document.getElementById("court-main");
                document.getElementById("trial-counter").innerText = `${this.idx + 1} / ${TRIALS.length}`;
                document.getElementById("court-score").innerText = this.score;

                if (this.idx >= TRIALS.length) {
                    this.renderFinal();
                    return;
                }

                const t = TRIALS[this.idx];

                container.innerHTML = `
                    <div class="glass-court rounded-3xl p-5 sm:p-8 space-y-6 animate-pop shadow-2xl">
                        <!-- DURUŞMA BAŞLIĞI -->
                        <div class="flex items-center justify-between border-b border-amber-500/30 pb-3">
                            <span class="px-3 py-1 bg-amber-500/20 text-yellow-300 font-extrabold text-xs rounded-xl border border-amber-500/40">
                                ⚖️ ${t.title}
                            </span>
                            <span class="text-xs font-bold text-slate-400">Jüri Masası</span>
                        </div>

                        <!-- DELİL VE İDDİA KUTUSU -->
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-center">
                            <!-- Delil Kartı -->
                            <div class="md:col-span-4 p-5 rounded-2xl bg-slate-900/90 border-2 border-amber-400/40 text-center space-y-2 shadow-xl">
                                <div class="w-16 h-16 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-3xl mx-auto border border-amber-500/30">
                                    <i class="fa-solid ${t.icon}"></i>
                                </div>
                                <span class="text-[10px] font-black text-amber-300 uppercase tracking-widest block">DELİL PARÇASI</span>
                                <h4 class="text-base font-black text-white">${t.item}</h4>
                            </div>

                            <!-- İddia Metni -->
                            <div class="md:col-span-8 p-5 rounded-2xl bg-slate-900/80 border border-slate-700 space-y-2">
                                <div class="flex items-center gap-2 text-xs font-black text-amber-400 uppercase">
                                    <i class="fa-solid fa-scroll"></i>
                                    <span>MAHKEMEYE SUNULAN İDDİA:</span>
                                </div>
                                <p class="text-sm sm:text-base text-yellow-100 font-semibold leading-relaxed">
                                    ${t.claim}
                                </p>
                            </div>
                        </div>

                        <!-- JÜRİ KARAR BUTONLARI -->
                        <div class="space-y-3">
                            <span class="text-xs font-black text-slate-300 block text-center uppercase tracking-wider">
                                Sayın Jüri Üyesi, Bu İddia Hakkındaki Hükmünüz Nedir?
                            </span>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-lg mx-auto">
                                <button onclick="court.chooseVerdict('DOGRU')" class="p-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-sm rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-circle-check text-lg"></i>
                                    <span>BU İDDİA DOĞRU</span>
                                </button>
                                <button onclick="court.chooseVerdict('YANLIS')" class="p-3.5 rounded-2xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-black text-sm rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-circle-xmark text-lg"></i>
                                    <span>BU İDDİA YANLIŞ</span>
                                </button>
                            </div>
                        </div>

                        <div id="trial-fb" class="hidden"></div>
                    </div>
                `;
            }

            chooseVerdict(verdict) {
                const t = TRIALS[this.idx];
                const fb = document.getElementById("trial-fb");
                fb.classList.remove("hidden");

                if (verdict === t.correctVerdict) {
                    sfx.click();
                    this.selectedVerdict = verdict;
                    this.renderReasonStage();
                } else {
                    sfx.wrong();
                    fb.innerHTML = `
                        <div class="p-4 rounded-2xl bg-rose-950/90 border-2 border-rose-500 text-rose-200 text-xs sm:text-sm font-bold flex items-center justify-between gap-3 animate-pop shadow-lg">
                            <div>
                                <span class="block font-black text-rose-300">⚠️ HATALI HÜKÜM!</span>
                                <span>Verdiğin karar teknik gerçeklerle uyuşmuyor. İddiayı ve parçanın görevini tekrar değerlendir!</span>
                            </div>
                            <button onclick="document.getElementById('trial-fb').classList.add('hidden')" class="px-3.5 py-1.5 bg-slate-800 text-white rounded-xl text-xs font-bold shrink-0">
                                Kararı Değiştir
                            </button>
                        </div>
                    `;
                }
            }

            renderReasonStage() {
                const t = TRIALS[this.idx];
                const fb = document.getElementById("trial-fb");
                fb.classList.remove("hidden");

                fb.innerHTML = `
                    <div class="p-5 rounded-2xl bg-indigo-950/90 border-2 border-amber-400 text-white space-y-3 animate-pop shadow-2xl">
                        <div class="flex items-center gap-2 text-yellow-300 font-black text-sm uppercase">
                            <i class="fa-solid fa-scale-balanced text-lg"></i>
                            <span>GEREKÇELİ KARARINI BELİRT:</span>
                        </div>
                        <p class="text-xs text-indigo-200 font-medium">
                            Mahkeme kararları gerekçesiz olamaz. Kararını destekleyen doğru teknik sebebi seç:
                        </p>
                        <div class="space-y-2">
                            ${t.reasonOptions.map((opt, i) => `
                                <button onclick="court.verifyReason(${opt.correct})" class="w-full text-left p-3.5 rounded-xl bg-slate-900/90 hover:bg-amber-500/20 border border-slate-700 hover:border-amber-400 text-xs sm:text-sm font-bold text-slate-200 transition-all flex items-center gap-3">
                                    <span class="w-6 h-6 rounded-lg bg-amber-500/30 text-amber-300 font-black flex items-center justify-center text-xs shrink-0">${String.fromCharCode(65 + i)}</span>
                                    <span>${opt.text}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            verifyReason(isCorrect) {
                const t = TRIALS[this.idx];
                const fb = document.getElementById("trial-fb");

                if (isCorrect) {
                    sfx.gavel();
                    sfx.correct();
                    this.score += 15;
                    document.getElementById("court-score").innerText = this.score;

                    fb.innerHTML = `
                        <div class="p-5 rounded-2xl bg-emerald-950/90 border-2 border-emerald-500 text-emerald-200 space-y-3 animate-pop shadow-2xl">
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <div class="flex items-center gap-2 font-black text-emerald-300 text-base">
                                    <i class="fa-solid fa-gavel text-2xl text-yellow-400 gavel-anim"></i>
                                    <span>HÂKİM TOKMAĞI VURDU! KARAR ONANDI (+15 PUAN)</span>
                                </div>
                                <span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-300 font-bold text-xs rounded-lg">
                                    ADALET SAĞLANDI
                                </span>
                            </div>
                            <p class="text-xs sm:text-sm font-semibold text-white leading-relaxed">
                                ${t.explanation}
                            </p>
                            <div class="pt-2 flex justify-end">
                                <button onclick="court.nextTrial()" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-lg flex items-center gap-2 transition-all hover:scale-105 active:scale-95">
                                    <span>Sonraki Duruşmaya Geç</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    sfx.wrong();
                    fb.innerHTML = `
                        <div class="p-4 rounded-2xl bg-amber-950/90 border-2 border-amber-500 text-amber-200 text-xs sm:text-sm font-bold flex items-center justify-between gap-3 animate-pop shadow-lg">
                            <div>
                                <span class="block font-black text-amber-300">⚠️ GEREKÇE REDDEDİLDİ!</span>
                                <span>Doğru kararı verdin ancak seçtiğin teknik gerekçe donanımın gerçek görevini yansıtmıyor. Tekrar seç!</span>
                            </div>
                            <button onclick="court.renderReasonStage()" class="px-3.5 py-1.5 bg-slate-800 text-white rounded-xl text-xs font-bold shrink-0">
                                Yeniden Seç
                            </button>
                        </div>
                    `;
                }
            }

            nextTrial() {
                sfx.click();
                this.idx++;
                this.render();
            }

            renderFinal() {
                sfx.win();
                if (typeof confetti === "function") confetti({ particleCount: 100, spread: 70 });
                const container = document.getElementById("court-main");
                container.innerHTML = `
                    <div class="glass-court rounded-3xl p-8 sm:p-10 text-center space-y-6 max-w-2xl mx-auto animate-pop shadow-2xl">
                        <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-amber-400 to-yellow-500 text-slate-950 flex items-center justify-center text-5xl mx-auto shadow-2xl">
                            <i class="fa-solid fa-scale-balanced"></i>
                        </div>
                        <div class="space-y-1">
                            <span class="px-3 py-1 bg-amber-400/20 text-yellow-300 font-extrabold text-xs uppercase tracking-widest rounded-full border border-amber-400/40">
                                8 DURUŞMA TAMAMLANDI
                            </span>
                            <h2 class="text-2xl sm:text-4xl font-black text-white">DONANIM BİLGİNİ SAVUNDUN!</h2>
                            <p class="text-xs sm:text-sm text-slate-300">
                                Tüm donanım iddialarını adil ve teknik gerekçelerle hükme bağlayarak bilişim adaletini sağladın.
                            </p>
                        </div>

                        <div class="p-4 bg-slate-900 rounded-2xl border border-slate-700 flex items-center justify-around">
                            <div>
                                <span class="text-xs text-slate-400 block">Jüri Puanı</span>
                                <strong class="text-2xl font-black text-amber-400">${this.score} / 120</strong>
                            </div>
                            <div class="w-px h-10 bg-slate-800"></div>
                            <div>
                                <span class="text-xs text-slate-400 block">Mahkeme Unvanı</span>
                                <strong class="text-sm font-black text-emerald-400">YÜKSEK DONANIM HÂKİMİ ⚖️</strong>
                            </div>
                        </div>

                        <div class="flex items-center justify-center gap-3 pt-2">
                            <button onclick="court.reset()" class="px-6 py-3 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-black rounded-xl text-sm shadow-xl flex items-center gap-2 transition-all hover:scale-105 active:scale-95">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>Mahkemeyi Yeniden Başlat</span>
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        const court = new CourtGame();
        window.addEventListener("DOMContentLoaded", () => court.init());
    </script>
</body>
</html>
