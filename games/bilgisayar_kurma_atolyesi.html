<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgisayar Kurma Atölyesi | Öğretmen Bozok</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #070d1e; color: #f8fafc; font-family: 'Poppins', sans-serif; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(14px); border: 2px solid rgba(16, 185, 129, 0.35); }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col justify-between">

    <!-- ÜST ÇUBUK -->
    <header class="max-w-6xl w-full mx-auto flex items-center justify-between pb-4 border-b border-emerald-500/20">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center text-2xl shadow-lg">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>
            <div>
                <span class="px-2.5 py-0.5 bg-emerald-400/20 text-emerald-300 font-extrabold text-[10px] tracking-widest rounded-full uppercase border border-emerald-400/30">
                    BTY.5.1.5 • TEKNİSYEN ATÖLYESİ
                </span>
                <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight flex items-center gap-2">
                    BİLGİSAYAR KURMA ATÖLYESİ
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <div class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-yellow-300 flex items-center gap-2">
                <i class="fa-solid fa-coins text-yellow-400"></i>
                <span>Kalan Bütçe: <strong id="budget-display" class="text-white text-sm">10.000 ₺</strong></span>
            </div>
            <button onclick="builder.toggleSound()" id="sound-btn" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 text-emerald-400 flex items-center justify-center hover:bg-slate-800 transition-all">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="builder.reset()" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 flex items-center justify-center hover:bg-slate-800 transition-all">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- ANA ATÖLYE MASASI -->
    <main id="builder-main" class="max-w-6xl w-full mx-auto my-auto py-3 flex-1 flex flex-col justify-center">
        <!-- JS dinamik ekranları yükler -->
    </main>

    <!-- ALT BİLGİ -->
    <footer class="max-w-6xl w-full mx-auto text-center pt-3 border-t border-slate-800 text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-2">
        <span>⚙️ Simülasyon Uyarısı: Parçalar eğitim amaçlı basitleştirilmiştir; bütçeni aşmadan ihtiyaca uygun sistemi topla!</span>
        <span class="text-emerald-400/80 font-semibold">Öğretmen Bozok • Bozok Bilişim Portalı</span>
    </footer>

    <script>
        const sfx = {
            ctx: null,
            enabled: true,
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
            },
            play(freq, type = 'sine', duration = 0.12, vol = 0.2) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            click() { this.play(500, 'sine', 0.08, 0.15); },
            equip() {
                if (!this.enabled) return;
                this.init();
                this.play(600, 'triangle', 0.1, 0.2);
                setTimeout(() => this.play(800, 'triangle', 0.15, 0.2), 60);
            },
            wrong() {
                if (!this.enabled) return;
                this.init();
                this.play(200, 'sawtooth', 0.25, 0.2);
            },
            win() {
                if (!this.enabled) return;
                this.init();
                [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.play(f, 'sine', 0.25, 0.25), i * 90));
            }
        };

        const MISSIONS = [
            {
                id: 1,
                title: "1. Görev: Okul Ödevleri Bilgisayarı",
                target: "EBA, Word, sunu hazırlama ve internet araştırması için hesaplı bir ev ödevi sistemi kur.",
                budget: 10000,
                minReq: { ram: 8, storageType: "ssd", psu: 400 },
                badge: "TEMEL SEVİYE"
            },
            {
                id: 2,
                title: "2. Görev: Çevrim İçi Ders & Video Bilgisayarı",
                target: "Canlı dersler, çoklu pencereler, video izleme ve okul projeleri için akıcı bir çalışma bilgisayarı.",
                budget: 15000,
                minReq: { ram: 16, storageType: "ssd", psu: 500 },
                badge: "ORTA SEVİYE"
            },
            {
                id: 3,
                title: "3. Görev: Oyun & Görsel Tasarım Canavarı",
                target: "3D animasyon, grafik tasarım ve yüksek grafikli oyunlar için güçlü soğutmalı performans bilgisayarı.",
                budget: 25000,
                minReq: { ram: 16, storageType: "ssd", hasGPU: true, psu: 650 },
                badge: "İLERİ SEVİYE"
            }
        ];

        const CATALOG = {
            anakart: [
                { id: "mb1", name: "Standart Anakart", price: 1500, desc: "Tüm parçaları birbirine bağlayan sağlam temel devre kartı.", icon: "fa-chess-board" },
                { id: "mb2", name: "Gelişmiş Gaming Anakart", price: 3000, desc: "Yüksek hız ve RGB ışıklandırma destekli güçlü anakart.", icon: "fa-chess-board" }
            ],
            cpu: [
                { id: "cpu1", name: "4 Çekirdekli Temel İşlemci", price: 2000, desc: "Ödevler ve internet için yeterli güçte CPU.", icon: "fa-microchip" },
                { id: "cpu2", name: "6 Çekirdekli Hızlı İşlemci", price: 3500, desc: "Çoklu programları takılmadan çalıştıran güçlü işlemci.", icon: "fa-microchip" },
                { id: "cpu3", name: "8 Çekirdekli Turbo İşlemci", price: 6000, desc: "Oyun ve 3D grafikler için ışık hızında işlemci.", icon: "fa-microchip" }
            ],
            ram: [
                { id: "ram8", name: "8 GB RAM Bellek", price: 800, gb: 8, desc: "Günlük programlar için yeterli geçici hafıza.", icon: "fa-memory" },
                { id: "ram16", name: "16 GB Çift Kanal RAM", price: 1600, gb: 16, desc: "Aynı anda onlarca pencereyi kasmadan açan geniş RAM.", icon: "fa-memory" },
                { id: "ram32", name: "32 GB RGB RAM", price: 3000, gb: 32, desc: "Profesyonel çizim ve ağır oyunlar için dev bellek.", icon: "fa-memory" }
            ],
            storage: [
                { id: "hdd1", name: "1 TB Sabit Disk (HDD)", price: 800, type: "hdd", desc: "Geniş manyetik depolama, ancak SSD'ye göre yavaştır.", icon: "fa-hard-drive" },
                { id: "ssd500", name: "500 GB Hızlı M.2 SSD", price: 1400, type: "ssd", desc: "Saniyeler içinde açılan ultra hızlı katı hal depolama.", icon: "fa-bolt-lightning" },
                { id: "ssd1000", name: "1 TB Turbo NVMe SSD", price: 2400, type: "ssd", desc: "Devasa depolama ve ışık hızında dosya yükleme.", icon: "fa-bolt-lightning" }
            ],
            gpu: [
                { id: "gpu0", name: "İşlemci İçi Dahili Grafik", price: 0, hasGPU: false, desc: "Ek masrafsız temel görüntü sunumu (Ödev ve video için yeterli).", icon: "fa-tv" },
                { id: "gpu1", name: "Harici Ekran Kartı (4GB)", price: 3500, hasGPU: true, desc: "Görüntü ve temel oyun performansını artıran grafik birimi.", icon: "fa-vr-cardboard" },
                { id: "gpu2", name: "Yüksek Performans Ekran Kartı (8GB)", price: 7500, hasGPU: true, desc: "Tüm modern oyunları ve 3D tasarım programlarını akıcı açar.", icon: "fa-vr-cardboard" }
            ],
            psu: [
                { id: "psu400", name: "400W Standart Güç Kaynağı", price: 900, watt: 400, desc: "Temel sisteme elektrik sağlayan enerji kutusu.", icon: "fa-plug" },
                { id: "psu550", name: "550W Güç Kaynağı", price: 1500, watt: 550, desc: "Çoğu orta seviye sisteme stabil elektrik sağlar.", icon: "fa-plug" },
                { id: "psu750", name: "750W 80+ Gold Güç Kaynağı", price: 2500, watt: 750, desc: "Yüksek güç tüketen parçaları güvenle besler.", icon: "fa-plug" }
            ],
            peripherals: [
                { id: "peri1", name: "Standart Monitör, Klavye ve Fare", price: 2000, desc: "60Hz Monitör + temel tuş takımı ve optik fare.", icon: "fa-desktop" },
                { id: "peri2", name: "Geniş Monitör & Ergonomik Set", price: 3500, desc: "FHD IPS Monitör + sessiz klavye ve hassas fare.", icon: "fa-desktop" },
                { id: "peri3", name: "144Hz Oyuncu Monitörü & Mekanik Klavye", price: 6000, desc: "Pürüzsüz yüksek kare hızlı ekran ve RGB mekanik klavye.", icon: "fa-desktop" }
            ]
        };

        class PCBuilder {
            constructor() {
                this.missionIdx = 0;
                this.selected = {
                    anakart: null,
                    cpu: null,
                    ram: null,
                    storage: null,
                    gpu: null,
                    psu: null,
                    peripherals: null
                };
            }

            init() {
                this.render();
            }

            toggleSound() {
                sfx.enabled = !sfx.enabled;
                const icon = document.getElementById("sound-btn").querySelector("i");
                if (icon) icon.className = sfx.enabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark text-slate-500";
            }

            reset() {
                sfx.click();
                this.selected = { anakart: null, cpu: null, ram: null, storage: null, gpu: null, psu: null, peripherals: null };
                this.render();
            }

            calcTotal() {
                let sum = 0;
                Object.values(this.selected).forEach(p => {
                    if (p) sum += p.price;
                });
                return sum;
            }

            render() {
                const mission = MISSIONS[this.missionIdx];
                const total = this.calcTotal();
                const remaining = mission.budget - total;

                document.getElementById("budget-display").innerText = `${remaining.toLocaleString('tr-TR')} ₺`;
                document.getElementById("budget-display").className = remaining < 0 ? "text-rose-400 font-black text-sm" : "text-white text-sm";

                const container = document.getElementById("builder-main");
                container.innerHTML = `
                    <div class="glass-panel rounded-3xl p-5 sm:p-7 space-y-5 animate-pop shadow-2xl">
                        <!-- GÖREV BİLGİSİ -->
                        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-700 pb-3">
                            <div>
                                <span class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 font-black text-[10px] rounded-lg border border-emerald-500/30 uppercase">
                                    ${mission.badge}
                                </span>
                                <h3 class="text-base sm:text-lg font-black text-white mt-1">${mission.title}</h3>
                                <p class="text-xs text-slate-300 font-medium">${mission.target}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-400 block">Hedef Bütçe:</span>
                                <strong class="text-amber-400 text-sm sm:text-base font-black">${mission.budget.toLocaleString('tr-TR')} ₺</strong>
                            </div>
                        </div>

                        <!-- 2 KOLON: SOL KATALOG, SAĞ TOPLANAN KASA -->
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
                            <!-- SOL: Parça Seçim Listesi (Katalog) -->
                            <div class="md:col-span-7 space-y-3">
                                <span class="text-xs font-black text-emerald-400 uppercase tracking-wider block">
                                    <i class="fa-solid fa-boxes-stacked mr-1"></i> Donanım Parça Kataloğu:
                                </span>

                                <div class="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                                    ${this.renderCategory("anakart", "1. Anakart", CATALOG.anakart)}
                                    ${this.renderCategory("cpu", "2. İşlemci (CPU)", CATALOG.cpu)}
                                    ${this.renderCategory("ram", "3. RAM Bellek", CATALOG.ram)}
                                    ${this.renderCategory("storage", "4. Depolama (SSD/HDD)", CATALOG.storage)}
                                    ${this.renderCategory("gpu", "5. Ekran Kartı (GPU)", CATALOG.gpu)}
                                    ${this.renderCategory("psu", "6. Güç Kaynağı (PSU)", CATALOG.psu)}
                                    ${this.renderCategory("peripherals", "7. Monitör, Klavye & Fare", CATALOG.peripherals)}
                                </div>
                            </div>

                            <!-- SAĞ: Toplanan Bilgisayar & Kontrol -->
                            <div class="md:col-span-5 p-4 rounded-2xl bg-slate-900/90 border-2 border-emerald-500/30 space-y-4">
                                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                    <span class="text-xs font-black text-white flex items-center gap-1.5">
                                        <i class="fa-solid fa-server text-emerald-400"></i>
                                        <span>Toplanan Sistem</span>
                                    </span>
                                    <span class="text-xs font-bold ${remaining < 0 ? 'text-rose-400' : 'text-emerald-400'}">
                                        Toplam: ${total.toLocaleString('tr-TR')} ₺
                                    </span>
                                </div>

                                <!-- Yuva Durumları -->
                                <div class="space-y-1.5 text-xs">
                                    ${this.renderSlotRow("Anakart", this.selected.anakart)}
                                    ${this.renderSlotRow("İşlemci", this.selected.cpu)}
                                    ${this.renderSlotRow("RAM Bellek", this.selected.ram)}
                                    ${this.renderSlotRow("Depolama", this.selected.storage)}
                                    ${this.renderSlotRow("Ekran Kartı", this.selected.gpu)}
                                    ${this.renderSlotRow("Güç Kaynağı", this.selected.psu)}
                                    ${this.renderSlotRow("Çevre Birimleri", this.selected.peripherals)}
                                </div>

                                <!-- SİSTEMİ AÇ & TEST ET BUTONU -->
                                <button onclick="builder.testBuild()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all hover:scale-[1.02] active:scale-95">
                                    <i class="fa-solid fa-power-off text-base"></i>
                                    <span>Güç Düğmesine Bas & Sistemi Test Et</span>
                                </button>

                                <div id="test-result-box" class="hidden"></div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderCategory(categoryKey, title, items) {
                const cur = this.selected[categoryKey];
                return `
                    <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-700/80 space-y-2">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-black text-white">${title}</span>
                            <span class="text-[10px] text-slate-400">${cur ? 'Seçildi: ' + cur.name : 'Henüz Seçilmedi'}</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                            ${items.map(it => {
                                const isSelected = cur && cur.id === it.id;
                                return `
                                    <button onclick="builder.selectPart('${categoryKey}', '${it.id}')" class="p-2.5 rounded-lg border text-left space-y-1 transition-all ${isSelected ? 'border-emerald-400 bg-emerald-950/60 shadow-md ring-1 ring-emerald-400' : 'border-slate-700 bg-slate-800/70 hover:border-slate-500'}">
                                        <div class="flex items-center justify-between text-xs font-bold text-white">
                                            <span class="truncate">${it.name}</span>
                                            <span class="text-amber-300 font-mono text-[11px] shrink-0 ml-1">${it.price.toLocaleString('tr-TR')} ₺</span>
                                        </div>
                                        <p class="text-[10px] text-slate-300 line-clamp-2 leading-tight">${it.desc}</p>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            renderSlotRow(slotName, part) {
                return `
                    <div class="p-2 rounded-lg bg-slate-800/80 border border-slate-700/60 flex items-center justify-between">
                        <span class="text-slate-400 text-[11px]">${slotName}:</span>
                        <strong class="text-xs truncate max-w-[170px] ${part ? 'text-white' : 'text-amber-400/70 italic'}">
                            ${part ? part.name : 'Eksik Parça!'}
                        </strong>
                    </div>
                `;
            }

            selectPart(cat, id) {
                sfx.equip();
                const item = CATALOG[cat].find(x => x.id === id);
                if (item) this.selected[cat] = item;
                this.render();
            }

            testBuild() {
                const mission = MISSIONS[this.missionIdx];
                const total = this.calcTotal();
                const remaining = mission.budget - total;
                const resultBox = document.getElementById("test-result-box");
                resultBox.classList.remove("hidden");

                // Eksik parça kontrolü
                const missing = [];
                if (!this.selected.anakart) missing.push("Anakart");
                if (!this.selected.cpu) missing.push("İşlemci");
                if (!this.selected.ram) missing.push("RAM Bellek");
                if (!this.selected.storage) missing.push("Depolama");
                if (!this.selected.gpu) missing.push("Ekran Kartı");
                if (!this.selected.psu) missing.push("Güç Kaynağı");
                if (!this.selected.peripherals) missing.push("Çevre Birimleri (Monitör/Klavye/Fare)");

                if (missing.length > 0) {
                    sfx.wrong();
                    resultBox.innerHTML = `
                        <div class="p-3 bg-rose-950/90 border border-rose-500 rounded-xl text-xs text-rose-200 space-y-1 animate-pop">
                            <strong class="text-rose-300 block font-black">⚠️ EKSİK PARÇALAR VAR!</strong>
                            <p>Bilgisayarın açılabilmesi için şu parçaları da seçmelisin: <strong>${missing.join(', ')}</strong></p>
                        </div>
                    `;
                    return;
                }

                // Bütçe aşımı kontrolü
                if (remaining < 0) {
                    sfx.wrong();
                    resultBox.innerHTML = `
                        <div class="p-3 bg-rose-950/90 border border-rose-500 rounded-xl text-xs text-rose-200 space-y-1 animate-pop">
                            <strong class="text-rose-300 block font-black">⚠️ BÜTÇEYİ AŞTIN!</strong>
                            <p>Müşterinin bütçesi ${mission.budget.toLocaleString('tr-TR')} ₺ idi, sen ${Math.abs(remaining).toLocaleString('tr-TR')} ₺ fazla harcadın. Bazı parçaları daha uygun fiyatlı modellerle değiştir!</p>
                        </div>
                    `;
                    return;
                }

                // Görev gereksinim kontrolü
                if (mission.minReq.ram && this.selected.ram.gb < mission.minReq.ram) {
                    sfx.wrong();
                    resultBox.innerHTML = `
                        <div class="p-3 bg-amber-950/90 border border-amber-500 rounded-xl text-xs text-amber-200 space-y-1 animate-pop">
                            <strong class="text-amber-300 block font-black">⚠️ RAM YETERSİZ!</strong>
                            <p>Bu görev için en az ${mission.minReq.ram} GB RAM gerekiyor. 8 GB RAM çoklu görevlerde sistemi yavaşlatabilir.</p>
                        </div>
                    `;
                    return;
                }

                if (mission.minReq.hasGPU && !this.selected.gpu.hasGPU) {
                    sfx.wrong();
                    resultBox.innerHTML = `
                        <div class="p-3 bg-amber-950/90 border border-amber-500 rounded-xl text-xs text-amber-200 space-y-1 animate-pop">
                            <strong class="text-amber-300 block font-black">⚠️ HARİCİ EKRAN KARTI GEREKİYOR!</strong>
                            <p>Oyun ve grafik tasarım görevi için harici bir ekran kartı şarttır; dahili grafik pikselleri akıcı işleyemez!</p>
                        </div>
                    `;
                    return;
                }

                // Başarılı sistem!
                sfx.win();
                if (typeof confetti === "function") confetti({ particleCount: 90, spread: 60 });
                resultBox.innerHTML = `
                    <div class="p-4 bg-emerald-950/90 border-2 border-emerald-500 rounded-2xl text-xs text-emerald-200 space-y-2 animate-pop">
                        <div class="flex items-center gap-2 font-black text-emerald-300 text-sm">
                            <i class="fa-solid fa-circle-check text-xl"></i>
                            <span>BİLGİSAYAR SORUNSUZ ÇALIŞTI! 🎉</span>
                        </div>
                        <p class="leading-relaxed">
                            Bütçeyi aşmadın (${remaining.toLocaleString('tr-TR')} ₺ tasarruf ettin) ve ihtiyaca tam uygun parçaları seçtin.
                        </p>
                        <div class="pt-1 flex justify-end">
                            ${this.missionIdx < MISSIONS.length - 1 ? `
                                <button onclick="builder.nextMission()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs flex items-center gap-1.5">
                                    <span>Sonraki Göreve Geç</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            ` : `
                                <button onclick="builder.finishAll()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs flex items-center gap-1.5">
                                    <span>Atölyeyi Başarıyla Tamamla 🏆</span>
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }

            nextMission() {
                sfx.click();
                this.missionIdx++;
                this.selected = { anakart: null, cpu: null, ram: null, storage: null, gpu: null, psu: null, peripherals: null };
                this.render();
            }

            finishAll() {
                sfx.win();
                const container = document.getElementById("builder-main");
                container.innerHTML = `
                    <div class="glass-panel rounded-3xl p-8 max-w-xl mx-auto text-center space-y-5 animate-pop">
                        <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-emerald-400 to-teal-500 text-slate-950 flex items-center justify-center text-4xl mx-auto shadow-2xl">
                            <i class="fa-solid fa-certificate"></i>
                        </div>
                        <h2 class="text-2xl font-black text-white">USTA BİLGİSAYAR TEKNİSYENİ!</h2>
                        <p class="text-xs sm:text-sm text-slate-300">
                            Ev ödevlerinden yüksek performanslı oyun canavarına kadar tüm sistemleri bütçeyi koruyarak başarıyla kurdun.
                        </p>
                        <div class="p-3.5 bg-slate-900 rounded-xl border border-slate-700 text-xs text-emerald-300 font-bold">
                            Tüm 3 Görev Tamamlandı • Mükemmel Donanım Mimarisi 🛠️
                        </div>
                        <div class="pt-2 flex justify-center">
                            <button onclick="builder.missionIdx = 0; builder.reset()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs shadow-lg">
                                Atölyeyi Yeniden Başlat
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        const builder = new PCBuilder();
        window.addEventListener("DOMContentLoaded", () => builder.init());
    </script>
</body>
</html>
