<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2. Klasör Düzenleme Yarışı | Bozok Bilişim Portalı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --panel-border: rgba(255, 255, 255, 0.12);
            --blue: #0284c7;
            --cyan: #06b6d4;
            --green: #10b981;
            --yellow: #f59e0b;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #090d16 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 12px;
        }

        #game-frame {
            width: 100%;
            max-width: 1200px;
            min-height: 90vh;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 35px rgba(139, 92, 246, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 14px 24px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title p {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        .btn-ctrl:active {
            transform: scale(0.96);
        }

        .stat-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        main {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .card-box {
            width: 100%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .btn-opt {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-opt:hover {
            background: rgba(79, 70, 229, 0.3);
            border-color: #818cf8;
            transform: translateY(-2px);
        }

        .btn-opt:active {
            transform: scale(0.98);
        }

        .btn-opt.correct {
            background: rgba(16, 185, 129, 0.3) !important;
            border-color: var(--green) !important;
            color: #34d399 !important;
        }

        .btn-opt.wrong {
            background: rgba(239, 68, 68, 0.3) !important;
            border-color: var(--red) !important;
            color: #f87171 !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border: none;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.45);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .feedback-box {
            margin-top: 18px;
            padding: 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 800;
            line-height: 1.5;
            display: none;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            #game-frame { min-height: 98vh; border-radius: 16px; }
            header { padding: 10px 14px; }
            main { padding: 14px; }
            .card-box { padding: 18px; }
        }

        
    </style>
</head>
<body>
    <div id="game-frame">
        <header>
            <div class="header-left">
                <div class="header-icon">📁</div>
                <div class="header-title">
                    <h1>2. Klasör Düzenleme Yarışı</h1>
                    <p>BTY.5.1.6 • 6. Konu: Dosya ve Klasör Yönetimi</p>
                </div>
            </div>
            <div class="header-controls">
                <span id="stat-score" class="stat-badge" style="color:var(--yellow);"><i class="fa-solid fa-star"></i> <span id="score-val">0</span></span>
                <button class="btn-ctrl" onclick="sfx.toggleMute()" id="btn-sound"><i class="fa-solid fa-volume-high"></i></button>
                <button class="btn-ctrl" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
                <button class="btn-ctrl" onclick="restartGame()"><i class="fa-solid fa-rotate-left"></i> Yeniden</button>
            </div>
        </header>

        <main>
            
<div class="card-box" id="klasor-box">
    <div style="text-align:center; margin-bottom:16px;">
        <span style="color:var(--yellow); font-size:0.85rem; font-weight:800; text-transform:uppercase;">DÜZENLENECEK DOSYA:</span>
        <div id="target-file" style="font-size:1.8rem; font-weight:900; color:#38bdf8; font-family:monospace; margin-top:6px; background:#0f172a; padding:14px; border-radius:18px; border:2px dashed #0284c7; display:inline-block;">
            bilişim_ödevi.docx
        </div>
        <p style="font-size:0.9rem; color:#94a3b8; margin-top:8px;">Bu dosyayı yerleştirmek istediğin doğru hedef klasöre dokun!</p>
    </div>

    <!-- 5 Büyük Klasör -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; margin-top:20px;">
        <button class="btn-opt" style="flex-direction:column; text-align:center; padding:20px 10px;" onclick="dropFile('odev')">
            <span style="font-size:2.6rem;">📁</span>
            <span style="font-size:1.05rem; font-weight:900; color:#fff;">Ödevler</span>
            <span style="font-size:0.75rem; color:#94a3b8;">.docx, .txt, .pdf</span>
        </button>
        <button class="btn-opt" style="flex-direction:column; text-align:center; padding:20px 10px;" onclick="dropFile('resim')">
            <span style="font-size:2.6rem;">📁</span>
            <span style="font-size:1.05rem; font-weight:900; color:#fff;">Resimler</span>
            <span style="font-size:0.75rem; color:#94a3b8;">.jpg, .png, .gif</span>
        </button>
        <button class="btn-opt" style="flex-direction:column; text-align:center; padding:20px 10px;" onclick="dropFile('muzik')">
            <span style="font-size:2.6rem;">📁</span>
            <span style="font-size:1.05rem; font-weight:900; color:#fff;">Müzikler</span>
            <span style="font-size:0.75rem; color:#94a3b8;">.mp3, .wav</span>
        </button>
        <button class="btn-opt" style="flex-direction:column; text-align:center; padding:20px 10px;" onclick="dropFile('video')">
            <span style="font-size:2.6rem;">📁</span>
            <span style="font-size:1.05rem; font-weight:900; color:#fff;">Videolar</span>
            <span style="font-size:0.75rem; color:#94a3b8;">.mp4, .avi, .mov</span>
        </button>
        <button class="btn-opt" style="flex-direction:column; text-align:center; padding:20px 10px;" onclick="dropFile('kitap')">
            <span style="font-size:2.6rem;">📁</span>
            <span style="font-size:1.05rem; font-weight:900; color:#fff;">Kitaplar</span>
            <span style="font-size:0.75rem; color:#94a3b8;">.pdf, .epub</span>
        </button>
    </div>

    <div id="klasor-fb" class="feedback-box"></div>
</div>

        </main>
    </div>

    <script>
        // Web Audio API Sound Effects
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx && !this.muted) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            tone(freq, type='sine', dur=0.1, gainVal=0.1) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    g.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + dur);
                } catch(e) {}
            }
            click() { this.tone(550, 'triangle', 0.05, 0.08); }
            correct() { this.tone(523, 'sine', 0.08, 0.1); setTimeout(() => this.tone(659, 'sine', 0.12, 0.1), 80); }
            wrong() { this.tone(200, 'sawtooth', 0.15, 0.12); }
            fanfare() {
                [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 'sine', 0.15, 0.12), i * 100));
            }
            toggleMute() {
                this.muted = !this.muted;
                const b = document.getElementById('btn-sound');
                if (b) b.innerHTML = this.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            }
        }
        const sfx = new SoundFX();

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        
const files = [
    { name: "fen_bilgisi_projesi.docx", type: "odev" },
    { name: "aile_tatil_fotografi.jpg", type: "resim" },
    { name: "gitar_melodisi.mp3", type: "muzik" },
    { name: "okul_gezi_videosu.mp4", type: "video" },
    { name: "dunya_klasikleri_roman.pdf", type: "kitap" },
    { name: "matematik_formulleri.txt", type: "odev" },
    { name: "doga_manzarasi.png", type: "resim" },
    { name: "ingilizce_konusma_kaydi.wav", type: "muzik" },
    { name: "tarih_belgeseli.avi", type: "video" },
    { name: "cocuk_masallari.epub", type: "kitap" },
    { name: "turkce_kompozisyon.docx", type: "odev" },
    { name: "komik_kedi_animasyonu.gif", type: "resim" }
];

let curFileIdx = 0;
let score = 0;

function initGame() {
    curFileIdx = 0;
    score = 0;
    files.sort(() => Math.random() - 0.5);
    updateScore();
    loadFile();
}

function updateScore() {
    document.getElementById('score-val').innerText = score + " Puan";
}

function loadFile() {
    if (curFileIdx >= files.length) {
        showResults();
        return;
    }
    const f = files[curFileIdx];
    document.getElementById('target-file').innerText = f.name;
    const fb = document.getElementById('klasor-fb');
    fb.style.display = 'none';
}

function dropFile(chosenFolder) {
    if (curFileIdx >= files.length) return;
    const current = files[curFileIdx];
    const fb = document.getElementById('klasor-fb');
    fb.style.display = 'block';

    if (current.type === chosenFolder) {
        sfx.correct();
        score += 10;
        updateScore();
        fb.style.background = 'rgba(16, 185, 129, 0.2)';
        fb.style.border = '2px solid var(--green)';
        fb.style.color = '#34d399';
        fb.innerHTML = '🎉 <strong>DOĞRU KLASÖR!</strong> Dosya ait olduğu klasöre yerleştirildi! (+10 Puan)';
        curFileIdx++;
        setTimeout(loadFile, 600);
    } else {
        sfx.wrong();
        fb.style.background = 'rgba(239, 68, 68, 0.2)';
        fb.style.border = '2px solid var(--red)';
        fb.style.color = '#f87171';
        fb.innerHTML = '⚠️ <strong>YANLIŞ KLASÖR!</strong> Dosyanın uzantısını incele ve uygun türdeki klasörü seç!';
    }
}

function showResults() {
    sfx.fanfare();
    const box = document.getElementById('klasor-box');
    box.innerHTML = '<div style="padding:24px; text-align:center;">' +
        '<div style="font-size:4rem; margin-bottom:12px;">📁 ✨</div>' +
        '<h2 style="font-size:2rem; font-weight:900; color:#fff; margin-bottom:8px;">Tüm Dosyalar Düzenlendi!</h2>' +
        '<p style="font-size:1.4rem; font-weight:900; color:var(--yellow); margin-bottom:12px;">Toplam Puan: ' + score + ' / ' + (files.length * 10) + '</p>' +
        '<p style="font-size:0.95rem; color:#cbd5e1; max-width:500px; margin:0 auto 24px;">Klasörleme hiyerarşisini harika kavradınız; bilgisayarınız artık tertemiz ve düzenli!</p>' +
        '<button class="btn-primary" onclick="location.reload()"><i class="fa-solid fa-rotate-left"></i> Yeniden Düzenle</button>' +
    '</div>';
}

function restartGame() {
    initGame();
}

window.onload = initGame;

    </script>
</body>
</html>
