<!DOCTYPE html>
<html lang="tr">
<head>

        :root {
            --bg-dark: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.88);
            --panel-border: rgba(255, 255, 255, 0.14);
            --primary: #d97706;
            --accent: #ea580c;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
        }

        * {

            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 16px;
        }

        #game-frame {
            width: 100%;
            max-width: 1200px;
            min-height: 90vh;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 28px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), 0 0 35px rgba(99, 102, 241, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 16px 28px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .header-title h1 {
            font-size: 1.35rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f1f5f9;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-ctrl:active {
            transform: scale(0.96);
        }

        .stat-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        main {
            flex: 1;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .card-box {
            width: 100%;
            max-width: 960px;
            background: rgba(15, 23, 42, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 32px sm:40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: popIn 0.35s ease;

        .category-pill {

            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.4);

            font-weight: 800;

            border-color: #818cf8;
            transform: translateY(-2px);

        .btn-opt:active {

        .opt-letter {

            height: 36px;

        .btn-opt.correct {

        .btn-opt.wrong {

            font-size: 1.05rem;

</head>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, type, dur, gainVal = 0.2) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + dur);
                } catch(e) {}
            }
            playClick() { this.playTone(600, 'sine', 0.08, 0.15); }
            playCorrect() {
                this.playTone(523.25, 'triangle', 0.12, 0.25);
                setTimeout(() => this.playTone(659.25, 'triangle', 0.15, 0.25), 100);
                setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.3), 220);
            }
            playWrong() {
                this.playTone(260, 'sawtooth', 0.15, 0.25);
                setTimeout(() => this.playTone(200, 'sawtooth', 0.25, 0.25), 130);
            }
            playFanfare() {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.3, 0.3), i * 140);
                });
            }
            toggleMute() {
                this.muted = !this.muted;
                const btn = document.getElementById("btn-sound");
                if (btn) {
                    btn.innerHTML = this.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
                }
            }
        }

                category: "Görsel Hiyerarşi",
                text: "Afişte en önemli ana başlığın en büyük, alt bilgilerin orta boy, detayların ise daha küçük yazılması kuralına ne ad verilir?",
                visual: `<div class="text-center space-y-1"><div class="text-base font-black text-white">ANA BAŞLIK</div><div class="text-xs font-bold text-amber-400">Alt Başlık Bilgisi</div><div class="text-[9px] text-slate-400">Tarih, Yer ve Saat Detayları</div></div><div class="text-[10px] text-slate-400 mt-2">Büyüklükten küçüğe sıralama</div>`,
                hint: "Gözün afişi hangi sırayla okuyacağını belirleyen düzen.",
                options: [
                    "Ses Ayarı",
                    "Görsel Hiyerarşi ve Düzen",
                    "Donanım Sürücüsü",
                    "Yazıcı Kuyruğu"
                ],
                correctAnswer: 1, // B
                explanation: "Görsel Hiyerarşi; önemli bilgileri büyüklük, renk veya konumla vurgulayarak okuyucunun gözünü yönlendirme sanatıdır."
            },
            {
                category: "Son Kontrol & Paylaşım",
                text: "Afiş veya broşür tasarımını tamamlayıp matbaaya veya sosyal medyaya göndermeden önceki EN SON KRİTİK ADIM nedir?",
                visual: `<div class="text-4xl text-teal-400 mb-1"><i class="fa-solid fa-clipboard-check"></i></div><div class="text-xs font-bold text-teal-300">Son İnceleme</div><div class="text-[10px] text-slate-400">Hataları yakalama aşaması</div>`,
                hint: "Yazım hatalarını incelemek ve başkalarından geri bildirim almak.",
                options: [
                    "Tüm dosyaları hemen silip bilgisayarı kapatmak",
                    "Yazıların hepsini silmek",
                    "Afişin renklerini siyaha boyamak",
                    "Yazım ve bilgi hatalarını kontrol etmek, geri bildirim alıp son rötuşları yapmak"
                ],
                correctAnswer: 3, // D
                explanation: "Son aşamada (Kontrol Et ve Paylaş); yazım hataları, tarih/saat bilgileri ve tasarım uyumu dikkatle kontrol edilir."
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = (typeof questions !== 'undefined' ? questions : QUESTIONS)[currentIndex];
            if (!q) {
                showResults();
                return;
            }

            document.getElementById("q-counter").innerText = (currentIndex + 1) + " / " + (typeof questions !== 'undefined' ? questions : QUESTIONS).length;
            document.getElementById("score-val").innerText = score;
            document.getElementById("q-category").innerText = q.category || "USTA TASARIMCI";
            document.getElementById("q-text").innerText = q.text || q.q || q.question;

            const visualBox = document.getElementById("q-visual");
            if (q.visual) {
                visualBox.innerHTML = q.visual;
                visualBox.style.display = "flex";
            } else {
                visualBox.style.display = "none";
            }

            const optionsGrid = document.getElementById("options-grid");
            const letters = ["A", "B", "C", "D"];
            optionsGrid.innerHTML = q.options.map((opt, i) => `
                <button class="btn-opt" onclick="checkAnswer(${i})" id="opt-${i}">
                    <span class="opt-letter">${letters[i]}</span>
                    <span>${opt}</span>
                </button>
            `).join('');

            const fb = document.getElementById("feedback-area");
            fb.style.display = "none";
            fb.className = "feedback-box";
            document.getElementById("next-btn").style.display = "none";
        }

        function checkAnswer(chosenIdx) {
            if (answered) return;
            answered = true;
            sfx.init();

            const q = (typeof questions !== 'undefined' ? questions : QUESTIONS)[currentIndex];
            const correctIdx = (q.correctAnswer !== undefined) ? q.correctAnswer : ((q.answer !== undefined) ? q.answer : q.correct);
            const isRight = (chosenIdx === correctIdx);

            const chosenBtn = document.getElementById("opt-" + chosenIdx);
            const correctBtn = document.getElementById("opt-" + correctIdx);
            const fb = document.getElementById("feedback-area");

            // Disable all options
            for (let i = 0; i < q.options.length; i++) {
                const b = document.getElementById("opt-" + i);
                if (b) b.disabled = true;
            }

            if (isRight) {
                score += 10;
                document.getElementById("score-val").innerText = score;
                sfx.playCorrect();
                if (chosenBtn) chosenBtn.classList.add("correct");
                fb.className = "feedback-box feedback-correct";
                fb.innerHTML = `<i class="fa-solid fa-circle-check text-xl mr-2"></i> <strong>Harika! Doğru Cevap!</strong><br><span style="font-size:0.95rem; font-weight:600; opacity:0.95;">${q.explanation || ''}</span>`;
            } else {
                sfx.playWrong();
                if (chosenBtn) chosenBtn.classList.add("wrong");
                if (correctBtn) correctBtn.classList.add("correct");
                fb.className = "feedback-box feedback-wrong";
                fb.innerHTML = `<i class="fa-solid fa-circle-xmark text-xl mr-2"></i> <strong>Yanlış! Doğru Şık: ${["A","B","C","D"][correctIdx]}</strong><br><span style="font-size:0.95rem; font-weight:600; opacity:0.95;">${q.explanation || ''}</span>`;
            }

            fb.style.display = "block";
            document.getElementById("next-btn").style.display = "inline-flex";
        }

        function nextQuestion() {
            sfx.playClick();
            currentIndex++;
            const total = (typeof questions !== 'undefined' ? questions : QUESTIONS).length;
            if (currentIndex < total) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            sfx.playFanfare();
            try {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            } catch(e) {}

            const total = (typeof questions !== 'undefined' ? questions : QUESTIONS).length;
            const maxScore = total * 10;
            const main = document.getElementById("main-area");
            main.innerHTML = `
                <div class="card-box" style="animation: popIn 0.5s ease;">
                    <div style="font-size: 4.5rem; margin-bottom: 12px;">🏆</div>
                    <span class="category-pill">GÖREV TAMAMLANDI</span>
                    <h2 style="font-size: 2.2rem; font-weight: 900; color: #fff; margin-bottom: 10px;">
                        Tebrikler Şampiyon!
                    </h2>
                    <p style="color: #94a3b8; font-size: 1.1rem; margin-bottom: 24px;">
                        4. Tasarım Ustaları görevini başarıyla tamamladın!
                    </p>

                    <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 28px; flex-wrap: wrap;">
                        <div class="stat-badge" style="font-size: 1.25rem; padding: 16px 28px; color: var(--yellow);">
                            <i class="fa-solid fa-star"></i> Toplam Skor: ${score} / ${maxScore}
                        </div>
                    </div>

                    <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
                        <button onclick="restartGame()" class="btn-primary">
                            <i class="fa-solid fa-rotate-left"></i> Yeniden Oyna
                        </button>
                    </div>
                </div>
            `;
        }

        function restartGame() {
            sfx.playClick();
            currentIndex = 0;
            score = 0;
            document.getElementById("main-area").innerHTML = `
                <div class="card-box" id="quiz-box">
                    <div id="q-category" class="category-pill">Görsel Düzenleme</div>
                    <div id="q-visual" class="visual-box"></div>
                    <h2 id="q-text" class="question-text">Soru metni yükleniyor...</h2>
                    <div id="options-grid" class="options-grid"></div>
                    <div id="feedback-area" class="feedback-box"></div>
                    <div style="margin-top: 24px; display: flex; justify-content: center;">
                        <button id="next-btn" class="btn-primary" style="display: none;" onclick="nextQuestion()">
                            Sonraki Soru 👉
                        </button>
                    </div>
                </div>
            `;
            loadQuestion();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        window.onload = () => {
            loadQuestion();
        };
    </script>
</body>
</html>
