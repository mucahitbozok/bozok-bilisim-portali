                      <li>• <strong>Detay Zenginliği:</strong> Doğa manzaraları ve insan yüzü gibi karmaşık detayları aktarır.</li>\n                        </ul>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-3\">\n                        <div class=\"flex items-center gap-3 text-rose-400 text-lg font-black\">\n                            <i class=\"fa-solid fa-triangle-exclamation\"></i>\n                            <h4>Zayıf Yönleri (Nelere Dikkat Edilmeli?)</h4>\n                        </div>\n                        <ul class=\"space-y-2 text-xs sm:text-sm text-slate-200\">\n                            <li>• <strong>Büyütmede Kalite Kaybı:</strong> Çok büyütüldüğünde piksellenir ve bulanıklaşır.</li>\n                            <li>• <strong>Sabit Çözünürlük:</strong> Piksel sayısı çekildiği anda sabitlenir, sonradan eklenemez.</li>\n                            <li>• <strong>Büyük Dosya Boyutu:</strong> Yüksek çözünürlükte depolama alanını hızlı doldurur.</li>\n                        </ul>\n                    </div>\n                </div>\n\n                <div class=\"p-4 rounded-xl bg-purple-900/40 border border-purple-500/30 flex items-center justify-between gap-4 flex-wrap text-xs sm:text-sm text-purple-200\">\n                    <span>💡 En Yaygın Bitmap Formatları: <strong>.JPG, .JPEG, .PNG, .GIF, .BMP</strong></span>\n                    <span class=\"text-yellow-300 font-bold\">Fotoğraflar = Daima Bitmap</span>\n                </div>\n            </div>\n        "},{"id":5,"title":"Vektörel (Çizgisel) Görüntüler ve Matematiksel Gücü 📐","subtitle":"Formüllerle Çizilen Kusursuz Grafikler","topic":"2. TEMA • BTY.5.2.1","badge":"VEKTÖR","icon":"fa-solid fa-bezier-curve","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-6 my-auto\">\n    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-pink-400/40 space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-pink-400/20 text-pink-300 flex items-center justify-center text-2xl font-black\">\n                            <i class=\"fa-solid fa-award\"></i>\n                        </div>\n                        <h4 class=\"text-lg font-black text-white\">Logo ve İkon Tasarımı</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Şirket logoları, trafik levhaları, tipografi ve web ikonları daima vektörel olarak tasarlanır ve kullanılır.\n                        </p>\n                    </div>\n                </div>\n\n                <div class=\"p-4 rounded-xl bg-cyan-950/40 border border-cyan-500/30 flex items-center justify-between gap-4 flex-wrap text-xs sm:text-sm text-cyan-200\">\n                    <span>💡 En Yaygın Vektör Formatları: <strong>.SVG, .EPS, .AI</strong></span>\n                    <span class=\"text-yellow-300 font-bold\">Logolar & İkonlar = Daima Vektörel</span>\n                </div>\n            </div>\n        "},{"id":6,"title":"Büyük Karşılaştırma: Bitmap vs Vektörel ⚖️","subtitle":"Hangi Türü Ne Zaman Seçmeliyiz?","topic":"2. TEMA • BTY.5.2.1","badge":"KARŞILAŞTIRMA","icon":"fa-solid fa-scale-balanced","bgColor":"from-slate-900 via-indigo-950 to-purple-950","gradient":"from-slate-900 via-indigo-950 to-purple-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-4 my-auto\">\n                <div class=\"overflow-x-auto rounded-2xl border-2 border-indigo-500/40 shadow-2xl bg-slate-950/90\">\n                    <table class=\"w-full text-left text-xs sm:text-sm\">\n                        <thead class=\"bg-indigo-900/60 text-yellow-300 font-black uppercase tracking-wider border-b border-indigo-700/60\">\n                            <tr>\n                                <th class=\"p-3.5 sm:p-4\">Özellik</th>\n mono text-xs text-yellow-300\">.JPG, .PNG, .GIF, .BMP</td>\n                                <td class=\"p-3.5 sm:p-4 font-mono text-xs text-yellow-300\">.SVG, .EPS, .AI</td>\n                            </tr>\n                            <tr class=\"hover:bg-slate-850/60\">\n                                <td class=\"p-3.5 sm:p-4 font-bold text-white\">Popüler Programlar</td>\n                                <td class=\"p-3.5 sm:p-4\">Paint, Photoshop, GIMP, Canva</td>\n                                <td class=\"p-3.5 sm:p-4\">Adobe Illustrator, Inkscape, CorelDRAW</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n\n                <div class=\"p-3 rounded-xl bg-indigo-950/60 border border-indigo-400/30 text-center text-xs text-indigo-200\">\n                    📌 <strong>Özet Kural:</strong> Gerçek hayattan bir anı çekiyorsan <strong>Bitmap</strong>; sıfırdan logo ve simge çiziyorsan <strong>Vektör</strong>!\n                </div>\n            </div>\n        "},{"id":7,"title":"Sınıf İçi Dedektif Görevi: Hangisini Seçmelisin? 🕵️‍♂️","subtitle":"Akıllı Tahtada Cevabı Dokunarak Bul","topic":"2. TEMA • BTY.5.2.1","badge":"ETKİLEŞİM","icon":"fa-solid fa-circle-question","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-6 my-auto text-center\">\n                <div class=\"p-6 rounded-3xl bg-slate-800/90 border-2 border-yellow-400/50 shadow-2xl space-y-4\">\n                    <span class=\"px-4 py-1.5 bg-yellow-400/20 text-yellow-300 font-black text-xs uppercase tracking-widest rounded-full border border-yellow-400/30\">\n                        Dedektif Sorusu\n                    </span>\n                    <h3 class=\"text-xl sm:text-2xl font-black text-white leading-relaxed\">\n                        “Okulunuz için tasarladığınız yeni logonun hem küçücük bir öğrenci yaka rozetine hem de okul binasının devasa ön cephe afişine basılması gerekiyor. Hangi görüntü türünü tercih etmelisiniz?”\n                    </h3>\n                </div>\n\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <button onclick=\"app.handleSlideChoice(this, false, 'slide7-feedback', 'Bitmap görüntü dev bina afişine basıldığında aşırı büyütüleceği için piksellenir ve bozulur!')\" class=\"p-5 rounded-2xl bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-rose-400 text-left transition-all group shadow-lg\">\n                        <div class=\"flex items-center gap-3\">\n                            <span class=\"w-10 h-10 rounded-xl bg-rose-500/20 text-rose-300 flex items-center justify-center font-black text-lg\">A</span>\n                            <div>\n                                <h4 class=\"font-bold text-white text-base\">Bitmap (Piksel Tabanlı)</h4>\n                                <p class=\"text-xs text-slate-400\">Çünkü pikseller her boyutta aynıdır.</p>\n                            </div>\n                        </div>\n                    </button>\n\n                    <button onclick=\"app.handleSlideChoice(this, true, 'slide7-feedback', 'Harika seçim! Vektörel grafikler matematiksel olduğu için ister rozet ister bina boyunda olsun sıfır kalite kaybıyla net kalır!')\" class=\"p-5 rounded-2xl bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-emerald-400 text-left transition-all group shadow-lg\">\n                        <div class=\"flex items-center gap-3\">\n                            <span class=\"w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-300 flex items-center justify-center font-black text-lg\">B</span>\n                            <div>\n                                <h4 class=\"font-bold text-white text-base\">Vektörel (Çizgisel)</h4>\n                                <p class=\"text-xs text-slate-400\">Çünkü ne kadar büyütülürse büyütülsün kalitesi bozulmaz.</p>\n                            </div>\n                        </div>\n                    </button>\n                </div>\n\n                <div id=\"slide7-feedback\" class=\"hidden p-4 rounded-2xl bg-slate-800 border-2 text-sm font-bold text-white transition-all shadow-xl\"></div>\n            </div>\n        "},{"id":8,"title":"Bölüm 2: Görüntü Dosyası Nedir? Dosya Adı ve Uzantısı 📄","subtitle":"Noktanın Sağındaki Sihirli Dünya","topic":"2. TEMA • BTY.5.2.1","badge":"BÖLÜM 2","icon":"fa-solid fa-file-code","bgColor":"from-slate-900 via-indigo-950 to-purple-950","gradient":"from-slate-900 via-indigo-950 to-purple-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-6 my-auto\">\n                <div class=\"p-6 rounded-3xl bg-slate-950/80 border-2 border-indigo-400/50 shadow-2xl text-center space-y-4\">\n                    <span class=\"text-xs font-black uppercase tracking-widest text-indigo-300\">Bir Dijital Dosyanın Anatomisi</span>\n                    \n                    <div class=\"inline-flex items-center gap-3 p-4 bg-slate-900 rounded-2xl border border-slate-700 font-mono text-2xl sm:text-3xl font-black\">\n                        <span class=\"text-cyan-400\">okul_etkinligi</span>\n                        <span class=\"text-yellow-400 text-4xl\">.</span>\n                        <span class=\"text-pink-400\">png</span>\n                    </div>\n\n                    <div class=\"grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 text-left\">\n                        <div class=\"p-3.5 bg-slate-900/80 rounded-xl border border-cyan-500/30\">\n                            <span class=\"text-xs font-bold text-cyan-400 block mb-1\">1. Dosya Adı:</span>\n                            <p class=\"text-xs text-slate-300\">Dosyanın içeriğini anlatan anlamlı isimdir. (Kullanıcı belirler)</p>\n                        </div>\n                        <div class=\"p-3.5 bg-slate-900/80 rounded-xl border border-yellow-500/30\">\n                            <span class=\"text-xs font-bold text-yellow-400 block mb-1\">2. Nokta (.):</span>\n                            <p class=\"text-xs text-slate-300\">Dosya adı ile uzantıyı birbirinden ayıran sınır çizgisidir.</p>\n                        </div>\n                        <div class=\"p-3.5 bg-slate-900/80 rounded-xl border border-pink-500/30\">\n                            <span class=\"text-xs font-bold text-pink-400 block mb-1\">3. Dosya Uzantısı:</span>\n                            <p class=\"text-xs text-slate-300\">Dosyanın türünü ve hangi programla açılacağını işletim sistemine bildirir.</p>\n                        </div>\n                    </div>\n                </div>\n\n                <div class=\"p-4 rounded-2xl bg-amber-950/40 border border-amber-500/30 flex items-center gap-3 text-xs sm:text-sm text-amber-200\">\n                    <i class=\"fa-solid fa-lightbulb text-yellow-400 text-2xl shrink-0\"></i>\n                    <span><strong>Önemli Kural:</strong> Bir dosyanın uzantısını rastgele siler veya değiştirirseniz bilgisayar o dosyanın türünü tanıyamaz ve açamayabilir!</span>\n                </div>\n            </div>\n        "},{"id":9,"title":"Bitmap Görüntü Dosyası Uzantıları (.jpg, .png, .gif, .bmp) 🗂️","subtitle":"Piksel Tabanlı Dosya Ailesi","topic":"2. TEMA • BTY.5.2.1","badge":"FORMATLAR","icon":"fa-solid fa-file-image","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-4 sm:p-5 rounded-2xl bg-slate-800/80 border-2 border-amber-400/40 space-y-2\">\n                        <div class=\"flex items-center justify-between\">\n                            <span class=\"text-xs font-mono font-black text-amber-400 px-2.5 py-1 bg-amber-400/20 rounded-lg\">.JPG / .JPEG</span>\n                            <span class=\"text-xs text-slate-400 font-bold\">Fotoğraf Standardı</span>\n                        </div>\n                        <h4 class=\"text-base sm:text-lg font-black text-white\">Sıkıştırılmış Fotoğraf</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Milyonlarca rengi saklar, dosya boyutu küçüktür. <strong>Şeffaf (saydam) arka planı DESTEKLEMEZ</strong>; arka planı beyaz veya renkli doldurur.\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 sm:p-5 rounded-2xl bg-slate-800/80 border-2 border-cyan-400/40 space-y-2\">\n                        <div class=\"flex items-center justify-between\">\n                            <span class=\"text-xs font-mono font-black text-cyan-400 px-2.5 py-1 bg-cyan-400/20 rounded-lg\">.PNG</span>\n                            <span class=\"text-xs text-slate-400 font-bold\">Şeffaf Web Formatı</span>\n                        </div>\n                        <h4 class=\"text-base sm:text-lg font-black text-white\">Saydam Arka Plan Kralı</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Kayıpsız sıkıştırır. <strong>Saydam (şeffaf) arka planı destekler</strong>. Logolar, butonlar ve grafikler için web dünyasının vazgeçilmezidir.\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 sm:p-5 rounded-2xl bg-slate-800/80 border-2 border-emerald-400/40 space-y-2\">\n                        <div class=\"flex items-center justify-between\">\n                            <span class=\"text-xs font-mono font-black text-emerald-400 px-2.5 py-1 bg-emerald-400/20 rounded-lg\">.GIF</span>\n                            <span class=\"text-xs text-slate-400 font-bold\">Hareketli Animasyon</span>\n                        </div>\n                        <h4 class=\"text-base sm:text-lg font-black text-white\">Kısa Döngülü Animasyon</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Birden fazla kareyi ardı ardına oynatarak kısa animasyonlar sağlar. En fazla <strong>256 renk</strong> desteklediği için fotoğraf kalitesi düşüktür.\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 sm:p-5 rounded-2xl bg-slate-800/80 border-2 border-purple-400/40 space-y-2\">\n                        <div class=\"flex items-center justify-between\">\n                            <span class=\"text-xs font-mono font-black text-purple-400 px-2.5 py-1 bg-purple-400/20 rounded-lg\">.BMP</span>\n                            <span class=\"text-xs text-slate-400 font-bold\">Ham Piksel</span>\n                        </div>\n                        <h4 class=\"text-base sm:text-lg font-black text-white\">Sıkıştırılmamış Ham Resim</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Pikselleri hiçbir sıkıştırma olmadan ham olarak saklar. Çok kaliteli ancak <strong>dosya boyutu devasadır</strong>, webde pek tercih edilmez.\n                        </p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":10,"title":"Vektörel Dosya Uzantıları (.svg, .eps, .ai) 📐","subtitle":"Çizgisel ve Baskı Formatları","topic":"2. TEMA • BTY.5.2.1","badge":"FORMATLAR","icon":"fa-solid fa-vector-square","bgColor":"from-slate-900 via-indigo-950 to-purple-950","gradient":"from-slate-900 via-indigo-950 to-purple-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-yellow-400/40 space-y-3\">\n                        <span class=\"text-xs font-mono font-black text-yellow-300 px-2.5 py-1 bg-yellow-400/20 rounded-lg block w-fit\">.SVG</span>\n                        <h4 class=\"text-lg font-black text-white\">Scalable Vector Graphics</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Web tarayıcılarının doğrudan gösterebildiği standart vektör formatıdır. Web sitelerindeki logolar ve ikonlar SVG olarak yüklenir.\n                        </p>\n                        <span class=\"text-[11px] text-yellow-200 block font-semibold\">🌐 Web Dostu & Hafif</span>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-pink-400/40 space-y-3\">\n                        <span class=\"text-xs font-mono font-black text-pink-300 px-2.5 py-1 bg-pink-400/20 rounded-lg block w-fit\">.AI</span>\n                        <h4 class=\"text-lg font-black text-white\">Adobe Illustrator Dosyası</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            İllüstratör programının kendi çalışma projesidir. Katmanları, eğrileri ve çizim kılavuzlarını saklar; daha sonra tekrar düzenlenebilir.\n                        </p>\n                        <span class=\"text-[11px] text-pink-200 block font-semibold\">🎨 Düzenlenebilir Proje</span>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-cyan-400/40 space-y-3\">\n                        <span class=\"text-xs font-mono font-black text-cyan-300 px-2.5 py-1 bg-cyan-400/20 rounded-lg block w-fit\">.EPS</span>\n                        <h4 class=\"text-lg font-black text-white\">Encapsulated PostScript</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Matbaalar, dev tabela üreticileri ve endüstriyel baskı makineleri için kullanılan yüksek kaliteli evrensel vektör standardıdır.\n                        </p>\n                        <span class=\"text-[11px] text-cyan-200 block font-semibold\">🖨️ Matbaa & Baskı Standardı</span>\n                    </div>\n                </div>\n\n                <div class=\"p-4 rounded-xl bg-slate-950/80 border border-slate-700 text-center text-xs sm:text-sm text-slate-300\">\n                    💡 <strong>Unutmayın:</strong> Bir web sitesine logo koyarken <strong>SVG</strong> veya <strong>PNG</strong> seçilir; JPG seçilirse logonun kenarında beyaz kutu kalabilir!\n                </div>\n            </div>\n        "},{"id":11,"title":"Doğru Dosya Biçimini Seçme Rehberi (Karar Ağacı) 🌲","subtitle":"Hangi Durumda Hangi Uzantıyı Kullanmalısın?","topic":"2. TEMA • BTY.5.2.1","badge":"REHBER","icon":"fa-solid fa-sitemap","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5\">\n                    <div class=\"p-4 rounded-2xl bg-amber-950/60 border-2 border-amber-500/50 space-y-2 text-center\">\n                        <div class=\"text-3xl text-amber-400 mb-1\"><i class=\"fa-solid fa-camera\"></i></div>\n                        <h4 class=\"font-black text-white text-base\">Fotoğraf Çektin mi?</h4>\n                        <p class=\"text-xs text-amber-200\">Manzara, okul gezisi, portre</p>\n                        <div class=\"pt-2\">\n                            <span class=\"px-3 py-1.5 bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow\">👉 .JPG Seç!</span>\n                        </div>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-cyan-950/60 border-2 border-cyan-500/50 space-y-2 text-center\">\n                        <div class=\"text-3xl text-cyan-400 mb-1\"><i class=\"fa-solid fa-clone\"></i></div>\n                        <h4 class=\"font-black text-white text-base\">Arka Plan Şeffaf mı?</h4>\n                        <p class=\"text-xs text-cyan-200\">Logo, buton, nesne dekupe</p>\n                        <div class=\"pt-2\">\n                            <span class=\"px-3 py-1.5 bg-cyan-400 text-slate-950 font-black text-xs rounded-xl shadow\">👉 .PNG Seç!</span>\n                        </div>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-emerald-950/60 border-2 border-emerald-500/50 space-y-2 text-center\">\n                        <div class=\"text-3xl text-emerald-400 mb-1\"><i class=\"fa-solid fa-play\"></i></div>\n                        <h4 class=\"font-black text-white text-base\">Hareket / Animasyon mu?</h4>\n                        <p class=\"text-xs text-emerald-200\">Kısa döngülü komik anlar</p>\n                        <div class=\"pt-2\">\n                            <span class=\"px-3 py-1.5 bg-emerald-400 text-slate-950 font-black text-xs rounded-xl shadow\">👉 .GIF Seç!</span>\n                        </div>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-purple-950/60 border-2 border-purple-500/50 space-y-2 text-center\">\n                        <div class=\"text-3xl text-purple-400 mb-1\"><i class=\"fa-solid fa-maximize\"></i></div>\n                        <h4 class=\"font-black text-white text-base\">Dev Boyutta Basılacak mı?</h4>\n                        <p class=\"text-xs text-purple-200\">Bina afişi, sonsuz netlik</p>\n                        <div class=\"pt-2\">\n                            <span class=\"px-3 py-1.5 bg-purple-400 text-slate-950 font-black text-xs rounded-xl shadow\">👉 .SVG / .AI Seç!</span>\n                        </div>\n                    </div>\n                </div>\n\n                <div class=\"p-4 rounded-2xl bg-slate-900 border border-slate-700 text-center\">\n                    <p class=\"text-xs sm:text-sm text-yellow-300 font-bold\">\n                        🧠 Altın Kural: Yanlış format seçimi afişinizi ya aşırı ağırlaştırır ya da kalitesini düşürür!\n                    </p>\n                </div>\n            </div>\n        "},{"id":12,"title":"Bölüm 3: Görsel İşleme Programı Nedir? 🛠️","subtitle":"Dijital Tasarımcının Araç Çantası","topic":"2. TEMA • BTY.5.2.1","badge":"BÖLÜM 3","icon":"fa-solid fa-laptop-code","bgColor":"from-slate-900 via-indigo-950 to-purple-950","gradient":"from-slate-900 via-indigo-950 to-purple-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-6 my-auto\">\n                <div class=\"p-5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 text-center\">\n                    <p class=\"text-base sm:text-lg font-bold text-yellow-300 leading-relaxed\">\n                        “Fotoğrafları ve çizimleri bilgisayar ortamında düzenlemek, kırpmak, renklendirmek veya sıfırdan afiş oluşturmak için kullanılan yazılımlara <strong>Görsel Düzenleme Programı</strong> denir.”\n                    </p>\n                </div>\n\n                <div class=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border border-slate-700 text-center space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl mx-auto\">\n                            <i class=\"fa-solid fa-wand-magic-sparkles\"></i>\n                        </div>\n                        <h4 class=\"font-black text-white text-base\">Düzeltme & İyileştirme</h4>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">Karanlık fotoğrafları aydınlatma, kırmızı gözleri düzeltme, istenmeyen nesneleri silme.</p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border border-slate-700 text-center space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-pink-500/20 text-pink-400 flex items-center justify-center text-2xl mx-auto\">\n                            <i class=\"fa-solid fa-layer-group\"></i>\n                        </div>\n                        <h4 class=\"font-black text-white text-base\">Katmanlı Tasarım</h4>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">Görselin üzerine yazı, logo, simge ve şekiller ekleyerek yeni bir afiş veya broşür üretme.</p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border border-slate-700 text-center space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mx-auto\">\n                            <i class=\"fa-solid fa-file-export\"></i>\n                        </div>\n                        <h4 class=\"font-black text-white text-base\">Doğru Dışa Aktarma</h4>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">Çalışmayı baskı için PDF veya web için JPG/PNG formatında dışarıya kaydetme.</p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":13,"title":"Giriş & Pratik Araçlar: Paint, Canva, Google Çizimler 🖌️","subtitle":"Hızlı, Kolay ve Kullanışlı Tasarım Çözümleri","topic":"2. TEMA • BTY.5.2.1","badge":"PRATİK ARAÇLAR","icon":"fa-solid fa-paintbrush","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-blue-400/50 space-y-3\">\n                        <div class=\"flex items-center gap-3\">\n                            <div class=\"w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl font-black\">\n                                <i class=\"fa-solid fa-paint-roller\"></i>\n                            </div>\n                            <div>\n                                <h4 class=\"font-black text-white text-lg\">Paint</h4>\n                                <span class=\"text-xs text-blue-300 font-bold\">Windows Yerleşik</span>\n                            </div>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Her Windows bilgisayarda hazırdır. Basit resim çizme, fotoğraf kırpma ve boyutlandırma için en pratik başlangıç programıdır.\n                        </p>\n                        <div class=\"text-[11px] text-yellow-300 font-semibold\">• İnternetsiz çalışır • Temel araçlar</div>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-cyan-400/50 space-y-3\">\n                        <div class=\"flex items-center gap-3\">\n                            <div class=\"w-12 h-12 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-2xl font-black\">\n                                <i class=\"fa-solid fa-cloud\"></i>\n                            </div>\n                            <div>\n                                <h4 class=\"font-black text-white text-lg\">Canva</h4>\n                                <span class=\"text-xs text-cyan-300 font-bold\">Çevrim İçi Şablon Devi</span>\n                            </div>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Web tarayıcısından çalışır. Milyonlarca hazır afiş, sunum ve broşür şablonuyla profesyonel görünümlü tasarımlar yapmayı çok kolaylaştırır.\n                        </p>\n                        <div class=\"text-[11px] text-cyan-300 font-semibold\">• Hazır Şablonlar • Sürükle-Bırak</div>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-emerald-400/50 space-y-3\">\n                        <div class=\"flex items-center gap-3\">\n                            <div class=\"w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl font-black\">\n                                <i class=\"fa-solid fa-shapes\"></i>\n                            </div>\n                            <div>\n                                <h4 class=\"font-black text-white text-lg\">Google Çizimler</h4>\n                                <span class=\"text-xs text-emerald-300 font-bold\">İşbirlikçi & Ücretsiz</span>\n                            </div>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Google hesabıyla ücretsiz kullanılır. Akış şemaları, kavram haritaları ve şemalar çizmek, arkadaşlarınızla aynı anda çalışmak için idealdir.\n                        </p>\n                        <div class=\"text-[11px] text-emerald-300 font-semibold\">• Ortak Çalışma • Bulut Kaydı</div>\n                    </div>\n                </div>\n            </div>\n        "},{"id":14,"title":"İleri ve Profesyonel Programlar: Photoshop, Illustrator, GIMP, Tinkercad 🚀","subtitle":"Sektör Standartları ve Açık Kaynak Çözümler","topic":"2. TEMA • BTY.5.2.1","badge":"İLERİ PROGRAMLAR","icon":"fa-solid fa-cube","bgColor":"from-slate-900 via-indigo-950 to-purple-950","gradient":"from-slate-900 via-indigo-950 to-purple-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-blue-500/40 space-y-2\">\n                        <div class=\"flex items-center gap-2\">\n                            <span class=\"w-8 h-8 rounded-lg bg-blue-600 text-white font-black flex items-center justify-center text-xs\">Ps</span>\n                            <h4 class=\"font-black text-white text-base\">Adobe Photoshop</h4>\n                        </div>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">\n                            Dünyada fotoğraf düzenleme ve rötuş denince akla ilk gelen piksel tabanlı endüstri standardı yazılımdır.\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-amber-500/40 space-y-2\">\n                        <div class=\"flex items-center gap-2\">\n                            <span class=\"w-8 h-8 rounded-lg bg-amber-600 text-white font-black flex items-center justify-center text-xs\">Ai</span>\n                            <h4 class=\"font-black text-white text-base\">Adobe Illustrator</h4>\n                        </div>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">\n                            Profesyonel vektörel grafik, amblem, logo ve tipografi tasarımında küresel ölçekte en yaygın kullanılan yazılımdır.\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-purple-500/40 space-y-2\">\n                        <div class=\"flex items-center gap-2\">\n                            <span class=\"w-8 h-8 rounded-lg bg-purple-600 text-white font-black flex items-center justify-center text-xs\">G</span>\n                            <h4 class=\"font-black text-white text-base\">GIMP (Açık Kaynak Kodlu)</h4>\n                        </div>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">\n                            Tamamen ücretsiz, açık kaynak kodlu ve katman destekli güçlü bir görsel düzenleyicidir. Photoshop'un özgür alternatifidir.\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-emerald-500/40 space-y-2\">\n                        <div class=\"flex items-center gap-2\">\n                            <span class=\"w-8 h-8 rounded-lg bg-emerald-600 text-white font-black flex items-center justify-center text-xs\">3D</span>\n                            <h4 class=\"font-black text-white text-base\">Autodesk Tinkercad</h4>\n                        </div>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">\n                            Tarayıcıda çalışan, 3 boyutlu modelleme ve tasarım yapmayı çocuk oyuncağı hâline getiren eğlenceli bir araçtır.\n                        </p>\n                    </div>\n                </div>\n\n                <div class=\"p-3.5 rounded-xl bg-indigo-950/80 border border-indigo-400/30 text-center text-xs text-indigo-200\">\n                    💡 <strong>Önemli Ayrım:</strong> Photoshop piksel (bitmap) düzenlerken, Illustrator matematiksel vektör çizer!\n                </div>\n            </div>\n        "},{"id":15,"title":"Görsel Programları Karşılaştırma Matrisi 📊","subtitle":"Hangi Görev İçin Hangi Yazılım Doğru?","topic":"2. TEMA • BTY.5.2.1","badge":"MATRİS","icon":"fa-solid fa-table-list","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-4 my-auto\">\n                <div class=\"overflow-x-auto rounded-2xl border-2 border-purple-500/40 shadow-2xl bg-slate-950/90\">\n                    <table class=\"w-full text-left text-xs sm:text-sm\">\n                        <thead class=\"bg-purple-900/60 text-yellow-300 font-black uppercase tracking-wider border-b border-purple-700/60\">\n                            <tr>\n                                <th class=\"p-3 sm:p-3.5\">Program</th>\n                                <th class=\"p-3 sm:p-3.5\">Tür</th>\n                                <th class=\"p-3 sm:p-3.5\">Erişim & Ücret</th>\n                                <th class=\"p-3 sm:p-3.5\">Zorluk</th>\n                                <th class=\"p-3 sm:p-3.5\">En Uygun Görev</th>\n                            </tr>\n                        </thead>\n                        <tbody class=\"divide-y divide-slate-800 text-slate-200\">\n                            <tr class=\"hover:bg-slate-850\">\n                                <td class=\"p-3 font-bold text-white\"><i class=\"fa-solid fa-paint-roller text-blue-400 mr-1.5\"></i>Paint</td>\n                                <td class=\"p-3 text-cyan-300\">Bitmap</td>\n                                <td class=\"p-3 text-emerald-400 font-bold\">Ücretsiz (Windows)</td>\n                                <td class=\"p-3 text-emerald-300\">Çok Kolay ⭐</td>\n                                <td class=\"p-3\">Hızlı kırpma, basit karalama</td>\n                            </tr>\n                            <tr class=\"hover:bg-slate-850\">\n                                <td class=\"p-3 font-bold text-white\"><i class=\"fa-solid fa-cloud text-cyan-400 mr-1.5\"></i>Canva</td>\n                                <td class=\"p-3 text-purple-300\">Hibrit (Şablon)</td>\n                                <td class=\"p-3 text-emerald-400 font-bold\">Ücretsiz (Web)</td>\n                                <td class=\"p-3 text-emerald-300\">Kolay ⭐⭐</td>\n                                <td class=\"p-3\">Okul afişi, sunum, broşür</td>\n                            </tr>\n                            <tr class=\"hover:bg-slate-850\">\n                                <td class=\"p-3 font-bold text-white\"><i class=\"fa-solid fa-paw text-purple-400 mr-1.5\"></i>GIMP</td>\n                                <td class=\"p-3 text-cyan-300\">Bitmap</td>\n                                <td class=\"p-3 text-emerald-400 font-bold\">Açık Kaynak (Ücretsiz)</td>\n                                <td class=\"p-3 text-amber-300\">Orta ⭐⭐⭐</td>\n                                <td class=\"p-3\">Katmanlı fotoğraf işleme</td>\n                            </tr>\n                            <tr class=\"hover:bg-slate-850\">\n                                <td class=\"p-3 font-bold text-white\"><i class=\"fa-solid fa-camera text-indigo-400 mr-1.5\"></i>Photoshop</td>\n                                <td class=\"p-3 text-cyan-300\">Bitmap</td>\n                                <td class=\"p-3 text-rose-400 font-bold\">Ücretli Lisans</td>\n                                <td class=\"p-3 text-rose-300\">İleri ⭐⭐⭐⭐</td>\n                                <td class=\"p-3\">Profesyonel fotoğraf rötuşu</td>\n                            </tr>\n                            <tr class=\"hover:bg-slate-850\">\n                                <td class=\"p-3 font-bold text-white\"><i class=\"fa-solid fa-bezier-curve text-amber-400 mr-1.5\"></i>Illustrator</td>\n                                <td class=\"p-3 text-pink-300\">Vektörel</td>\n                                <td class=\"p-3 text-rose-400 font-bold\">Ücretli Lisans</td>\n                                <td class=\"p-3 text-rose-300\">İleri ⭐⭐⭐⭐</td>\n                                <td class=\"p-3\">Vektörel logo & amblem</td>\n                            </tr>\n                        </tbody>\n                    </table>\n                </div>\n            </div>\n        "},{"id":16,"title":"Temel Düzenleme İşlemleri: Kırpma, Döndürme, Boyutlandırma ✂️","subtitle":"Her Tasarımcının Bilmesi Gereken 3 Temel Hamle","topic":"2. TEMA • BTY.5.2.1","badge":"DÜZENLEME","icon":"fa-solid fa-crop-simple","bgColor":"from-slate-900 via-indigo-950 to-purple-950","gradient":"from-slate-900 via-indigo-950 to-purple-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-6 my-auto\">\n                <div class=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-yellow-400/40 space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-yellow-400/20 text-yellow-300 flex items-center justify-center text-2xl font-black\">\n                            <i class=\"fa-solid fa-crop\"></i>\n                        </div>\n                        <h4 class=\"text-lg font-black text-white\">1. Kırpma (Crop)</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Fotoğrafın gereksiz veya dikkat dağıtıcı kenar kısımlarını kesip atmak, izleyicinin dikkatini sadece ana nesneye toplamak için kullanılır.\n                        </p>\n                        <span class=\"text-[11px] text-yellow-300 font-semibold block\">🎯 Odak Noktasını Belirler</span>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-cyan-400/40 space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-cyan-400/20 text-cyan-300 flex items-center justify-center text-2xl font-black\">\n                            <i class=\"fa-solid fa-rotate\"></i>\n                        </div>\n                        <h4 class=\"text-lg font-black text-white\">2. Döndürme (Rotate)</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Telefonla yan veya baş aşağı çekilmiş fotoğrafları 90°, 180° veya istenen açıda çevirerek düzgün bakış açısına getirmeyi sağlar.\n                        </p>\n                        <span class=\"text-[11px] text-cyan-300 font-semibold block\">🔄 Açıyı Düzeltir</span>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-emerald-400/40 space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-emerald-400/20 text-emerald-300 flex items-center justify-center text-2xl font-black\">\n                            <i class=\"fa-solid fa-up-right-and-down-left-from-center\"></i>\n                        </div>\n                        <h4 class=\"text-lg font-black text-white\">3. Boyutlandırma (Resize)</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Görselin genişlik ve yükseklik piksel ölçülerini büyütme veya küçültmedir. En-boy oranını (Aspect Ratio) kilitlemek görselin basık görünmesini önler!\n                        </p>\n                        <span class=\"text-[11px] text-emerald-300 font-semibold block\">📐 Orantılı Büyütüp Küçültür</span>\n                    </div>\n                </div>\n            </div>\n        "},{"id":17,"title":"İleri Düzenleme: Renk Ayarları, Metin ve Şekil Ekleme 🎨","subtitle":"Afişinizi Zenginleştiren Görsel Katmanlar","topic":"2. TEMA • BTY.5.2.1","badge":"İLERİ DÜZENLEME","icon":"fa-solid fa-sliders","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-5\">\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-3\">\n                        <div class=\"flex items-center gap-2 text-yellow-300 font-black text-base\">\n                            <i class=\"fa-solid fa-sun\"></i>\n                            <h4>Parlaklık & Kontrast Ayarı</h4>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Karanlık çıkmış fotoğrafları aydınlatır, açık-koyu renk farkını (kontrast) belirginleştirerek ayrıntıların canlanmasını sağlar.\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-3\">\n                        <div class=\"flex items-center gap-2 text-pink-300 font-black text-base\">\n                            <i class=\"fa-solid fa-droplet\"></i>\n                            <h4>Doygunluk (Renk Canlılığı)</h4>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Renklerin solgunluğunu giderip canlı hâle getirir ya da doygunluğu sıfırlayarak nostaljik siyah-beyaz fotoğraflar üretir.\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-3\">\n                        <div class=\"flex items-center gap-2 text-cyan-300 font-black text-base\">\n                            <i class=\"fa-solid fa-font\"></i>\n                            <h4>Metin (Yazı) Aracı (T)</h4>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Afişlere başlık, tarih ve mesaj ekler. Arka planla zıt renkte fontlar seçmek okunabilirliği katbekat artırır.\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-3\">\n                        <div class=\"flex items-center gap-2 text-emerald-300 font-black text-base\">\n                            <i class=\"fa-solid fa-shapes\"></i>\n                            <h4>Geometrik Şekiller & Çerçeveler</h4>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Kutucuklar, ok işaretleri ve rozetler kullanarak önemli bilgileri çerçeve içine alıp dikkat çekici hâle getirir.\n                        </p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":18,"title":"Bölüm 4: Dijital Ürün Nedir? Afiş, Broşür, Sunum, Logo 📢","subtitle":"Fikirden Dijital Eserlere Dönüşüm","topic":"2. TEMA • BTY.5.2.1","badge":"BÖLÜM 4","icon":"fa-solid fa-bullhorn","bgColor":"from-slate-900 via-indigo-950 to-purple-950","gradient":"from-slate-900 via-indigo-950 to-purple-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-5 my-auto\">\n                <div class=\"p-5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 text-center\">\n                    <p class=\"text-base sm:text-lg font-bold text-yellow-300 leading-relaxed\">\n                        “Bilişim araçları kullanılarak belirli bir amaca hizmet etmek üzere tasarlanan her türlü görsel içeriğe <strong>DİJİTAL ÜRÜN</strong> denir.”\n                    </p>\n                </div>\n\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4\">\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-indigo-500/40 text-center space-y-2\">\n                        <div class=\"text-3xl text-indigo-400 mb-1\"><i class=\"fa-solid fa-scroll\"></i></div>\n                        <h4 class=\"font-black text-white text-base\">Afiş (Poster)</h4>\n                        <p class=\"text-xs text-slate-300\">Uzaktan hemen fark edilen, tek bir mesajı veya etkinliği duyuran görsel.</p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-pink-500/40 text-center space-y-2\">\n                        <div class=\"text-3xl text-pink-400 mb-1\"><i class=\"fa-solid fa-book-open\"></i></div>\n                        <h4 class=\"font-black text-white text-base\">Broşür</h4>\n                        <p class=\"text-xs text-slate-300\">Katlamalı, detaylı bilgi veren ve insanları bilgilendiren tanıtım materyali.</p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-cyan-500/40 text-center space-y-2\">\n                        <div class=\"text-3xl text-cyan-400 mb-1\"><i class=\"fa-solid fa-tv\"></i></div>\n                        <h4 class=\"font-black text-white text-base\">Ders Sunumu</h4>\n                        <p class=\"text-xs text-slate-300\">Anlatımı destekleyen, bol görselli ve az yazılı etkileşimli slaytlar.</p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-amber-500/40 text-center space-y-2\">\n                        <div class=\"text-3xl text-amber-400 mb-1\"><i class=\"fa-solid fa-shield\"></i></div>\n                        <h4 class=\"font-black text-white text-base\">Kurumsal Logo</h4>\n                        <p class=\"text-xs text-slate-300\">Bir okulu veya markayı temsil eden akılda kalıcı, sade simge.</p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":19,"title":"Tasarım Sürecinin 4 Aşaması (Görsel Akış Şeması) 🔄","subtitle":"Fikirden Nihai Tasarıma Adım Adım Yol Haritası","topic":"2. TEMA • BTY.5.2.1","badge":"TASARIM SÜRECİ","icon":"fa-solid fa-arrows-split-up-and-left","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4\">\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-blue-500/50 space-y-2\">\n                        <div class=\"w-8 h-8 rounded-lg bg-blue-500/20 text-blue-300 flex items-center justify-center font-black\">1</div>\n                        <h4 class=\"font-black text-white text-base\">Problemi Belirleme</h4>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">\n                            Bu afiş neyi çözecek? Hedef kitlemiz kimler (öğrenciler mi, veliler mi)? Amaç ne?\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-cyan-500/50 space-y-2\">\n                        <div class=\"w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-300 flex items-center justify-center font-black\">2</div>\n                        <h4 class=\"font-black text-white text-base\">Kurgu ve Senaryo</h4>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">\n                            Hangi slogan kullanılacak? Taslak kâğıda elle kaba yerleşim çizilir (Storyboard / Wireframe).\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-purple-500/50 space-y-2\">\n                        <div class=\"w-8 h-8 rounded-lg bg-purple-500/20 text-purple-300 flex items-center justify-center font-black\">3</div>\n                        <h4 class=\"font-black text-white text-base\">Ürün Geliştirme</h4>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">\n                            Canva veya GIMP açılarak renkler, fontlar, şekiller ve görseller dijital ortama aktarılır.\n                        </p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-800/80 border-2 border-emerald-500/50 space-y-2\">\n                        <div class=\"w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-300 flex items-center justify-center font-black\">4</div>\n                        <h4 class=\"font-black text-white text-base\">Değerlendirme</h4>\n                        <p class=\"text-xs text-slate-300 leading-relaxed\">\n                            Yazı uzaktan okunuyor mu? Renkler uyumlu mu? Telif sorunu var mı? Kontrol edilip dışa aktarılır.\n                        </p>\n                    </div>\n                </div>\n\n                <div class=\"p-4 rounded-2xl bg-indigo-950/80 border border-indigo-400/30 text-center\">\n                    <p class=\"text-xs sm:text-sm text-indigo-100 font-semibold\">\n                        💡 Başarılı bir tasarımcı asla düşünmeden bilgisayar başına oturmaz; önce problemi ve kurguyu belirler!\n                    </p>\n                </div>\n            </div>\n        "},{"id":20,"title":"Tasarım İlkeleri, Telif Hakkı, Yapay Zekâ Etiği ve Büyük Özet 🛡️","subtitle":"Bilinçli ve Sorumlu Dijital Tasarımcı","topic":"2. TEMA • BTY.5.2.1","badge":"BÜYÜK ÖZET","icon":"fa-solid fa-shield-halved","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-yellow-400/40 space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-yellow-400/20 text-yellow-300 flex items-center justify-center text-2xl font-black\">\n                            <i class=\"fa-solid fa-eye\"></i>\n                        </div>\n                        <h4 class=\"text-lg font-black text-white\">Görsel Bütünlük</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Afişte en fazla 2-3 yazı tipi kullanın. Zıt (kontrast) renklerle yazıları uzaktan okunabilir kılın. Karmaşadan kaçının!\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-rose-400/40 space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-rose-400/20 text-rose-300 flex items-center justify-center text-2xl font-black\">\n                            <i class=\"fa-solid fa-copyright\"></i>\n                        </div>\n                        <h4 class=\"text-lg font-black text-white\">Telif Haklarına Saygı</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            İnternetteki her resim serbest değildir! Sahibinden izin alın, telifsiz (Creative Commons) kütüphaneleri kullanın ve kaynak belirtin.\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-800/80 border-2 border-cyan-400/40 space-y-3\">\n                        <div class=\"w-12 h-12 rounded-xl bg-cyan-400/20 text-cyan-300 flex items-center justify-center text-2xl font-black\">\n                            <i class=\"fa-solid fa-robot\"></i>\n                        </div>\n                        <h4 class=\"text-lg font-black text-white\">Yapay Zekâ Etiği</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Yapay zekâyla görsel üretirken insanları aldatıcı sahte görüntüler (deepfake) üretmeyin; yapay zekâyı yaratıcı bir asistan olarak kullanın.\n                        </p>\n                    </div>\n                </div>\n\n                <div class=\"p-4 rounded-2xl bg-gradient-to-r from-purple-900/80 to-indigo-900/80 border-2 border-yellow-400/40 flex items-center justify-between gap-4 flex-wrap shadow-xl\">\n                    <div class=\"flex items-center gap-3\">\n                        <span class=\"text-3xl\">🎉</span>\n                        <div>\n                            <h4 class=\"font-black text-white text-sm sm:text-base\">Tebrikler! 7. Konu Sunumunu Başarıyla Tamamladınız!</h4>\n                            <p class=\"text-xs text-purple-200\">Şimdi Çalışma Kağıtlarını çözebilir ve 4 özel oyun arenasında rekor kırabilirsiniz!</p>\n                        </div>\n                    </div>\n                    <button onclick=\"app.switchTab('games'); sounds.playFanfare();\" class=\"px-5 py-2.5 bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black rounded-xl text-xs sm:text-sm shadow-lg flex items-center gap-2 transition-all hover:scale-105 active:scale-95\">\n                        <i class=\"fa-solid fa-gamepad\"></i>\n                        <span>Oyun Arenasına Geç ➔</span>\n                    </button>\n                </div>\n            </div>\n        "}];
        let currentSlide = 0;

        function renderSlide() {
            const s = slides[currentSlide];
            if (!s) return;

            document.getElementById('slide-title').innerHTML = s.title || ('Slayt ' + (currentSlide + 1));
            document.getElementById('slide-subtitle').innerText = s.subtitle || s.topic || '';
            document.getElementById('slide-badge').innerText = s.badge || ('KAZANIM BTY.5');
            document.getElementById('slide-number-top').innerText = 'Slayt ' + (currentSlide + 1) + ' / ' + slides.length;
            document.getElementById('slide-counter').innerText = 'Slayt ' + (currentSlide + 1) + ' / ' + slides.length;

            const iconEl = document.getElementById('slide-icon');
            iconEl.className = s.icon ? (s.icon + ' text-2xl sm:text-3xl text-indigo-400') : 'fa-solid fa-chalkboard-user text-2xl sm:text-3xl text-indigo-400';

            const bodyEl = document.getElementById('slide-body');
            bodyEl.innerHTML = s.content || '<p class="text-slate-400">Bu slayt için içerik bulunmuyor.</p>';

            const noteBox = document.getElementById('slide-note-box');
            const noteText = document.getElementById('slide-note-text');
            if (s.teacherNote) {
                noteText.innerText = s.teacherNote;
                noteBox.classList.remove('hidden');
            } else {
                noteBox.classList.add('hidden');
            }

            // Buton durumları
            document.getElementById('btn-prev').disabled = (currentSlide === 0);
            document.getElementById('btn-next').disabled = (currentSlide === slides.length - 1);

            // Progress bar
            const percent = ((currentSlide + 1) / slides.length) * 100;
            document.getElementById('slide-progress-bar').style.width = percent + '%';

            // Sahne arkaplan gradyanı
            const stage = document.getElementById('slide-stage');
            if (s.gradient || s.bgColor) {
                stage.className = 'w-full max-w-5xl bg-gradient-to-br ' + (s.gradient || s.bgColor) + ' rounded-2xl sm:rounded-3xl border-2 border-indigo-500/30 shadow-2xl p-5 sm:p-8 md:p-10 flex flex-col justify-between min-h-[500px] sm:min-h-[580px] transition-all';
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(idx) {
            currentSlide = idx;
            renderSlide();
            toggleDrawer(false);
        }

        function toggleDrawer(force) {
            const d = document.getElementById('slide-drawer');
            if (force !== undefined) {
                if (force) d.classList.remove('hidden'); else d.classList.add('hidden');
            } else {
                d.classList.toggle('hidden');
            }
            if (!d.classList.contains('hidden')) {
                buildDrawerList();
            }
        }

        function buildDrawerList() {
            const list = document.getElementById('drawer-slide-list');
            list.innerHTML = slides.map((s, idx) => {
                const active = (idx === currentSlide) ? 'bg-indigo-600 text-white font-black' : 'bg-slate-800 hover:bg-slate-700 text-slate-300';
                return '<button onclick="goToSlide(' + idx + ')" class="w-full text-left p-3 rounded-xl ' + active + ' text-xs sm:text-sm flex items-center justify-between transition">' +
                       '<span class="truncate"><b>' + (idx + 1) + '.</b> ' + (s.title || 'Slayt') + '</span>' +
                       '<i class="fa-solid fa-chevron-right text-xs opacity-60"></i>' +
                       '</button>';
            }).join('');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Klavye tuş kontrolleri
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullScreen();
            } else if (e.key === 'Escape') {
                toggleDrawer(false);
            }
        });

        // Başlangıç
        renderSlide();
    </script>
