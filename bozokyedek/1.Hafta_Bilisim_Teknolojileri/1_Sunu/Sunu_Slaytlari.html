dasız veya zararlı olabilir.”\n                            </p>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/teknoloji_araclar.jpg\" alt=\"Teknoloji Araçları\" class=\"rounded-3xl border-4 border-orange-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":6,"title":"Bilişim Nedir? 💡","subtitle":"Temel Kavramlar (4/5)","topic":"4. Temel Tanım","icon":"fa-solid fa-lightbulb","bgColor":"from-purple-600 via-indigo-700 to-slate-900","content":"\n                <div class=\"max-w-5xl mx-auto space-y-6 my-auto text-center py-2\">\n                    <div class=\"inline-flex items-center gap-2 px-4 py-1.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-400/40 font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">\n                        TEMEL FORMÜL\n                    </div>\n                    <div class=\"bg-gradient-to-r from-blue-900/60 via-purple-900/60 to-indigo-900/60 rounded-3xl p-8 border-2 border-purple-400/40 shadow-2xl space-y-6\">\n                        <div class=\"flex flex-wrap items-center justify-center gap-3 sm:gap-6 text-2xl sm:text-4xl font-black text-white\">\n                            <span class=\"px-6 py-3 bg-blue-600/60 rounded-2xl border border-blue-400 shadow-lg text-blue-200\">BİLGİ</span>\n                            <span class=\"text-yellow-300 text-3xl font-black\">+</span>\n                            <span class=\"px-6 py-3 bg-teal-600/60 rounded-2xl border border-teal-400 shadow-lg text-teal-200\">İLETİŞİM</span>\n                            <span class=\"text-yellow-300 text-3xl font-black\">=</span>\n                            <span class=\"px-8 py-3 bg-purple-600 rounded-2xl border-2 border-purple-300 shadow-2xl text-yellow-300\">BİLİŞİM</span>\n                        </div>\n                        <p class=\"text-base sm:text-lg text-purple-100 max-w-2xl mx-auto font-medium\">\n                            Bilginin teknoloji ve iletişim araçları vasıtasıyla işlenmesi ve aktarılmasıdır.\n                        </p>\n                    </div>\n                </div>\n            "},{"id":7,"title":"Bilişim Teknolojileri (BT) Nedir? 🖥️","subtitle":"Temel Kavramlar (5/5)","topic":"5. Temel Tanım","icon":"fa-solid fa-laptop-code","bgColor":"from-blue-700 via-indigo-800 to-slate-900","content":"\n                <div class=\"max-w-5xl mx-auto space-y-5 my-auto py-2\">\n                    <div class=\"bg-indigo-950/70 border-2 border-indigo-400/40 rounded-3xl p-6 shadow-xl text-center space-y-3\">\n                        <span class=\"px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">RESMİ TANIM</span>\n                        <h2 class=\"text-lg sm:text-xl font-bold text-white leading-relaxed max-w-3xl mx-auto\">\n                            “Bilginin <span class=\"text-yellow-300 font-black\">toplanması</span>, <span class=\"text-yellow-300 font-black\">işlenmesi</span>, <span class=\"text-yellow-300 font-black\">depolanması</span> ve <span class=\"text-yellow-300 font-black\">kullanılması</span> ile ilgili süreçlerde kullanılan her türlü iletişim cihazları ve bilgisayarları kapsayan teknolojiler bütünüdür.”\n                        </h2>\n                    </div>\n                    <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3\">\n                        <div class=\"p-3 bg-white/10 rounded-2xl border border-white/10 text-center\">\n                            <div class=\"w-10 h-10 bg-blue-500/30 text-blue-300 rounded-xl flex items-center justify-center text-xl mx-auto mb-1\"><i class=\"fa-solid fa-cloud-arrow-down\"></i></div>\n                            <h4 class=\"font-black text-white text-xs sm:text-sm\">1. Toplanması</h4>\n                        </div>\n                        <div class=\"p-3 bg-white/10 rounded-2xl border border-white/10 text-center\">\n                            <div class=\"w-10 h-10 bg-purple-500/30 text-purple-300 rounded-xl flex items-center justify-center text-xl mx-auto mb-1\"><i class=\"fa-solid fa-microchip\"></i></div>\n                            <h4 class=\"font-black text-white text-xs sm:text-sm\">2. İşlenmesi</h4>\n                        </div>\n                        <div class=\"p-3 bg-white/10 rounded-2xl border border-white/10 text-center\">\n                            <div class=\"w-10 h-10 bg-teal-500/30 text-teal-300 rounded-xl flex items-center justify-center text-xl mx-auto mb-1\"><i class=\"fa-solid fa-hard-drive\"></i></div>\n                            <h4 class=\"font-black text-white text-xs sm:text-sm\">3. Depolanması</h4>\n                        </div>\n                        <div class=\"p-3 bg-white/10 rounded-2xl border border-white/10 text-center\">\n                            <div class=\"w-10 h-10 bg-emerald-500/30 text-emerald-300 rounded-xl flex items-center justify-center text-xl mx-auto mb-1\"><i class=\"fa-solid fa-circle-play\"></i></div>\n                            <h4 class=\"font-black text-white text-xs sm:text-sm\">4. Kullanılması</h4>\n                        </div>\n                    </div>\n                </div>\n            "},{"id":8,"title":"Bilişim Teknolojilerinin Faydaları 🌟","subtitle":"5 Temel Fayda","topic":"Temel Faydalar","icon":"fa-solid fa-star","bgColor":"from-emerald-700 via-teal-800 to-slate-900","content":"\n                <div class=\"max-w-5xl mx-auto space-y-4 my-auto py-2\">\n                    <div class=\"text-center space-y-1\">\n                        <span class=\"text-xs font-black uppercase text-yellow-300 tracking-widest\">KAYNAKTAKİ 5 FAYDA</span>\n                        <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Hayatımıza Ne Kazandırır?</h3>\n                    </div>\n                    <div class=\"grid grid-cols-1 sm:grid-cols-5 gap-3 pt-2\">\n                        <div class=\"p-4 bg-slate-900/90 rounded-2xl border border-emerald-500/40 text-center space-y-2 shadow-xl\">\n                            <div class=\"w-12 h-12 bg-emerald-500/20 text-emerald-300 rounded-xl flex items-center justify-center text-2xl mx-auto\"><i class=\"fa-solid fa-magnifying-glass\"></i></div>\n                            <h4 class=\"font-black text-sm text-emerald-300\">Bilgiye Kolay Ulaşma</h4>\n                        </div>\n                        <div class=\"p-4 bg-slate-900/90 rounded-2xl border border-emerald-500/40 text-center space-y-2 shadow-xl\">\n                            <div class=\"w-12 h-12 bg-teal-500/20 text-teal-300 rounded-xl flex items-center justify-center text-2xl mx-auto\"><i class=\"fa-solid fa-coins\"></i></div>\n                            <h4 class=\"font-black text-sm text-teal-300\">Maliyeti Azaltma</h4>\n                        </div>\n                        <div class=\"p-4 bg-slate-900/90 rounded-2xl border border-emerald-500/40 text-center space-y-2 shadow-xl\">\n                            <div class=\"w-12 h-12 bg-yellow-500/20 text-yellow-300 rounded-xl flex items-center justify-center text-2xl mx-auto\"><i class=\"fa-solid fa-wand-magic-sparkles\"></i></div>\n                            <h4 class=\"font-black text-sm text-yellow-300\">Hayatı Kolaylaştırma</h4>\n                        </div>\n                        <div class=\"p-4 bg-slate-900/90 rounded-2xl border border-emerald-500/40 text-center space-y-2 shadow-xl\">\n                            <div class=\"w-12 h-12 bg-cyan-500/20 text-cyan-300 rounded-xl flex items-center justify-center text-2xl mx-auto\"><i class=\"fa-solid fa-paper-plane\"></i></div>\n                            <h4 class=\"font-black text-sm text-cyan-300\">Hızlı Haberleşme</h4>\n                        </div>\n                        <div class=\"p-4 bg-slate-900/90 rounded-2xl border border-emerald-500/40 text-center space-y-2 shadow-xl\">\n                            <div class=\"w-12 h-12 bg-blue-500/20 text-blue-300 rounded-xl flex items-center justify-center text-2xl mx-auto\"><i class=\"fa-solid fa-stopwatch\"></i></div>\n                            <h4 class=\"font-black text-sm text-blue-300\">Zamandan Tasarruf</h4>\n                        </div>\n                    </div>\n                </div>\n            "},{"id":9,"title":"1. Alan: Günlük Yaşam ve Eğlence 🎮","subtitle":"Kullanım Alanları (1/11)","topic":"1. Kullanım Alanı","icon":"fa-solid fa-gamepad","bgColor":"from-pink-600 via-purple-700 to-slate-900","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-pink-500/20 text-pink-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">1. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Günlük Yaşam ve Eğlence</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-pink-100 leading-relaxed font-medium\">\n                            Boş zamanlarımızı değerlendirmek, müzik dinlemek, akıllı ev sistemlerini yönetmek ve oyun oynamak için bilişim araçlarını kullanırız.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-tv text-pink-300\"></i> Akıllı TV ve dijital yayın platformları\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-headphones text-pink-300\"></i> Çevrimiçi müzik dinleme ve eğitici oyunlar\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/teknoloji_araclar.jpg\" alt=\"Günlük Yaşam ve Eğlence\" class=\"rounded-3xl border-4 border-pink-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":10,"title":"2. Alan: Eğitim 🎓","subtitle":"Kullanım Alanları (2/11)","topic":"2. Kullanım Alanı","icon":"fa-solid fa-graduation-cap","bgColor":"from-blue-600 via-indigo-700 to-slate-900","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-blue-500/20 text-blue-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">2. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Eğitim</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-blue-100 leading-relaxed font-medium\">\n                            Okullarda akıllı tahtalar, eğitim platformları (EBA), ders videoları ve dijital kütüphaneler sayesinde öğrenme çok daha kalıcı hale gelir.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-chalkboard text-blue-300\"></i> Akıllı tahta ve etkileşimli ekranlar\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-tablet-screen-button text-blue-300\"></i> EBA ve dijital ders kitapları\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/bilgi_arastirma.jpg\" alt=\"Eğitim Alanı\" class=\"rounded-3xl border-4 border-blue-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":11,"title":"3. Alan: Ulaşım 🚗","subtitle":"Kullanım Alanları (3/11)","topic":"3. Kullanım Alanı","icon":"fa-solid fa-car-side","bgColor":"from-teal-600 via-cyan-700 to-slate-900","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-teal-500/20 text-teal-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">3. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Ulaşım</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-teal-100 leading-relaxed font-medium\">\n                            Navigasyon cihazları en kısa yolu gösterir, akıllı bilet sistemleri sıra beklemeden yolculuk yapmamızı sağlar.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-map-location-dot text-teal-300\"></i> GPS ve navigasyon harita sistemleri\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-ticket text-teal-300\"></i> Çevrimiçi bilet alma ve akıllı toplu taşıma kartları\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/ulasim_navigasyon.jpg\" alt=\"Ulaşım Alanı\" class=\"rounded-3xl border-4 border-teal-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":12,"title":"4. Alan: İletişim 📱","subtitle":"Kullanım Alanları (4/11)","topic":"4. Kullanım Alanı","icon":"fa-solid fa-tower-broadcast","bgColor":"from-blue-600 via-sky-700 to-slate-900","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-sky-500/20 text-sky-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">4. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">İletişim</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-sky-100 leading-relaxed font-medium\">\n                            Görüntülü konuşma uygulamaları, anlık mesajlaşma ve e-posta sistemleri sayesinde sevdiklerimizle kesintisiz haberleşiriz.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-video text-sky-300\"></i> Görüntülü ve sesli konferans görüşmeleri\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-envelope text-sky-300\"></i> E-posta ve anlık mesajlaşma programları\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/iletisim_ag.jpg\" alt=\"İletişim Alanı\" class=\"rounded-3xl border-4 border-sky-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":13,"title":"5. Alan: Sağlık 🏥","subtitle":"Kullanım Alanları (5/11)","topic":"5. Kullanım Alanı","icon":"fa-solid fa-heart-pulse","bgColor":"from-rose-600 via-red-700 to-slate-900","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-rose-500/20 text-rose-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">5. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Sağlık</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-rose-100 leading-relaxed font-medium\">\n                            Hastanelerde kullanılan dijital randevu sistemleri (MHRS), tahlil sonuçları ve modern tıbbi görüntüleme cihazları hayat kurtarır.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-hospital-user text-rose-300\"></i> MHRS online hastane randevusu ve e-Nabız\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-x-ray text-rose-300\"></i> Röntgen, MR ve ultrason gibi dijital tanı cihazları\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/saglik_teknoloji.jpg\" alt=\"Sağlık Alanı\" class=\"rounded-3xl border-4 border-rose-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":14,"title":"6. Alan: Güvenlik 🛡️","subtitle":"Kullanım Alanları (6/11)","topic":"6. Kullanım Alanı","icon":"fa-solid fa-shield-halved","bgColor":"from-slate-700 via-indigo-900 to-slate-950","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">6. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Güvenlik</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-indigo-100 leading-relaxed font-medium\">\n                            Şehir güvenlik kameraları (MOBESE), parmak izi okuyucular ve akıllı alarm sistemleri toplumun güvenliğini sağlar.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-camera text-indigo-300\"></i> Şehir güvenlik ve MOBESE kameraları\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-fingerprint text-indigo-300\"></i> Biyometrik kimlik doğrulama (parmak izi, yüz tanıma)\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/guvenlik_bankacilik.jpg\" alt=\"Güvenlik Alanı\" class=\"rounded-3xl border-4 border-indigo-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":15,"title":"7. Alan: Bankacılık ve Alışveriş 💳","subtitle":"Kullanım Alanları (7/11)","topic":"7. Kullanım Alanı","icon":"fa-solid fa-credit-card","bgColor":"from-emerald-700 via-teal-800 to-slate-900","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-teal-500/20 text-teal-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">7. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Bankacılık ve Alışveriş</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-teal-100 leading-relaxed font-medium\">\n                            ATM cihazları, mobil bankacılık uygulamaları ve çevrimiçi e-ticaret siteleri finansal işlemleri hızlandırır.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-money-bill-transfer text-teal-300\"></i> ATM'ler ve temassız güvenli ödeme\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-cart-shopping text-teal-300\"></i> İnternetten güvenli alışveriş ve mobil bankacılık\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/guvenlik_bankacilik.jpg\" alt=\"Bankacılık ve Alışveriş\" class=\"rounded-3xl border-4 border-teal-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":16,"title":"8. Alan: Mühendislik ve Mimari 📐","subtitle":"Kullanım Alanları (8/11)","topic":"8. Kullanım Alanı","icon":"fa-solid fa-compass-drafting","bgColor":"from-amber-700 via-orange-800 to-slate-900","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-amber-500/20 text-amber-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">8. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Mühendislik ve Mimari</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-amber-100 leading-relaxed font-medium\">\n                            Binaların, köprülerin ve makinelerin çizimi bilgisayar destekli 3 boyutlu tasarım programlarıyla sıfır hatayla yapılır.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-cubes text-amber-300\"></i> 3 Boyutlu mimari modelleme ve CAD çizimleri\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-print text-amber-300\"></i> 3D yazıcılar ile prototip üretimi\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/uretim_sanayi.jpg\" alt=\"Mühendislik ve Mimari\" class=\"rounded-3xl border-4 border-amber-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":17,"title":"9. Alan: Sinema ve Televizyon 🎬","subtitle":"Kullanım Alanları (9/11)","topic":"9. Kullanım Alanı","icon":"fa-solid fa-clapperboard","bgColor":"from-purple-700 via-pink-800 to-slate-900","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-6 space-y-4 text-left\">\n                        <div class=\"space-y-2\">\n                            <span class=\"px-3 py-1 bg-purple-500/20 text-purple-300 rounded-lg font-black text-sm sm:text-base uppercase tracking-wider font-extrabold\">9. ALAN</span>\n                            <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Sinema ve Televizyon</h3>\n                        </div>\n                        <p class=\"text-lg sm:text-xl text-purple-100 leading-relaxed font-medium\">\n                            Çizgi filmler, büyüleyici görsel efektler (CGI), ses montajları ve dijital kurgular bilişim teknolojileriyle üretilir.\n                        </p>\n                        <div class=\"space-y-2\">\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-wand-magic-sparkles text-purple-300\"></i> Bilgisayar destekli görsel efektler (CGI)\n                            </div>\n                            <div class=\"p-2.5 bg-white/10 rounded-xl border border-white/10 text-lg sm:text-xl text-white font-medium flex items-center gap-2\">\n                                <i class=\"fa-solid fa-film text-purple-300\"></i> Dijital animasyonlar ve ses montaj stüdyoları\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/tech_discover 2\">\n                                <i class=\"fa-solid fa-boxes-stacked text-yellow-300\"></i> Akıllı depo ve otomatik lojistik sistemleri\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-6 flex justify-center\">\n                        <img src=\"assets/slides/uretim_sanayi.jpg\" alt=\"Üretim ve Sanayi\" class=\"rounded-3xl border-4 border-yellow-400/30 shadow-2xl max-h-[380px] sm:max-h-[440px] md:max-h-[480px] object-cover\" />\n                    </div>\n                </div>\n            "},{"id":20,"title":"11 Kullanım Alanı Özet Şeması 🗺️","subtitle":"Toplu Bakış","topic":"Özet Tablo","icon":"fa-solid fa-sitemap","bgColor":"from-blue-800 via-indigo-900 to-slate-950","content":"\n                <div class=\"max-w-6xl mx-auto space-y-4 my-auto py-2\">\n                    <div class=\"text-center space-y-1\">\n                        <span class=\"text-xs font-black uppercase text-yellow-300 tracking-widest\">GENEL BAKIŞ</span>\n                        <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Bilişim Teknolojilerinin 11 Kullanım Alanı</h3>\n                    </div>\n                    <div class=\"grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2.5 pt-2 text-center text-xs\">\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-gamepad text-pink-400 text-lg block mb-1\"></i>1. Günlük Yaşam</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-graduation-cap text-blue-400 text-lg block mb-1\"></i>2. Eğitim</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-car text-teal-400 text-lg block mb-1\"></i>3. Ulaşım</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-tower-broadcast text-sky-400 text-lg block mb-1\"></i>4. İletişim</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-heart-pulse text-red-400 text-lg block mb-1\"></i>5. Sağlık</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-shield text-indigo-400 text-lg block mb-1\"></i>6. Güvenlik</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-credit-card text-emerald-400 text-lg block mb-1\"></i>7. Bankacılık</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-compass-drafting text-amber-400 text-lg block mb-1\"></i>8. Mimarlık</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-clapperboard text-purple-400 text-lg block mb-1\"></i>9. Sinema-TV</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10\"><i class=\"fa-solid fa-rocket text-cyan-400 text-lg block mb-1\"></i>10. Bilim-Uzay</div>\n                        <div class=\"p-3 bg-white/10 rounded-xl border border-white/10 col-span-2 sm:col-span-2\"><i class=\"fa-solid fa-industry text-yellow-400 text-lg block mb-1\"></i>11. Üretim ve Sanayi</div>\n                    </div>\n                </div>\n            "},{"id":21,"title":"1. Hafta Ders Özeti 📋","subtitle":"Neler Öğrendik?","topic":"Kavram Haritası","icon":"fa-solid fa-clipboard-check","bgColor":"from-indigo-800 via-purple-900 to-slate-950","content":"\n                <div class=\"max-w-5xl mx-auto space-y-4 my-auto py-2\">\n                    <div class=\"text-center space-y-1\">\n                        <span class=\"text-xs font-black uppercase text-yellow-300 tracking-widest\">KAVRAM HARİTASI</span>\n                        <h3 class=\"text-3xl sm:text-4xl md:text-5xl font-black text-white\">Dersimizin Özeti</h3>\n                    </div>\n                    <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm\">\n                        <div class=\"p-3.5 bg-slate-900/90 rounded-2xl border border-blue-500/40 space-y-1\">\n                            <strong class=\"text-blue-300 block text-sm\">BİLGİ & İLETİŞİM:</strong>\n                            <span class=\"text-slate-200\">Gerçeklerin öğrenilmesi ve bu bilgilerin göndericiden alıcıya aktarılması süreci.</span>\n                        </div>\n                        <div class=\"p-3.5 bg-slate-900/90 rounded-2xl border border-orange-500/40 space-y-1\">\n                            <strong class=\"text-orange-300 block text-sm\">TEKNOLOJİ & BİLİŞİM:</strong>\n                            <span class=\"text-slate-200\">Hayatı kolaylaştıran araçlar ve Bilgi + İletişim birlikteliği.</span>\n                        </div>\n                        <div class=\"p-3.5 bg-slate-900/90 rounded-2xl border border-emerald-500/40 space-y-1\">\n                            <strong class=\"text-emerald-300 block text-sm\">5 TEMEL FAYDA:</strong>\n                            <span class=\"text-slate-200\">Kolay bilgi, düşük maliyet, kolay hayat, hızlı haberleşme ve zaman tasarrufu.</span>\n                        </div>\n                        <div class=\"p-3.5 bg-slate-900/90 rounded-2xl border border-purple-500/40 space-y-1\">\n                            <strong class=\"text-purple-300 block text-sm\">11 KULLANIM ALANI:</strong>\n                            <span class=\"text-slate-200\">Eğitimden sağlığa, uzaydan sanayiye kadar hayatın her alanında BT yanımızda.</span>\n                        </div>\n                    </div>\n                </div>\n            "},{"id":22,"title":"DERSİMİZ TAMAMLANDI! 👏","subtitle":"1. Hafta Kapanış","topic":"Kapanış Mesajı","icon":"fa-solid fa-flag-checkered","bgColor":"from-blue-700 via-indigo-900 to-slate-950","content":"\n                <div class=\"grid grid-cols-1 md:grid-cols-12 gap-6 items-center max-w-6xl mx-auto my-auto py-2\">\n                    <div class=\"md:col-span-7 space-y-4 text-left\">\n                        <span class=\"px-4 py-1.5 bg-yellow-400/20 text-yellow-300 font-black text-sm sm:text-base uppercase tracking-wider font-extrabold rounded-full border border-yellow-400/40\">\n                            TEBRİKLER!\n                        </span>\n                        <h2 class=\"text-2xl sm:text-4xl font-black text-white leading-tight\">\n                            “BİLİŞİM TEKNOLOJİLERİ GÜNLÜK YAŞAMIMIZIN BİRÇOK ALANINDA KULLANILIR.”\n                        </h2>\n                        <div class=\"pt-2\">\n                            <span class=\"inline-flex items-center gap-3 px-6 py-3 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 text-yellow-300 font-bold text-base shadow-xl\">\n                                <i class=\"fa-solid fa-award text-2xl\"></i>\n                                <span>1. Hafta • Öğretmen Bozok</span>\n                            </span>\n                        </div>\n                    </div>\n                    <div class=\"md:col-span-5 flex justify-center\">\n                        <img src=\"assets/slides/tech_discovery.jpg\" alt=\"Kapanış\" class=\"rounded-3xl border-4 border-yellow-400/40 shadow-2xl max-h-[360px] sm:max-h-[400px] md:max-h-[440px] object-cover\" />\n                    </div>\n                </div>\n            "}];
        let currentSlide = 0;

        function renderSlide() {
            const s = slides[currentSlide];
            if (!s) return;

            document.getElementById('slide-title').innerHTML = s.title || ('Slayt ' + (currentSlide + 1));
            document.getElementById('slide-subtitle').innerText = s.subtitle || s.topic || '';
            document.getElementById('slide-badge').innerText = s.badge || ('KAZANIM BTY.5');
            document.getElementById('slide-number-top').innerText = 'Slayt ' + (currentSlide + 1) + ' / ' + slides.length;
            document.getElementById('slide-counter').innerText = 'Slayt ' + (currentSlide + 1) + ' / ' + slides.length;

            const iconEl = document.getElementById('slide-icon');
            iconEl.className = s.icon ? (s.icon + ' text-2xl sm:text-3xl text-indigo-400') : 'fa-solid fa-chalkboard-user text-2xl sm:text-3xl text-indigo-400';

            const bodyEl = document.getElementById('slide-body');
            bodyEl.innerHTML = s.content || '<p class="text-slate-400">Bu slayt için içerik bulunmuyor.</p>';

            const noteBox = document.getElementById('slide-note-box');
            const noteText = document.getElementById('slide-note-text');
            if (s.teacherNote) {
                noteText.innerText = s.teacherNote;
                noteBox.classList.remove('hidden');
            } else {
                noteBox.classList.add('hidden');
            }

            // Buton durumları
            document.getElementById('btn-prev').disabled = (currentSlide === 0);
            document.getElementById('btn-next').disabled = (currentSlide === slides.length - 1);

            // Progress bar
            const percent = ((currentSlide + 1) / slides.length) * 100;
            document.getElementById('slide-progress-bar').style.width = percent + '%';

            // Sahne arkaplan gradyanı
            const stage = document.getElementById('slide-stage');
            if (s.gradient || s.bgColor) {
                stage.className = 'w-full max-w-5xl bg-gradient-to-br ' + (s.gradient || s.bgColor) + ' rounded-2xl sm:rounded-3xl border-2 border-indigo-500/30 shadow-2xl p-5 sm:p-8 md:p-10 flex flex-col justify-between min-h-[500px] sm:min-h-[580px] transition-all';
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(idx) {
            currentSlide = idx;
            renderSlide();
            toggleDrawer(false);
        }

        function toggleDrawer(force) {
            const d = document.getElementById('slide-drawer');
            if (force !== undefined) {
                if (force) d.classList.remove('hidden'); else d.classList.add('hidden');
            } else {
                d.classList.toggle('hidden');
            }
            if (!d.classList.contains('hidden')) {
                buildDrawerList();
            }
        }

        function buildDrawerList() {
            const list = document.getElementById('drawer-slide-list');
            list.innerHTML = slides.map((s, idx) => {
                const active = (idx === currentSlide) ? 'bg-indigo-600 text-white font-black' : 'bg-slate-800 hover:bg-slate-700 text-slate-300';
                return '<button onclick="goToSlide(' + idx + ')" class="w-full text-left p-3 rounded-xl ' + active + ' text-xs sm:text-sm flex items-center justify-between transition">' +
                       '<span class="truncate"><b>' + (idx + 1) + '.</b> ' + (s.title || 'Slayt') + '</span>' +
                       '<i class="fa-solid fa-chevron-right text-xs opacity-60"></i>' +
                       '</button>';
            }).join('');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Klavye tuş kontrolleri
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullScreen();
            } else if (e.key === 'Escape') {
                toggleDrawer(false);
            }
        });

        // Başlangıç
        renderSlide();
    </script>
