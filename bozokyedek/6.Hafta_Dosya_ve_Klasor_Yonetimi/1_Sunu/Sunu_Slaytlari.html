rimlere <strong>DOSYA</strong> denir. Tıpkı bir defter yaprağı gibi! Her dosya belirli bir türdeki içeriği içinde barındırır.\n                    </p>\n                </div>\n\n                <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3 text-center\">\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-blue-500/40 shadow-md\">\n                        <div class=\"text-2xl mb-1\">📝</div>\n                        <div class=\"font-bold text-sm text-white\">Metin Dosyaları</div>\n                        <div class=\"text-xs text-slate-400\">Ödev, dilekçe, not</div>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-purple-500/40 shadow-md\">\n                        <div class=\"text-2xl mb-1\">🖼️</div>\n                        <div class=\"font-bold text-sm text-white\">Görsel / Resim</div>\n                        <div class=\"text-xs text-slate-400\">Fotoğraf, afiş</div>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-amber-500/40 shadow-md\">\n                        <div class=\"text-2xl mb-1\">🎵</div>\n                        <div class=\"font-bold text-sm text-white\">Ses / Müzik</div>\n                        <div class=\"text-xs text-slate-400\">Şarkı, ses kaydı</div>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-rose-500/40 shadow-md\">\n                        <div class=\"text-2xl mb-1\">🎬</div>\n                        <div class=\"font-bold text-sm text-white\">Video / Film</div>\n                        <div class=\"text-xs text-slate-400\">Çizgi film, ders videosu</div>\n                    </div>\n                </div>\n            </div>\n        "},{"id":4,"title":"Dosya Adı ve Uzantısı (Soyadı) 🏷️","subtitle":"Bir Dosyanın 3 Parçalı Kimliği","topic":"6. KONU • BTY.5.1.6","badge":"DOSYA YAPISI","icon":"fa-solid fa-signature","bgColor":"from-slate-900 via-indigo-950 to-purple-950","gradient":"from-slate-900 via-indigo-950 to-purple-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-6 my-auto text-center\">\n                <div class=\"p-8 rounded-3xl bg-slate-850 border-2 border-indigo-500/40 shadow-2xl space-y-6\">\n                    <div class=\"inline-flex items-center justify-center gap-2 p-4 bg-slate-950 rounded-2xl border-2 border-dashed border-slate-700 font-mono text-xl sm:text-3xl font-black\">\n                        <span class=\"text-cyan-400 px-3 py-1 bg-cyan-950/60 rounded-xl\">Ali Babanın Çiftliği</span>\n                        <span class=\"text-yellow-400 text-4xl\">.</span>\n                        <span class=\"text-purple-400 px-3 py-1 bg-purple-950/60 rounded-xl\">mp3</span>\n                    </div>\n\n                    <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4 text-left\">\n                        <div class=\"p-4 rounded-2xl bg-slate-900/90 border-t-4 border-cyan-400\">\n                            <h4 class=\"font-black text-cyan-300 text-sm mb-1\">1. Dosya Adı (Biz Veririz)</h4>\n                            <p class=\"text-xs text-slate-300 leading-relaxed\">\n                                Dosyanın neyle ilgili olduğunu anlatır. Örneğin: <em>\"Ali Babanın Çiftliği\"</em>. İstediğimiz zaman değiştirebiliriz.\n                            </p>\n                        </div>\n                        <div class=\"p-4 rounded-2xl bg-slate-900/90 border-t-4 border-purple-400\">\n                            <h4 class=\"font-black text-purple-300 text-sm mb-1\">2. Dosya Uzantısı (Soyadı)</h4>\n                            <p class=\"text-xs text-slate-300 leading-relaxed\">\n                                Noktadan sonraki 3-4 harftir. <strong>Dosyanın türünü</strong> ve hangi programla açılacağını işletim sistemine söyler.\n                            </p>\n                        </div>\n                    </div>\n\n                    <div class=\"p-3 bg-yellow-950/30 border border-yellow-500/40 rounded-xl text-xs sm:text-sm text-yellow-200 font-bold\">\n                        ⭐ Nokta (.) dosya adı ile uzantıyı birbirinden ayıran sihirli köprüdür!\n                    </div>\n                </div>\n            </div>\n        "},{"id":5,"title":"Popüler Dosya Uzantıları & Sınıflandırma 🗃️","subtitle":"Hangi Uzantı Hangi Dosya Türüne Aittir?","topic":"6. KONU • BTY.5.1.6","badge":"UZANTI LİSTESİ","icon":"fa-solid fa-list-check","bgColor":"from-slate-900 via-indigo-950 to-slate-950","gradient":"from-slate-900 via-indigo-950 to-slate-950","content":"\n            <div class=\"max-w-5xl mx-auto space-y-3.5 my-auto text-left\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3\">\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-blue-500/40\">\n                        <div class=\"flex items-center gap-2 text-cyan-300 font-black text-sm mb-1.5\">\n                            <span>📝</span> <span>Yazı / Belge</span>\n                        </div>\n                        <div class=\"text-xs text-slate-300 font-mono space-y-0.5\">\n                            <div><strong>.docx / .doc:</strong> Word Belgesi</div>\n                            <div><strong>.txt:</strong> Düz Metin Belgesi</div>\n                            <div><strong>.pdf:</strong> Elektronik Kitap / Belge</div>\n                        </div>\n                    </div>\n\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-purple-500/40\">\n                        <div class=\"flex items-center gap-2 text-purple-300 font-black text-sm mb-1.5\">\n                            <span>🖼️</span> <span>Görsel / Resim</span>\n                        </div>\n                        <div class=\"text-xs text-slate-300 font-mono space-y-0.5\">\n                            <div><strong>.jpg / .jpeg:</strong> Fotoğraf / Resim</div>\n                            <div><strong>.png:</strong> Şeffaf Arka Planlı Resim</div>\n                            <div><strong>.gif:</strong> Hareketli Resim (Animasyon)</div>\n                        </div>\n                    </div>\n\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-amber-500/40\">\n                        <div class=\"flex items-center gap-2 text-amber-300 font-black text-sm mb-1.5\">\n                            <span>🎵</span> <span>Ses / Müzik</span>\n                        </div>\n                        <div class=\"text-xs text-slate-300 font-mono space-y-0.5\">\n                            <div><strong>.mp3:</strong> Dijital Müzik Dosyası</div>\n                            <div><strong>.wav:</strong> Ham Ses Kaydı</div>\n                            <div><strong>.wma:</strong> Windows Medya Sesi</div>\n                        </div>\n                    </div>\n\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-rose-500/40\">\n                        <div class=\"flex items-center gap-2 text-rose-300 font-black text-sm mb-1.5\">\n                            <span>🎬</span> <span>Video / Film</span>\n                        </div>\n                        <div class=\"text-xs text-slate-300 font-mono space-y-0.5\">\n                            <div><strong>.mp4:</strong> Standart Video Dosyası</div>\n                            <div><strong>.avi:</strong> Yüksek Kaliteli Film</div>\n                            <div><strong>.mov:</strong> Apple Video Dosyası</div>\n                        </div>\n                    </div>\n\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-emerald-500/40\">\n                        <div class=\"flex items-center gap-2 text-emerald-300 font-black text-sm mb-1.5\">\n                            <span>🗜️</span> <span>Sıkıştırılmış Arşiv</span>\n                        </div>\n                        <div class=\"text-xs text-slate-300 font-mono space-y-0.5\">\n                            <div><strong>.zip:</strong> Sıkıştırılmış Klasör</div>\n                            <div><strong>.rar:</strong> WinRAR Arşiv Dosyası</div>\n                        </div>\n                    </div>\n\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-teal-500/40\">\n                        <div class=\"flex items-center gap-2 text-teal-300 font-black text-sm mb-1.5\">\n                            <span>⚙️</span> <span>Uygulama / Program</span>\n                        </div>\n                        <div class=\"text-xs text-slate-300 font-mono space-y-0.5\">\n                            <div><strong>.exe:</strong> Windows Kurulum Dosyası</div>\n                            <div><strong>.apk:</strong> Android Mobil Uygulama</div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n        "},{"id":6,"title":"Klasör (Dizin / Folder) Nedir? 📁","subtitle":"Dijital Çekmeceler ve Düzen","topic":"6. KONU • BTY.5.1.6","badge":"HİYERARŞİ","icon":"fa-solid fa-folder","bgColor":"from-slate-900 via-indigo-950 to-slate-900","gradient":"from-slate-900 via-indigo-950 to-slate-900","content":"\n            <div class=\"max-w-4xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-amber-500/40 space-y-3\">\n                        <div class=\"flex items-center gap-2 font-black text-amber-300 text-base\">\n                            <span>📁</span> <span>Klasör (Dizin)</span>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Ortak özelliğe sahip dosyaları bir arada topladığımız sarı simgeli birimlere <strong>KLASÖR</strong> denir. Klasörlerin dosya uzantısı (soyadı) <strong>OLMAZ</strong>!\n                        </p>\n                        <div class=\"p-3 bg-slate-900/60 rounded-xl text-xs text-slate-400\">\n                            💡 <em>Ödevler, Resimler, Müzikler klasörleri gibi!</em>\n                        </div>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-cyan-500/40 space-y-3\">\n                        <div class=\"flex items-center gap-2 font-black text-cyan-300 text-base\">\n                            <span>✨</span> <span>Neden Klasör Kullanırız?</span>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Masaüstünde yüzlerce dosyanın birbirine karışmasını engeller. Aradığımız herhangi bir ödeve veya şarkıya saniyeler içinde ulaşmamızı sağlar.\n                        </p>\n                        <div class=\"p-3 bg-emerald-950/40 border border-emerald-500/30 rounded-xl text-xs text-emerald-300 font-bold\">\n                            Düzenli Klasör = Hızlı ve Başarılı Çalışma!\n                        </div>\n                    </div>\n                </div>\n            </div>\n        "},{"id":7,"title":"Alt Klasör (Subfolder) ve Ağaç Yapısı 🌳","subtitle":"İç İçe Klasörleme Düzeni","topic":"6. KONU • BTY.5.1.6","badge":"AĞAÇ YAPISI","icon":"fa-solid fa-folder-tree","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-purple-500/40 space-y-3\">\n                        <div class=\"flex items-center gap-2 font-black text-purple-300 text-base\">\n                            <span>🌳</span> <span>Alt Klasör Tanımı</span>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Bir klasörün içine açılan yeni klasöre <strong>ALT KLASÖR</strong> denir. Böylece hiyerarşik bir ağaç yapısı kurulur.\n                        </p>\n                        <p class=\"text-xs text-slate-400\">\n                            Tıpkı bir okul dolabının içindeki ders bölmeleri gibi!\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-900/90 border-2 border-slate-700 font-mono text-xs sm:text-sm text-cyan-300 space-y-1\">\n                        <div class=\"text-yellow-400 font-bold\">📁 OKUL (Ana Klasör)</div>\n                        <div class=\"pl-4 text-purple-300\">├── 📁 Ödevler (Alt Klasör)</div>\n                        <div class=\"pl-8 text-slate-400\">│   ├── 📄 Bilisim_Odevi.docx</div>\n                        <div class=\"pl-8 text-slate-400\">│   └── 📄 Matematik.pdf</div>\n                        <div class=\"pl-4 text-purple-300\">├── 📁 Resimler (Alt Klasör)</div>\n                        <div class=\"pl-8 text-slate-400\">│   └── 🖼️ 23_Nisan.jpg</div>\n                        <div class=\"pl-4 text-purple-300\">└── 📁 Projeler (Alt Klasör)</div>\n                    </div>\n                </div>\n            </div>\n        "},{"id":8,"title":"Adım Adım Yeni Klasör Oluşturma 🖱️","subtitle":"4 Kolay Adımda Yeni Bir Klasör Aç","topic":"6. KONU • BTY.5.1.6","badge":"UYGULAMA ADIMI","icon":"fa-solid fa-folder-plus","bgColor":"from-slate-900 via-blue-950 to-indigo-950","gradient":"from-slate-900 via-blue-950 to-indigo-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-5 my-auto text-center\">\n                <h3 class=\"text-xl font-black text-white\">Fareyle Yeni Klasör Oluşturma Adımları:</h3>\n                <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-3 text-left\">\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-cyan-500/40 space-y-2\">\n                        <span class=\"w-8 h-8 rounded-full bg-cyan-500/20 text-cyan-300 flex items-center justify-center font-black text-sm\">1</span>\n                        <h4 class=\"font-bold text-sm text-white\">Boş Yere Sağ Tık</h4>\n                        <p class=\"text-xs text-slate-400\">Masaüstünde veya pencerede boş bir alana sağ tıklanır.</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-purple-500/40 space-y-2\">\n                        <span class=\"w-8 h-8 rounded-full bg-purple-500/20 text-purple-300 flex items-center justify-center font-black text-sm\">2</span>\n                        <h4 class=\"font-bold text-sm text-white\">\"Yeni\"ye Gel</h4>\n                        <p class=\"text-xs text-slate-400\">Açılan menüde fare 'Yeni' seçeneğinin üzerine getirilir.</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-amber-500/40 space-y-2\">\n                        <span class=\"w-8 h-8 rounded-full bg-amber-500/20 text-amber-300 flex items-center justify-center font-black text-sm\">3</span>\n                        <h4 class=\"font-bold text-sm text-white\">\"Klasör\" Seç</h4>\n                        <p class=\"text-xs text-slate-400\">Açılan alt menüden 'Klasör' seçeneğine sol tıklanır.</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-emerald-500/40 space-y-2\">\n                        <span class=\"w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-300 flex items-center justify-center font-black text-sm\">4</span>\n                        <h4 class=\"font-bold text-sm text-white\">İsim Yaz & Enter</h4>\n                        <p class=\"text-xs text-slate-400\">Klasöre bir ad verilir ve Enter tuşuna basılır.</p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":9,"title":"Temel Dosya ve Klasör İşlemleri 🛠️","subtitle":"5 Ana Dosya Yönetimi Hamlesi","topic":"6. KONU • BTY.5.1.6","badge":"TEMEL İŞLEMLER","icon":"fa-solid fa-sliders","bgColor":"from-slate-900 via-indigo-950 to-slate-900","gradient":"from-slate-900 via-indigo-950 to-slate-900","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-2 sm:grid-cols-3 gap-3 text-center\">\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-cyan-500/40 space-y-1\">\n                        <div class=\"text-2xl\">✨</div>\n                        <h4 class=\"font-bold text-sm text-cyan-300\">1. Oluşturma</h4>\n                        <p class=\"text-xs text-slate-400\">İhtiyaç duyulan yeni bir dosya veya klasör açma.</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-yellow-500/40 space-y-1\">\n                        <div class=\"text-2xl\">📋</div>\n                        <h4 class=\"font-bold text-sm text-yellow-300\">2. Kopyalama</h4>\n                        <p class=\"text-xs text-slate-400\">Dosyanın ikizini üretme; aslı yerinde kalır!</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-emerald-500/40 space-y-1\">\n                        <div class=\"text-2xl\">🚚</div>\n                        <h4 class=\"font-bold text-sm text-emerald-300\">3. Taşıma (Kesme)</h4>\n                        <p class=\"text-xs text-slate-400\">Dosyayı eski yerinden alıp yeni yere götürme.</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-purple-500/40 space-y-1\">\n                        <div class=\"text-2xl\">✏️</div>\n                        <h4 class=\"font-bold text-sm text-purple-300\">4. Yeniden Adlandırma</h4>\n                        <p class=\"text-xs text-slate-400\">Dosya içeriği değişmeden ismini değiştirme (F2).</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-rose-500/40 space-y-1\">\n                        <div class=\"text-2xl\">🗑️</div>\n                        <h4 class=\"font-bold text-sm text-rose-300\">5. Silme</h4>\n                        <p class=\"text-xs text-slate-400\">Gerekmeyen dosyayı çöp kutusuna gönderme (Delete).</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-blue-500/40 space-y-1\">\n                        <div class=\"text-2xl\">🔍</div>\n                        <h4 class=\"font-bold text-sm text-blue-300\">6. Arama</h4>\n                        <p class=\"text-xs text-slate-400\">Aradığın dosyayı saniyeler içinde bulma.</p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":10,"title":"Kopyalama ile Taşıma Arasındaki Fark ⚖️","subtitle":"En Çok Karıştırılan İki Temel İşlem","topic":"6. KONU • BTY.5.1.6","badge":"KARŞILAŞTIRMA","icon":"fa-solid fa-code-compare","bgColor":"from-slate-900 via-indigo-950 to-blue-950","gradient":"from-slate-900 via-indigo-950 to-blue-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-5 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-yellow-500/40 space-y-3\">\n                        <div class=\"flex items-center gap-2 font-black text-yellow-300 text-base\">\n                            <span>📋</span> <span>KOPYALAMA (Copy)</span>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Dosyanın bir örneğini (ikizini) oluşturur. Dosya hem <strong>eski yerinde</strong> kalır hem de <strong>yeni yere</strong> yapıştırılır. Dosya sayısı 2 olur.\n                        </p>\n                        <div class=\"p-3 bg-yellow-950/40 rounded-xl font-mono text-xs text-yellow-200\">\n                            Kısayol: Ctrl + C ve Ctrl + V\n                        </div>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-emerald-500/40 space-y-3\">\n                        <div class=\"flex items-center gap-2 font-black text-emerald-300 text-base\">\n                            <span>🚚</span> <span>TAŞIMA / KESME (Move / Cut)</span>\n                        </div>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Dosyayı bulunduğu yerden tamamen alır ve başka bir klasöre aktarır. Dosya eski yerinden <strong>SİLİNİR</strong>, sadece yeni yerinde bulunur. Dosya sayısı 1 kalır.\n                        </p>\n                        <div class=\"p-3 bg-emerald-950/40 rounded-xl font-mono text-xs text-emerald-200\">\n                            Kısayol: Ctrl + X ve Ctrl + V\n                        </div>\n                    </div>\n                </div>\n            </div>\n        "},{"id":11,"title":"Klavye Kısayolları Ustası ⌨️","subtitle":"İşleri 10 Kat Hızlandıran Sihirli Tuşlar","topic":"6. KONU • BTY.5.1.6","badge":"KISAYOLLAR","icon":"fa-solid fa-keyboard","bgColor":"from-slate-900 via-purple-950 to-indigo-950","gradient":"from-slate-900 via-purple-950 to-indigo-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-2 sm:grid-cols-3 gap-3\">\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-cyan-500/40\">\n                        <span class=\"px-2.5 py-1 bg-slate-950 rounded-lg text-cyan-400 font-mono font-bold text-xs\">Ctrl + C</span>\n                        <h4 class=\"font-bold text-sm text-white mt-2\">Kopyala</h4>\n                        <p class=\"text-xs text-slate-400\">Hafızaya kopyalar.</p>\n                    </div>\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-emerald-500/40\">\n                        <span class=\"px-2.5 py-1 bg-slate-950 rounded-lg text-emerald-400 font-mono font-bold text-xs\">Ctrl + X</span>\n                        <h4 class=\"font-bold text-sm text-white mt-2\">Kes (Taşı)</h4>\n                        <p class=\"text-xs text-slate-400\">Eski yerinden söker.</p>\n                    </div>\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-purple-500/40\">\n                        <span class=\"px-2.5 py-1 bg-slate-950 rounded-lg text-purple-400 font-mono font-bold text-xs\">Ctrl + V</span>\n                        <h4 class=\"font-bold text-sm text-white mt-2\">Yapıştır</h4>\n                        <p class=\"text-xs text-slate-400\">Yeni yere aktarır.</p>\n                    </div>\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-yellow-500/40\">\n                        <span class=\"px-2.5 py-1 bg-slate-950 rounded-lg text-yellow-400 font-mono font-bold text-xs\">Ctrl + Z</span>\n                        <h4 class=\"font-bold text-sm text-white mt-2\">Geri Al (Undo)</h4>\n                        <p class=\"text-xs text-slate-400\">Hatalı işlemi iptal eder.</p>\n                    </div>\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-blue-500/40\">\n                        <span class=\"px-2.5 py-1 bg-slate-950 rounded-lg text-blue-400 font-mono font-bold text-xs\">Ctrl + Y</span>\n                        <h4 class=\"font-bold text-sm text-white mt-2\">Yinele (Redo)</h4>\n                        <p class=\"text-xs text-slate-400\">Geri alınanı tekrarlar.</p>\n                    </div>\n                    <div class=\"p-3.5 rounded-2xl bg-slate-850 border-2 border-rose-500/40\">\n                        <span class=\"px-2.5 py-1 bg-slate-950 rounded-lg text-rose-400 font-mono font-bold text-xs\">Delete Tuşu</span>\n                        <h4 class=\"font-bold text-sm text-white mt-2\">Sil</h4>\n                        <p class=\"text-xs text-slate-400\">Çöp kutusuna gönderir.</p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":12,"title":"Dosya Silme ve Geri Dönüşüm Kutusu 🗑️","subtitle":"Silinen Dosyalar Tamamen Yok Olur Mu?","topic":"6. KONU • BTY.5.1.6","badge":"GÜVENLİK","icon":"fa-solid fa-trash-can","bgColor":"from-slate-900 via-rose-950 to-slate-950","gradient":"from-slate-900 via-rose-950 to-slate-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-rose-500/40 space-y-2\">\n                        <h4 class=\"font-black text-rose-300 text-sm flex items-center gap-2\">\n                            <span>🗑️</span> <span>Geri Dönüşüm Kutusu Nedir?</span>\n                        </h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Delete tuşuyla silinen dosyalar ilk önce <strong>Geri Dönüşüm Kutusu</strong>'na gider. Henüz tamamen yok olmamıştır!\n                        </p>\n                        <p class=\"text-xs text-slate-400\">\n                            Yanlışlıkla sildiyseniz sağ tıklayıp <strong>\"Geri Yükle\"</strong> seçeneğini seçebilirsiniz.\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-amber-500/40 space-y-2\">\n                        <h4 class=\"font-black text-amber-300 text-sm flex items-center gap-2\">\n                            <span>⚠️</span> <span>Kritik Bilişim Kuralı</span>\n                        </h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Geri Dönüşüm Kutusu <strong>boşaltılırsa</strong> veya dosya <strong>Shift + Delete</strong> ile silinirse dosya kalıcı olarak kaybolur. Kalıcı silinen dosyaların kurtarılması garanti değildir!\n                        </p>\n                        <div class=\"p-2.5 bg-rose-950/40 border border-rose-500/30 rounded-xl text-xs text-rose-200 font-bold\">\n                            Önemli dosyalarınızı mutlaka USB veya Bulutta yedekleyin!\n                        </div>\n                    </div>\n                </div>\n            </div>\n        "},{"id":13,"title":"Joker Karakterlerle Dosya Arama (*) 🔍","subtitle":"Yıldız (*) Simgesiyle Sihirli Aramalar","topic":"6. KONU • BTY.5.1.6","badge":"ARAMA TEKNİĞİ","icon":"fa-solid fa-magnifying-glass","bgColor":"from-slate-900 via-indigo-950 to-cyan-950","gradient":"from-slate-900 via-indigo-950 to-cyan-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"p-4 bg-slate-850 rounded-2xl border-2 border-cyan-500/40 text-center\">\n                    <p class=\"text-xs sm:text-sm text-cyan-200\">\n                        Arama kutusundaki <strong>yıldız (*)</strong> simgesi <em>\"herhangi bir yazı veya ek\"</em> anlamına gelir.\n                    </p>\n                </div>\n\n                <div class=\"grid grid-cols-1 sm:grid-cols-3 gap-3\">\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-slate-700 space-y-2\">\n                        <span class=\"px-3 py-1 bg-cyan-950 border border-cyan-500 rounded-lg text-cyan-300 font-mono font-bold text-sm block text-center\">*.mp4</span>\n                        <h4 class=\"font-bold text-xs text-white\">Tüm Videolar</h4>\n                        <p class=\"text-xs text-slate-400\">Adı ne olursa olsun bilgisayardaki tüm .mp4 video dosyalarını listeler.</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-slate-700 space-y-2\">\n                        <span class=\"px-3 py-1 bg-yellow-950 border border-yellow-500 rounded-lg text-yellow-300 font-mono font-bold text-sm block text-center\">Bil*.docx</span>\n                        <h4 class=\"font-bold text-xs text-white\">\"Bil\" ile Başlayanlar</h4>\n                        <p class=\"text-xs text-slate-400\">Adı 'Bil' ile başlayan tüm Word (.docx) belgelerini bulur (Bilisim.docx vb.).</p>\n                    </div>\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-slate-700 space-y-2\">\n                        <span class=\"px-3 py-1 bg-purple-950 border border-purple-500 rounded-lg text-purple-300 font-mono font-bold text-sm block text-center\">odev.*</span>\n                        <h4 class=\"font-bold text-xs text-white\">Adı \"odev\" Olanlar</h4>\n                        <p class=\"text-xs text-slate-400\">Uzantısı ne olursa olsun adı 'odev' olan tüm dosyaları (odev.pdf, odev.txt vb.) bulur.</p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":14,"title":"Dosya ve Klasör Sıkıştırma Nedir? 🗜️","subtitle":"Bavula Eşyaları Düzenlice Sığdırmak Gibi!","topic":"6. KONU • BTY.5.1.6","badge":"ARŞİVLEME","icon":"fa-solid fa-file-zipper","bgColor":"from-slate-900 via-purple-950 to-slate-900","gradient":"from-slate-900 via-purple-950 to-slate-900","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-purple-500/40 space-y-3\">\n                        <h4 class=\"font-black text-purple-300 text-sm flex items-center gap-2\">\n                            <span>📦</span> <span>Sıkıştırma (Arşivleme)</span>\n                        </h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Dosyaların boyutunu özel algoritmalarla <strong>küçülterek</strong> diskte daha az yer kaplamasını sağlamaya ve birden fazla dosyayı <strong>tek bir paket</strong> içinde toplamaya <strong>SIKIŞTIRMA</strong> denir.\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-cyan-500/40 space-y-3\">\n                        <h4 class=\"font-black text-cyan-300 text-sm flex items-center gap-2\">\n                            <span>🗜️</span> <span>En Popüler Arşiv Uzantıları</span>\n                        </h4>\n                        <div class=\"space-y-2 font-mono text-xs sm:text-sm\">\n                            <div class=\"p-2 bg-slate-900 rounded-xl text-yellow-300\"><strong>.ZIP:</strong> Tüm işletim sistemlerinde doğrudan açılır.</div>\n                            <div class=\"p-2 bg-slate-900 rounded-xl text-purple-300\"><strong>.RAR:</strong> WinRAR programıyla oluşturulan güçlü arşiv.</div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n        "},{"id":15,"title":"Sıkıştırmanın 2 Büyük Faydası 💡","subtitle":"Neden Dosyalarımızı Sıkıştırırız?","topic":"6. KONU • BTY.5.1.6","badge":"FAYDALAR","icon":"fa-solid fa-gauge-high","bgColor":"from-slate-900 via-emerald-950 to-indigo-950","gradient":"from-slate-900 via-emerald-950 to-indigo-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-emerald-500/40 space-y-2\">\n                        <div class=\"text-3xl\">💾</div>\n                        <h4 class=\"font-black text-emerald-300 text-base\">1. Disk Alanından Tasarruf</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Dosyaların boyutu küçüldüğü için sabit diskte, flash bellekte veya telefonumuzda daha az yer kaplar. Hafıza dolmaz!\n                        </p>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-cyan-500/40 space-y-2\">\n                        <div class=\"text-3xl\">🚀</div>\n                        <h4 class=\"font-black text-cyan-300 text-base\">2. Hızlı ve Kolay Paylaşım</h4>\n                        <p class=\"text-xs sm:text-sm text-slate-300 leading-relaxed\">\n                            Örneğin 50 ayrı fotoğrafı tek tek e-posta ile göndermek yerine, hepsini tek bir <strong>.zip paketi</strong> yapıp bir saniyede gönderebiliriz.\n                        </p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":16,"title":"Depolama Araçları ve Sınıflandırma 💽","subtitle":"Dosyalarımız Nerede Yaşar?","topic":"6. KONU • BTY.5.1.6","badge":"DEPOLAMA","icon":"fa-solid fa-hard-drive","bgColor":"from-slate-900 via-blue-950 to-slate-950","gradient":"from-slate-900 via-blue-950 to-slate-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-3 gap-3 text-center\">\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-cyan-500/40 space-y-2\">\n                        <div class=\"text-3xl\">🖥️</div>\n                        <h4 class=\"font-bold text-sm text-cyan-300\">Dahili (İç) Depolama</h4>\n                        <p class=\"text-xs text-slate-300 font-semibold\">SSD ve Sabit Disk (HDD)</p>\n                        <p class=\"text-xs text-slate-400\">Bilgisayarın içinde sürekli takılı olan ana hafızadır.</p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-yellow-500/40 space-y-2\">\n                        <div class=\"text-3xl\">🔌</div>\n                        <h4 class=\"font-bold text-sm text-yellow-300\">Harici (Taşınabilir)</h4>\n                        <p class=\"text-xs text-slate-300 font-semibold\">USB Bellek, SD Kart, Harici Disk</p>\n                        <p class=\"text-xs text-slate-400\">Cebimizde taşıyıp başka bilgisayara taktığımız bellekler.</p>\n                    </div>\n\n                    <div class=\"p-4 rounded-2xl bg-slate-850 border-2 border-purple-500/40 space-y-2\">\n                        <div class=\"text-3xl\">☁️</div>\n                        <h4 class=\"font-bold text-sm text-purple-300\">Bulut Depolama</h4>\n                        <p class=\"text-xs text-slate-300 font-semibold\">Drive, OneDrive, iCloud</p>\n                        <p class=\"text-xs text-slate-400\">İnternet üzerinden her cihazdan eriştiğimiz güvenli alan.</p>\n                    </div>\n                </div>\n            </div>\n        "},{"id":17,"title":"Basılı Belgeleri Dijitale Aktarma 📠","subtitle":"Kâğıttan Ekrana Veri Köprüsü","topic":"6. KONU • BTY.5.1.6","badge":"DİJİTALLEŞME","icon":"fa-solid fa-print","bgColor":"from-slate-900 via-indigo-950 to-teal-950","gradient":"from-slate-900 via-indigo-950 to-teal-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-teal-500/40 space-y-3\">\n                    <h4 class=\"font-black text-teal-300 text-sm flex items-center gap-2\">\n                        <span>📸</span> <span>Tarayıcı (Scanner) ve Kameralar</span>\n                    </h4>\n                    <p class=\"text-xs sm:text-sm text-slate-200 leading-relaxed\">\n                        Kâğıt üzerindeki resim, el yazısı, belge veya kitap sayfalarını dijital ortama aktarmak için <strong>Tarayıcı (Scanner)</strong> veya tablet/telefon kameraları kullanılır.\n                    </p>\n                    <p class=\"text-xs text-slate-400\">\n                        Bu işlem sonucunda basılı belge bilgisayarımızda <strong>.PDF</strong> veya <strong>.JPG</strong> formatında bir dijital dosyaya dönüşür.\n                    </p>\n                </div>\n            </div>\n        "},{"id":18,"title":"İnteraktif Sınıf Eşleştirmesi 🎯","subtitle":"Uzantıyı Seç, Doğru Dosya Türüne Dokun!","topic":"6. KONU • BTY.5.1.6","badge":"İNTERAKTİF ETKİNLİK","icon":"fa-solid fa-gamepad","bgColor":"from-slate-900 via-indigo-950 to-slate-900","gradient":"from-slate-900 via-indigo-950 to-slate-900","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"text-center\">\n                    <span class=\"text-xs font-bold text-yellow-300 bg-yellow-400/20 px-3 py-1 rounded-full border border-yellow-400/30\">\n                        AKILLI TAHTA CANLI EŞLEŞTİRME\n                    </span>\n                    <p class=\"text-xs sm:text-sm text-indigo-200 mt-1\">Önce sol taraftan bir uzantıya dokun, ardından sağ taraftaki doğru dosya türünü seç!</p>\n                </div>\n\n                <div class=\"grid grid-cols-2 gap-4\">\n                    <!-- Sol: Uzantılar -->\n                    <div class=\"space-y-2\">\n                        <div class=\"text-xs font-black text-cyan-400 text-center uppercase tracking-wider mb-1\">DOSYA UZANTILARI</div>\n                        <button onclick=\"window.slide18MatchGame.selectLeft('doc', '.docx', this)\" class=\"s18-left-btn w-full p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-mono font-bold text-xs sm:text-sm text-white flex items-center justify-between\">\n                            <span>.docx</span> <span class=\"text-[10px] text-slate-400\">Belge</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectLeft('jpg', '.jpg', this)\" class=\"s18-left-btn w-full p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-mono font-bold text-xs sm:text-sm text-white flex items-center justify-between\">\n                            <span>.jpg</span> <span class=\"text-[10px] text-slate-400\">Resim</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectLeft('mp3', '.mp3', this)\" class=\"s18-left-btn w-full p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-mono font-bold text-xs sm:text-sm text-white flex items-center justify-between\">\n                            <span>.mp3</span> <span class=\"text-[10px] text-slate-400\">Müzik</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectLeft('mp4', '.mp4', this)\" class=\"s18-left-btn w-full p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-mono font-bold text-xs sm:text-sm text-white flex items-center justify-between\">\n                            <span>.mp4</span> <span class=\"text-[10px] text-slate-400\">Video</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectLeft('zip', '.zip', this)\" class=\"s18-left-btn w-full p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-mono font-bold text-xs sm:text-sm text-white flex items-center justify-between\">\n                            <span>.zip</span> <span class=\"text-[10px] text-slate-400\">Arşiv</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectLeft('exe', '.exe', this)\" class=\"s18-left-btn w-full p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-mono font-bold text-xs sm:text-sm text-white flex items-center justify-between\">\n                            <span>.exe</span> <span class=\"text-[10px] text-slate-400\">Program</span>\n                        </button>\n                    </div>\n\n                    <!-- Sağ: Dosya Türleri -->\n                    <div class=\"space-y-2\">\n                        <div class=\"text-xs font-black text-purple-400 text-center uppercase tracking-wider mb-1\">DOSYA TÜRLERİ</div>\n                        <button onclick=\"window.slide18MatchGame.selectRight('mp3', 'Ses / Müzik', this)\" class=\"s18-right-btn w-full p-2.5 rounded-xl bg-slate-850 hover:bg-indigo-900/60 border border-slate-700 font-bold text-xs sm:text-sm text-white flex items-center gap-2\">\n                            <span>🎵</span> <span>Ses / Müzik</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectRight('doc', 'Metin / Yazı Belgesi', this)\" class=\"s18-right-btn w-full p-2.5 rounded-xl bg-slate-850 hover:bg-indigo-900/60 border border-slate-700 font-bold text-xs sm:text-sm text-white flex items-center gap-2\">\n                            <span>📝</span> <span>Metin / Yazı Belgesi</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectRight('exe', 'Uygulama / Program', this)\" class=\"s18-right-btn w-full p-2.5 rounded-xl bg-slate-850 hover:bg-indigo-900/60 border border-slate-700 font-bold text-xs sm:text-sm text-white flex items-center gap-2\">\n                            <span>⚙️</span> <span>Uygulama / Program</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectRight('zip', 'Sıkıştırılmış Dosya', this)\" class=\"s18-right-btn w-full p-2.5 rounded-xl bg-slate-850 hover:bg-indigo-900/60 border border-slate-700 font-bold text-xs sm:text-sm text-white flex items-center gap-2\">\n                            <span>🗜️</span> <span>Sıkıştırılmış Dosya</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectRight('mp4', 'Video / Film', this)\" class=\"s18-right-btn w-full p-2.5 rounded-xl bg-slate-850 hover:bg-indigo-900/60 border border-slate-700 font-bold text-xs sm:text-sm text-white flex items-center gap-2\">\n                            <span>🎬</span> <span>Video / Film</span>\n                        </button>\n                        <button onclick=\"window.slide18MatchGame.selectRight('jpg', 'Görsel / Fotoğraf', this)\" class=\"s18-right-btn w-full p-2.5 rounded-xl bg-slate-850 hover:bg-indigo-900/60 border border-slate-700 font-bold text-xs sm:text-sm text-white flex items-center gap-2\">\n                            <span>🖼️</span> <span>Görsel / Fotoğraf</span>\n                        </button>\n                    </div>\n                </div>\n\n                <div id=\"s18-fb\" class=\"p-3 rounded-2xl bg-slate-800/80 border border-slate-700 text-slate-300 text-xs sm:text-sm font-semibold text-center min-h-[46px] flex items-center justify-center\">\n                    Eşleştirmek istediğin dosya uzantısına dokun!\n                </div>\n            </div>\n        "},{"id":19,"title":"Hızlı Mini Quiz (5 Soru) 🧠","subtitle":"Canlı Ders Değerlendirmesi","topic":"6. KONU • BTY.5.1.6","badge":"MİNİ TEST","icon":"fa-solid fa-circle-question","bgColor":"from-slate-900 via-indigo-950 to-slate-900","gradient":"from-slate-900 via-indigo-950 to-slate-900","content":"\n            <div class=\"max-w-3xl mx-auto space-y-4 my-auto text-left\" id=\"s19-quiz-box\">\n                <div class=\"flex items-center justify-between border-b border-slate-700/60 pb-2\">\n                    <span id=\"s19-badge\" class=\"px-3 py-1 bg-yellow-400/20 text-yellow-300 font-bold text-xs rounded-full border border-yellow-400/30\">\n                        Soru: 1 / 5\n                    </span>\n                    <span id=\"s19-score\" class=\"text-xs sm:text-sm font-black text-cyan-300\">Puan: 0 / 100</span>\n                </div>\n\n                <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-indigo-500/40 shadow-xl space-y-3\">\n                    <h4 id=\"s19-q-text\" class=\"text-sm sm:text-base font-black text-white leading-relaxed\">\n                        1. 'tatil.jpg' dosyasındaki '.jpg' kısmı dosyanın nesini belirtir?\n                    </h4>\n\n                    <div id=\"s19-opts-container\" class=\"grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1\">\n                        <button onclick=\"window.slide19MiniQuiz.answer(0)\" class=\"s19-opt-btn p-3 rounded-xl bg-slate-800 hover:bg-indigo-600/80 border border-slate-700 text-left font-bold text-xs sm:text-sm text-white transition-all flex items-center gap-2\">\n                            <span class=\"w-6 h-6 rounded-lg bg-slate-900 flex items-center justify-center font-black text-xs text-yellow-400 shrink-0\">A</span>\n                            <span>Dosyanın boyutunu</span>\n                        </button>\n                        <button onclick=\"window.slide19MiniQuiz.answer(1)\" class=\"s19-opt-btn p-3 rounded-xl bg-slate-800 hover:bg-indigo-600/80 border border-slate-700 text-left font-bold text-xs sm:text-sm text-white transition-all flex items-center gap-2\">\n                            <span class=\"w-6 h-6 rounded-lg bg-slate-900 flex items-center justify-center font-black text-xs text-yellow-400 shrink-0\">B</span>\n                            <span>Dosyanın türünü (Resim)</span>\n                        </button>\n                        <button onclick=\"window.slide19MiniQuiz.answer(2)\" class=\"s19-opt-btn p-3 rounded-xl bg-slate-800 hover:bg-indigo-600/80 border border-slate-700 text-left font-bold text-xs sm:text-sm text-white transition-all flex items-center gap-2\">\n                            <span class=\"w-6 h-6 rounded-lg bg-slate-900 flex items-center justify-center font-black text-xs text-yellow-400 shrink-0\">C</span>\n                            <span>Dosyanın oluşturulma yılını</span>\n                        </button>\n                        <button onclick=\"window.slide19MiniQuiz.answer(3)\" class=\"s19-opt-btn p-3 rounded-xl bg-slate-800 hover:bg-indigo-600/80 border border-slate-700 text-left font-bold text-xs sm:text-sm text-white transition-all flex items-center gap-2\">\n                            <span class=\"w-6 h-6 rounded-lg bg-slate-900 flex items-center justify-center font-black text-xs text-yellow-400 shrink-0\">D</span>\n                            <span>Dosyayı yazan kişiyi</span>\n                        </button>\n                    </div>\n\n                    <div id=\"s19-fb\" class=\"hidden\"></div>\n\n                    <div class=\"flex justify-end pt-2\">\n                        <button id=\"s19-next-btn\" onclick=\"window.slide19MiniQuiz.next()\" class=\"hidden px-4 py-2 bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white font-black text-xs rounded-xl shadow-lg flex items-center gap-1.5 transition-all\">\n                            <span>Sonraki Soru 👉</span>\n                        </button>\n                    </div>\n                </div>\n            </div>\n        "},{"id":20,"title":"Konu Özeti ve Çıkış Bileti 🎫","subtitle":"Ders Değerlendirmesi","topic":"6. KONU • BTY.5.1.6","badge":"ÖZET & ÇIKIŞ","icon":"fa-solid fa-ticket","bgColor":"from-slate-900 via-purple-950 to-slate-950","gradient":"from-slate-900 via-purple-950 to-slate-950","content":"\n            <div class=\"max-w-4xl mx-auto space-y-4 my-auto\">\n                <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                    <div class=\"p-5 rounded-2xl bg-slate-850 border-2 border-emerald-500/40 space-y-2\">\n                        <h4 class=\"font-black text-emerald-300 text-sm flex items-center gap-2\">\n                            <span>📌</span> <span>Günün Kritik Özeti</span>\n                        </h4>\n                        <ul class=\"text-xs text-slate-300 space-y-1 list-disc pl-4\">\n                            <li><strong>Dosya:</strong> Veri kayıt birimidir; adı ve uzantısı vardır.</li>\n                            <li><strong>Klasör:</strong> Ortak dosyaları düzenler; uzantısı olmaz.</li>\n                            <li><strong>Kısayollar:</strong> Ctrl+C (Kopyala), Ctrl+X (Kes), Ctrl+V (Yapıştır), Ctrl+Z (Geri Al).</li>\n                            <li><strong>Çöp Kutusu:</strong> Silinen dosyaların ilk bekleme yeridir.</li>\n                            <li><strong>Sıkıştırma:</strong> Boyutu küçültür ve tek arşivde toplar (.zip, .rar).</li>\n                        </ul>\n                    </div>\n\n                    <div class=\"p-5 rounded-2xl bg-amber-950/40 border-2 border-amber-500/40 space-y-2\">\n                        <h4 class=\"font-black text-yellow-300 text-sm flex items-center gap-2\">\n                            <span>🎫</span> <span>Sınıf İçi Çıkış Soruları</span>\n                        </h4>\n                        <ol class=\"text-xs text-amber-100 space-y-1 list-decimal pl-4\">\n                            <li>Dosya uzantısı (soyadı) ne işe yarar?</li>\n                            <li>Kopyalama ile Taşıma arasındaki fark nedir?</li>\n                            <li>Çöp kutusundaki bir dosya nasıl kurtarılır?</li>\n                            <li>Dosya sıkıştırmanın 2 faydası nedir?</li>\n                            <li>Bulut depolamaya nasıl erişilir?</li>\n                        </ol>\n                    </div>\n                </div>\n\n                <div class=\"flex items-center justify-center gap-3 pt-2\">\n                    <button onclick=\"app.currentSlideIndex = 0; app.renderSlides(); sounds.playClick();\" class=\"px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg flex items-center gap-2\">\n                        <i class=\"fa-solid fa-rotate-left\"></i>\n                        <span>Sunumu Baştan Başlat 🔄</span>\n                    </button>\n                    <button onclick=\"app.switchTab('quiz'); sounds.playClick();\" class=\"px-5 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-xs rounded-xl shadow-lg flex items-center gap-2\">\n                        <i class=\"fa-solid fa-circle-question\"></i>\n                        <span>Pekiştirme Sorularına Geç 👉</span>\n                    </button>\n                </div>\n            </div>\n        "}];
        let currentSlide = 0;

        function renderSlide() {
            const s = slides[currentSlide];
            if (!s) return;

            document.getElementById('slide-title').innerHTML = s.title || ('Slayt ' + (currentSlide + 1));
            document.getElementById('slide-subtitle').innerText = s.subtitle || s.topic || '';
            document.getElementById('slide-badge').innerText = s.badge || ('KAZANIM BTY.5');
            document.getElementById('slide-number-top').innerText = 'Slayt ' + (currentSlide + 1) + ' / ' + slides.length;
            document.getElementById('slide-counter').innerText = 'Slayt ' + (currentSlide + 1) + ' / ' + slides.length;

            const iconEl = document.getElementById('slide-icon');
            iconEl.className = s.icon ? (s.icon + ' text-2xl sm:text-3xl text-indigo-400') : 'fa-solid fa-chalkboard-user text-2xl sm:text-3xl text-indigo-400';

            const bodyEl = document.getElementById('slide-body');
            bodyEl.innerHTML = s.content || '<p class="text-slate-400">Bu slayt için içerik bulunmuyor.</p>';

            const noteBox = document.getElementById('slide-note-box');
            const noteText = document.getElementById('slide-note-text');
            if (s.teacherNote) {
                noteText.innerText = s.teacherNote;
                noteBox.classList.remove('hidden');
            } else {
                noteBox.classList.add('hidden');
            }

            // Buton durumları
            document.getElementById('btn-prev').disabled = (currentSlide === 0);
            document.getElementById('btn-next').disabled = (currentSlide === slides.length - 1);

            // Progress bar
            const percent = ((currentSlide + 1) / slides.length) * 100;
            document.getElementById('slide-progress-bar').style.width = percent + '%';

            // Sahne arkaplan gradyanı
            const stage = document.getElementById('slide-stage');
            if (s.gradient || s.bgColor) {
                stage.className = 'w-full max-w-5xl bg-gradient-to-br ' + (s.gradient || s.bgColor) + ' rounded-2xl sm:rounded-3xl border-2 border-indigo-500/30 shadow-2xl p-5 sm:p-8 md:p-10 flex flex-col justify-between min-h-[500px] sm:min-h-[580px] transition-all';
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(idx) {
            currentSlide = idx;
            renderSlide();
            toggleDrawer(false);
        }

        function toggleDrawer(force) {
            const d = document.getElementById('slide-drawer');
            if (force !== undefined) {
                if (force) d.classList.remove('hidden'); else d.classList.add('hidden');
            } else {
                d.classList.toggle('hidden');
            }
            if (!d.classList.contains('hidden')) {
                buildDrawerList();
            }
        }

        function buildDrawerList() {
            const list = document.getElementById('drawer-slide-list');
            list.innerHTML = slides.map((s, idx) => {
                const active = (idx === currentSlide) ? 'bg-indigo-600 text-white font-black' : 'bg-slate-800 hover:bg-slate-700 text-slate-300';
                return '<button onclick="goToSlide(' + idx + ')" class="w-full text-left p-3 rounded-xl ' + active + ' text-xs sm:text-sm flex items-center justify-between transition">' +
                       '<span class="truncate"><b>' + (idx + 1) + '.</b> ' + (s.title || 'Slayt') + '</span>' +
                       '<i class="fa-solid fa-chevron-right text-xs opacity-60"></i>' +
                       '</button>';
            }).join('');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Klavye tuş kontrolleri
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullScreen();
            } else if (e.key === 'Escape') {
                toggleDrawer(false);
            }
        });

        // Başlangıç
        renderSlide();
    </script>
